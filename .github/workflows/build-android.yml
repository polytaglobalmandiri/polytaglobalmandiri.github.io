name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Siapkan keystore penerbitan
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/polyta.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/polyta.jks" >> "$GITHUB_ENV"

      - name: Bangun APK Portal dan Administrator
        run: gradle --no-daemon assemblePortalRelease assembleAdminRelease

      - name: Rapikan nama berkas
        run: |
          version=$(node -p "require('../desktop/electron/package.json').version")
          mkdir -p release
          cp app/build/outputs/apk/portal/release/*.apk "release/Polyta-Portal-${version}-android.apk"
          cp app/build/outputs/apk/admin/release/*.apk "release/Polyta-Administrator-${version}-android.apk"
          ls -l release

      - uses: actions/upload-artifact@v4
        with:
          name: polyta-android
          path: android/release/*.apk
          if-no-files-found: error

      - name: Publikasikan aset tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/release/*.apk
