name: Build Electron Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: polyta-desktop-${{ matrix.platform }}
          path: |
            desktop/electron/release/**/*.AppImage
            desktop/electron/release/**/*.deb
            desktop/electron/release/**/*-win-*.exe
            desktop/electron/release/**/*.dmg
          if-no-files-found: error

      - name: Publikasikan aset tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/electron/release/**/*.AppImage
            desktop/electron/release/**/*.deb
            desktop/electron/release/**/*-win-*.exe
            desktop/electron/release/**/*.dmg
