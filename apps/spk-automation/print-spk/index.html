  // state bersama tanpa mengambil alih fungsi bisnis halaman yang sudah stabil.
  (function registerPolytaAlpineController_() {
    function register_() {
      if (!window.Alpine || window.__polytaPageUiRegistered) return;
      window.__polytaPageUiRegistered = true;

      window.Alpine.data('polytaPageUi', function(pageName) {
        return {
          page: String(pageName || 'app'),
          ready: false,
          online: navigator.onLine,
          init: function() {
            this.ready = true;
          },
          setOnline: function(value) {
            this.online = Boolean(value);
          }
        };
      });
    }

    document.addEventListener('alpine:init', register_);
    if (window.Alpine) register_();
  })();

  <style>
    :root {
      --ink: #171b21;
      --muted: #5f6771;
      --line: #363c43;
      --soft-line: #aeb5bd;
      --paper: #fff;
      --paper-soft: #f5f6f7;
      --header: #2d3642;
      --red: #e32636;
      --blue: #4563b3;
      --green: #2ca846;
      --amber: #a86300;
      --app-page-background:
        radial-gradient(circle at 12% 0%, rgba(255,255,255,.08), transparent 28%),
        repeating-linear-gradient(135deg, rgba(255,255,255,.018) 0 1px, transparent 1px 5px),
        #24272c;

      /* Tumpukan font sistem. Sengaja tanpa unduhan dari luar agar hasil
         cetak tidak bergantung pada koneksi: bila font gagal termuat saat
         mencetak, seluruh tata letak lembar bisa bergeser. Segoe UI dan
         Calibri jauh lebih rapi dari Arial pada cetakan kecil karena
         hurufnya lebih sempit sehingga muat lebih banyak pada lebar sama. */
      --font-sheet: "Segoe UI", Calibri, Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--app-page-background);
    }

    body {
      min-width: 880px;
      margin: 0;
      color: var(--ink);
      background: var(--app-page-background);
      font-family: var(--font-sheet);
    }

    button,
    a {
      font: inherit;
    }

    .print-toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: grid;
      grid-template-columns: minmax(250px, auto) 1fr auto;
      align-items: center;
      gap: 18px;
      min-height: 70px;
      padding: 11px 22px;
      border-top: 1px solid #5a5d63;
      border-bottom: 4px solid #8b1717;
      color: #fff;
      background: linear-gradient(180deg, #4b4e54 0, #303238 45%, #202226 46%, #101114 100%);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.18),
        inset 0 -1px 0 #000,
        0 4px 10px rgba(0,0,0,.45);
    }

    .toolbar-brand span {

    .toolbar-status {

      background: #ef4444;
      box-shadow: 0 0 10px rgba(239,68,68,.7);
    }

    .toolbar-actions {
      justify-content: flex-end;
      gap: 9px;
    }

    .toolbar-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 39px;
      padding: 8px 13px;
      border-radius: 8px;
      font-size: .7rem;
      font-weight: 900;
      letter-spacing: .035em;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
    }

    .toolbar-button.dashboard,
    .toolbar-button.fullscreen {
      border: 1px solid #141922;
      color: #fff;
      background: linear-gradient(180deg, #586373, #3b4552 48%, #242c36 52%, #171c23);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 3px 0 #080a0d;
    }

    .toolbar-button.fullscreen[aria-pressed="true"] {
      border-color: rgba(255,255,255,.35);
      background: linear-gradient(180deg, #727e8f, #4b5868 48%, #313c49 52%, #202832);
      box-shadow: inset 0 2px 5px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.12);
    }

    .toolbar-button.fullscreen {
      width: 104px;
      flex: 0 0 104px;
      gap: 6px;
      padding: 0 11px;
      font-size: .72rem;
      font-weight: 650;
      letter-spacing: normal;
      line-height: 1;
      text-transform: none;
      white-space: nowrap;
    }

    .toolbar-button.secondary {
      border: 1px solid #777c81;
      color: #25292e;
      background: linear-gradient(180deg, #fff, #ececea 48%, #c8cac8 52%, #a7abab);
      box-shadow: inset 0 1px 0 #fff, 0 3px 0 #62666a;
    }

    .toolbar-button.primary {
      border: 1px solid #741014;
      color: #fff;
      background: linear-gradient(180deg, #ef5059, #d5323d 47%, #b31b26 52%, #841018);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 3px 0 #5f090e;

    .toolbar-button:disabled {
      cursor: wait;

      opacity: .62;

    .toolbar-button[hidden] {
      display: none !important;
    }

    .workspace {
      width: max-content;
      min-width: 100%;
      padding: 26px;
    }

    .print-sheet {
      /* Angka bertabulasi agar kolom KG, persen, dan tanggal lurus ke bawah
         pada tabel isian. Tanpa ini lebar tiap digit berbeda dan deretan
         angka terlihat bergoyang. */
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      position: relative;
      width: 210mm;
      height: 148mm;
      min-height: 148mm;
      margin: 0 auto 26px;
      padding: 4.2mm 4.6mm 4mm;
      overflow: hidden;
      color: #12161b;
      background: var(--paper);
      border-radius: 2px;
      box-shadow:
        0 2px 0 #91969b,
        0 18px 50px rgba(0,0,0,.38);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;

    .print-sheet::before {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 1.35mm;

    .page-content {

    .master-name span {

    .master-code {

    .master-code span,

      padding: 1mm;

    .master-code span {

      font-size: 6.75px;
      font-weight: 800;
    }

    .master-code strong {
      font-size: 8.99px;
    }

    .master-company {
      gap: 1.27mm;
    }

    .master-company .mini-logo {
      width: 8mm;
      height: 8mm;
      flex: 0 0 8mm;
    }

    .master-company strong,
    .master-company small {
      display: block;
    }

    .master-company strong {
      font-size: 9.28px;
    }

    .master-company small {
      margin-top: .6mm;
      color: #59616a;
      font-size: 5.84px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .release-stamp {
      display: flex !important;

      font-weight: 900;

    .field-line {

    .field-line span {

    .order-type {

      font-weight: 800;

      margin-right: .8mm;
      content: "□";
      font-size: 8.86px;
    }

    .order-type span.is-active::before {
      color: var(--green);
      content: "✓";
    }

    .master-route h3,
    .master-note h3 {
      margin: 0 0 1mm;
      font-size: 7.14px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .route-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .7mm 1.2mm;
    }

    .route-item {
      display: flex;
      align-items: center;
      gap: 0.59mm;
      min-width: 0;
      color: #7b8289;
      font-size: 6.36px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .route-item::before {
      content: "□";
      font-size: 7.14px;
    }

    .route-item.is-active {
      color: #171b21;
    }

    .route-item.is-active::before {
      color: var(--green);
      content: "✓";
    }

    .master-note p {
      height: 21mm;
      margin: 0;
      padding: 1.2mm;
      overflow: hidden;
      border: .25mm solid #555c64;
      background: #fff;
      font-size: 6.62px;
      font-weight: 600;
      line-height: 1.28;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .process-section {
      border-top: .35mm solid var(--line);
    }

    .process-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 6.1mm;
      padding: 1mm 1.8mm;
      color: #fff;
      background: var(--header);
      font-size: 9.09px;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;

    .process-title span {

      font-size: 6.11px;
      letter-spacing: .035em;

    .process-fields {

      padding: 1.3mm 1.7mm;
      border-bottom: .25mm solid var(--line);
    }

    .process-fields.cols-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .process-fields.cols-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    .process-field {
      display: grid;
      grid-template-columns: 20mm 1fr;
      align-items: center;
      min-width: 0;
      border-bottom: .18mm solid #858c94;
    }

    .process-field span,
    .process-field strong {
      min-width: 0;
      padding: .45mm .5mm;
      font-size: 6.62px;
      line-height: 1.12;
    }

    .process-field span {
      color: #505861;
      font-weight: 700;
    }

    .process-field strong {
      overflow-wrap: anywhere;
    }

    .process-field.wide {
      grid-column: span 2;
    }

    .grid-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .grid-table th,
    .grid-table td {
      border: .18mm solid #555c64;
      padding: .55mm .6mm;
      font-size: 6.04px;
      line-height: 1.08;
      text-align: center;
      vertical-align: middle;
    }

    .grid-table th {
      color: #313841;
      background: #eef0f2;
      font-weight: 900;
    }

    .grid-table tbody td {
      height: 5.1mm;
    }

    .grid-table .left {
      text-align: left;
    }

    .grid-table .right {
      text-align: right;
    }

    .grid-table tfoot th,
    .grid-table tfoot td {
      background: #f0f2f4;
      font-weight: 900;
    }

    .process-table-wrap {
      padding: 1.2mm 1.5mm 1.5mm;
    }

    .mixer-layout {
      display: grid;
      grid-template-columns: .8fr 2.2fr;

      padding: 1.3mm 1.5mm 1mm;
      border-bottom: .25mm solid var(--line);

    .mixer-fields {
      display: grid;
      align-content: start;
      gap: 0.85mm;
    }

    .mixer-fields .process-field {
      grid-template-columns: 17mm 1fr;
    }

    .mixer-composition tbody td {
      height: 3.35mm;
    }

    .mixer-log tbody td {
      height: 5.4mm;
    }

    .roll-log thead tr:first-child th {
      background: #e2e5e8;
    }

    .fold-log tbody td,
    .cutting-log tbody td {
      height: 5.45mm;
    }

    .printing-grid {
      display: grid;
      grid-template-columns: 3fr 1.05fr;
      gap: 1.02mm;
      padding: 1.2mm 1.4mm 1.5mm;
    }

    .printing-main tbody td {
      height: 5mm;
    }

    .printing-side tbody td {
      height: 4mm;
    }

    .support-box {
      margin-top: 1.2mm;
      padding: 1mm;
      border: .2mm solid #555c64;
      font-size: 6.11px;
      line-height: 1.35;
    }

    .support-box strong {
      display: block;
      margin-bottom: .7mm;
      font-size: 6.49px;
      text-transform: uppercase;
    }

    .cutting-top {
      display: grid;
      grid-template-columns: 1.6fr .9fr;
      gap: 1.7mm;
      min-height: 25mm;
      padding: 1.3mm 1.6mm;
      border-bottom: .25mm solid var(--line);
    }

    .cutting-fields {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: .8mm 2mm;
    }

    .cutting-metrics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      align-content: start;
      gap: 0.85mm;
    }

    .cutting-metrics .metric-box {
      min-height: 8mm;
      padding: 1mm;
      border: .2mm solid #7e858d;
      font-size: 6.11px;
    }

    .metric-box strong {
      display: block;
      margin-bottom: .8mm;
      text-transform: uppercase;
    }

    /* Tabel penimbangan pada blok Cutting mengikuti lembar SPK asli:
       tiga baris standar/maksimal/minimal dengan kolom MIC.PO dan MIC.ACT
       yang sengaja dibiarkan kosong untuk diisi tangan. */
    .metric-box .weigh-table {
      width: 100%;
      margin-top: .3mm;
    }

    .metric-box .weigh-table th,
    .metric-box .weigh-table td {
      padding: .25mm .4mm;
      font-size: 5.71px;
      line-height: 1.15;
    }

    .metric-box .weigh-table th.left {
      text-align: left;
      font-weight: 600;
      text-transform: none;
    }

    .po-sheet .page-content {
      padding-top: .3mm;
    }

    .po-head {
      display: grid;
      grid-template-columns: 1.05fr .88fr 1.07fr;
      align-items: center;
      min-height: 18mm;
      border-bottom: .35mm solid var(--line);
    }

    .po-company,
    .po-title,
    .po-reference {
      min-width: 0;
      padding: 1.2mm 1.8mm;
    }

    .po-company {
      display: flex;
      align-items: center;
      gap: 1.53mm;
    }

    .po-company .mini-logo {
      width: 10mm;
      height: 10mm;
    }

    .po-company strong,
    .po-company span {
      display: block;
    }

    .po-company strong {
      font-size: 9.35px;
    }

    .po-company span {
      margin-top: .7mm;
      font-size: 6.11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .po-title {
      text-align: center;
    }

    .po-title small,
    .po-title strong {
      display: block;
    }

    .po-title small {
      color: #6b737c;
      font-size: 6.23px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .po-title strong {
      margin-top: .8mm;
      font-size: 11.5px;
      letter-spacing: .04em;
    }

    .po-reference {
      display: grid;
      grid-template-columns: 1fr auto;

      align-items: center;
    }

    .po-reference-data {
      display: grid;
      gap: 0.59mm;
    }

    .po-reference-data strong {
      font-size: 8.86px;
    }

    .po-reference-data span {
      padding-bottom: .7mm;
      border-bottom: .2mm solid #7c838b;
      font-size: 6.49px;
    }

    .po-main-grid {
      display: grid;
      grid-template-columns: 1.02fr .93fr 1.2fr;
      min-height: 90mm;
      border-bottom: .35mm solid var(--line);
    }

    .po-panel {
      min-width: 0;
      padding: 1.4mm;
      border-right: .22mm solid #7d848c;
    }

    .po-panel:last-child {
      border-right: 0;

      margin: 0 0 1mm;
      padding-bottom: .7mm;

      text-align: center;

      padding: .5mm;

    .po-signature span {
      font-size: 5.97px;
    }

    .po-signature strong {
      padding-top: .7mm;
      border-top: .2mm solid #555c64;
      font-size: 6.11px;
      text-transform: uppercase;

    .loading-card,
    .error-card {
      width: min(92vw, 600px);
      margin: 10vh auto;
      padding: 30px;
      border: 1px solid #85898e;
      border-radius: 15px;
      background: linear-gradient(145deg, #f8f9f9, #dfe2e5);
      box-shadow: inset 0 1px 0 #fff, 0 4px 0 #55595e, 0 20px 55px rgba(0,0,0,.42);
      text-align: center;

    .error-card strong {
      display: block;
      margin-bottom: 8px;
      font-size: 1.15rem;
    }

    .loading-card p,
    .error-card p {
      margin: 0;
      color: #5c6269;
      line-height: 1.5;
    }

    .spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 15px;
      border: 4px solid #bec3c7;
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }

      html,
      body {
        min-width: 0;
        background: #fff !important;
      }

      .no-print {
        display: none !important;
      }

      .workspace {
        width: auto;
        min-width: 0;
        padding: 0;
      }

      .print-page {
        position: relative;
        width: 210mm;
        height: 148.5mm;
        margin: 0;
        padding: 0;
        page-break-inside: avoid !important;
        page-break-after: auto;
        break-inside: avoid-page !important;
        break-after: auto;
      }

      .print-page + .print-page {
        page-break-before: auto;
        break-before: auto;
      }

      .print-page:last-child .print-sheet {
        top: 0;
        height: 148.5mm;
        min-height: 148.5mm;
      }

      .print-sheet {
        display: block;
        width: 210mm;
        height: 148.5mm;
        min-height: 148.5mm;
        margin: 0;
        padding: 4.2mm 4.6mm 4mm;
        border-radius: 0;
        box-shadow: none;
        page-break-inside: avoid !important;
        page-break-after: auto;
        page-break-before: auto;
        break-inside: avoid-page !important;
        break-after: auto;
        break-before: auto;
      }

      .page-content {
        page-break-inside: avoid !important;
        break-inside: avoid-page !important;
      }
    }

    @media screen {
      html {
        font-size: 15px;
      }

    /* Judul panel dibuat sama tinggi dan teksnya ditengahkan secara vertikal,
       sehingga isi ketiga panel mulai pada garis yang sama.
       Judul terpanjang, "Urutan Proses & Target BS", hanya sekitar 31mm pada

    /* Kotak diberi jarak dari sisi kiri, kanan, dan bawah bingkai lembar

       diatur, sehingga kotak melebar rata dengan tepi frame dan terlihat

    .po-article-note-body {

      <a class="toolbar-button dashboard polyta-portal-home no-print" href="/" target="_top" title="Kembali ke portal utama">
        <i class="fa-solid fa-house" aria-hidden="true"></i><span>Portal Utama</span>
      </a>
      <button id="btnFullscreen"
        class="toolbar-button fullscreen"
        type="button"
        aria-pressed="false"
        title="Buka tampilan layar penuh"
      >
        <i id="fullscreenIcon" class="fa-solid fa-expand" aria-hidden="true"></i>
        <span id="fullscreenLabel">Layar Penuh</span>
      </button>
      <button id="printButton" class="toolbar-button primary" type="button" disabled>
        Cetak &amp; Tandai Release
      </button>
    </div>
  </header>

  <main id="printRoot" class="workspace tw:transition-opacity tw:duration-200">
    <div class="loading-card">
      <div class="spinner" aria-hidden="true"></div>
      <strong>Menyiapkan paket SPK</strong>
      <p>PO Produksi dan formulir setiap alur sedang disusun.</p>
    </div>
  </main>

  <script>
    const REQUESTED_SPK = new URLSearchParams(window.location.search).get('spk') || '';
    // Petunjuk baris Database dari halaman pemanggil; server tetap memverifikasi.
    let requestedDbRow = Math.max(0, Math.floor(Number(new URLSearchParams(window.location.search).get('row')) || 0));
    const PRINT_MODE =
      document.body.dataset.mode === 'view' ||
      new URLSearchParams(window.location.search).get('mode') === 'view'
        ? 'view'
        : 'release';

    const PROCESS_DEFINITIONS = [
      { key: 'mixer', label: 'Pencampuran' },
      { key: 'blowing', label: 'Peniupan' },
      { key: 'printing', label: 'Pencetakan' },
      { key: 'slitting', label: 'Pembelahan' },
      { key: 'folding', label: 'Pelipatan' },
      { key: 'gusset', label: 'Pembentukan Lipatan' }
    ];

    const BS_DEFINITIONS = [
      { key: 'blowing', label: 'Peniupan' },
      { key: 'printing', label: 'Pencetakan' },
      { key: 'slitting', label: 'Pembelahan' },
      { key: 'folding', label: 'Pelipatan' },
      { key: 'gusset', label: 'Pembentukan Lipatan' },
      { key: 'sheet', label: 'Lembaran' },
      { key: 'pon', label: 'Pon' },
      { key: 'tshirt', label: 'Kantong Kaos' },
      { key: 'bottomSeal', label: 'Segel Bawah' },
      { key: 'sideSeal', label: 'Segel Samping' },
      { key: 'handle', label: 'Pegangan' },
      { key: 'sheetSlitting', label: 'Pembelahan Lembaran' }
    ];

    const printRootEl = document.getElementById('printRoot');
    const printButtonEl = document.getElementById('printButton');
    const toolbarStatusEl = document.getElementById('toolbarStatus');
    const toolbarStatusTextEl = document.getElementById('toolbarStatusText');
    let currentPrintData = null;
    let releaseRequestInFlight = false;

    document.addEventListener('DOMContentLoaded', function () {
      initializeFullscreen_();
      loadPrintData_();
    });

    function initializeFullscreen_() {
      const button = document.getElementById('btnFullscreen');
      if (!button) return;

      button.addEventListener('click', toggleAppFullscreen_);
      document.addEventListener('fullscreenchange', syncFullscreenButton_);
      document.addEventListener('webkitfullscreenchange', syncFullscreenButton_);
      document.addEventListener('keydown', event => {
        if (event.key !== 'Escape' || !document.body.classList.contains('app-focus-mode')) return;
        document.body.classList.remove('app-focus-mode');
        syncFullscreenButton_();
      });
      syncFullscreenButton_();
    }

    function toggleAppFullscreen_() {
      const nativeFullscreen =
        document.fullscreenElement ||
        document.webkitFullscreenElement;
      const fallbackActive = document.body.classList.contains('app-focus-mode');

      if (nativeFullscreen) {
        const exitFullscreen =
          document.exitFullscreen ||
          document.webkitExitFullscreen;
        if (exitFullscreen) {
          Promise.resolve(exitFullscreen.call(document))
            .catch(() => {
              document.body.classList.remove('app-focus-mode');
              syncFullscreenButton_();
            });
          return;
        }
      }

      if (fallbackActive) {
        document.body.classList.remove('app-focus-mode');
        syncFullscreenButton_();
        return;
      }

      const root = document.documentElement;
      const requestFullscreen =
        root.requestFullscreen ||
        root.webkitRequestFullscreen;

      if (!requestFullscreen) {
        enableFullscreenFallback_();
        return;
      }

      try {
        const requestResult = requestFullscreen.call(root);
        if (requestResult && typeof requestResult.catch === 'function') {
          requestResult.catch(enableFullscreenFallback_);
        }
      } catch (error) {
        enableFullscreenFallback_();
      }
    }

    function enableFullscreenFallback_() {
      document.body.classList.add('app-focus-mode');
      syncFullscreenButton_();
    }

    function syncFullscreenButton_() {
      const button = document.getElementById('btnFullscreen');
      const icon = document.getElementById('fullscreenIcon');
      const label = document.getElementById('fullscreenLabel');
      if (!button || !icon || !label) return;

      const active = Boolean(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.body.classList.contains('app-focus-mode')
      );

      button.setAttribute('aria-pressed', String(active));
      button.title = active ? 'Keluar dari layar penuh' : 'Buka tampilan layar penuh';
      icon.className = active ? 'fa-solid fa-compress' : 'fa-solid fa-expand';
      label.textContent = active ? 'Keluar Penuh' : 'Layar Penuh';
    }
    printButtonEl.addEventListener('click', function () {
      if (PRINT_MODE === 'release') requestReleaseAndPrint_(true);
    });

    window.addEventListener('beforeprint', function () {
      // Aturan @media print mengubah tata letak, jadi hasil pengukuran versi
      // layar tidak bisa dipakai ulang di sini.
      fitAllPages_(true);
      if (
        PRINT_MODE === 'release' &&
        currentPrintData &&
        currentPrintData.release !== 'YA' &&
        !releaseRequestInFlight &&
        hasAppsScriptRuntime_()
      ) {
        requestReleaseAndPrint_(false);
      }
    });
    // Pendaftaran beforeprint kedua dihapus: sebelumnya fitAllPages_ berjalan
    // dua kali pada setiap pencetakan karena terdaftar di dua tempat.
    //
    // resize juga tidak lagi memanggil langsung. Sekali menggeser jendela
    // memicu puluhan event, dan tiap event mengukur ulang seluruh halaman.
    // Sekarang diredam menjadi satu kali per frame.
    var fitFrameHandle = 0;
    window.addEventListener('resize', function () {
      if (fitFrameHandle) window.cancelAnimationFrame(fitFrameHandle);
      fitFrameHandle = window.requestAnimationFrame(function () {
        fitFrameHandle = 0;
        fitAllPages_();
      });
    });

    window.addEventListener('afterprint', function () {
      if (PRINT_MODE === 'release' && currentPrintData && currentPrintData.release === 'YA') {
        setToolbarStatus_('Dokumen telah ditandai Release = YA.', 'ready');
      }
    });

    function hasAppsScriptRuntime_() {
      return typeof google !== 'undefined' && google.script && google.script.run;
    }

    function loadPrintData_() {
      const requested = REQUESTED_SPK.trim();

      if (hasAppsScriptRuntime_()) {
        if (!requested) {
          showLoadError_('Nomor SPK tidak tersedia pada tautan cetak.');
          return;
        }

        google.script.run
          .withSuccessHandler(handlePrintDataResponse_)
          .withFailureHandler(function (error) {
            showLoadError_(error && error.message ? error.message : 'Data SPK gagal dimuat.');
          })
          .getSpkPrintData(requested, requestedDbRow);
        return;
      }

      handlePrintDataResponse_({
        status: 'success',
        found: true,
        data: getLocalPreviewData_()
      });
    }

    function handlePrintDataResponse_(response) {
      if (!response || response.status !== 'success' || !response.found || !response.data) {
        showLoadError_(response && response.message ? response.message : 'Data SPK tidak ditemukan.');
        return;
      }

      currentPrintData = response.data;
      // Baris hasil verifikasi server dipakai ulang saat menandai Release,
      // sehingga tombol cetak tidak perlu mencari baris dari awal.
      if (currentPrintData.rowNumber) requestedDbRow = currentPrintData.rowNumber;
      renderPrintPack_(currentPrintData);
      printButtonEl.hidden = PRINT_MODE === 'view';
      printButtonEl.disabled = PRINT_MODE !== 'release';
      setToolbarStatus_(
        PRINT_MODE === 'view'
          ? 'Mode Lihat Saja. Release tidak diubah.'
          : currentPrintData.release === 'YA'
            ? 'Paket SPK sudah pernah di-release dan siap dicetak ulang.'
            : 'Paket siap. Release menjadi YA setelah tombol cetak ditekan.',
        'ready'
      );
    }

    function requestReleaseAndPrint_(openPrintDialog) {
      if (!currentPrintData || releaseRequestInFlight || PRINT_MODE !== 'release') return;

      if (!hasAppsScriptRuntime_()) {
        applyReleaseToUi_('YA');
        if (openPrintDialog) window.print();
        return;
      }

      releaseRequestInFlight = true;
      printButtonEl.textContent = 'MENANDAI RELEASE...';
      setToolbarStatus_('Memperbarui kolom BV (Release)...', '');

      // Dialog cetak dibuka lebih dulu, penandaan Release berjalan paralel.
      // Menunggu jawaban server dulu membuat tombol terasa lambat 1-4 detik
      // tanpa manfaat: penandaannya idempoten, dan jalur Ctrl+P memang sudah
      // menembakkannya secara paralel lewat beforeprint.
      if (openPrintDialog) window.print();

      google.script.run
        .withSuccessHandler(function (response) {
          releaseRequestInFlight = false;
          printButtonEl.disabled = false;
          printButtonEl.textContent = 'CETAK & TANDAI RELEASE';

          if (!response || response.status !== 'success') {
            setToolbarStatus_(
              response && response.message ? response.message : 'Status Release gagal diperbarui.',
              'error'
            );
            return;
          }

          applyReleaseToUi_('YA');
          setToolbarStatus_(response.message || 'Release berhasil diperbarui.', 'ready');
        })
        .withFailureHandler(function (error) {
          releaseRequestInFlight = false;
          printButtonEl.disabled = false;
          printButtonEl.textContent = 'CETAK & TANDAI RELEASE';
          setToolbarStatus_(
            error && error.message ? error.message : 'Status Release gagal diperbarui.',
            'error'
          );
        })
        .markSpkReleasedForPrint(currentPrintData.spk, requestedDbRow);
    }

    function applyReleaseToUi_(release) {
      if (!currentPrintData) return;
      currentPrintData.release = release;
      const released = release === 'YA';
      const releaseLabel = released ? 'RELEASE' : 'NON RELEASE';

      document.querySelectorAll('[data-release-badge]').forEach(function (badge) {
        badge.classList.toggle('is-released', released);
        badge.classList.toggle('is-non-release', !released);
        badge.innerHTML = '<span>' + releaseLabel + '</span>';
      });
      document.querySelectorAll('[data-release-footer]').forEach(function (footer) {
        footer.textContent = 'Status: ' + releaseLabel;
      });
    }

    function setToolbarStatus_(message, state) {
      toolbarStatusTextEl.textContent = message;
      toolbarStatusEl.classList.toggle('is-ready', state === 'ready');
      toolbarStatusEl.classList.toggle('is-error', state === 'error');
    }

    function showLoadError_(message) {
      printButtonEl.disabled = true;
      setToolbarStatus_(message, 'error');
      printRootEl.innerHTML = `
        <div class="error-card">
          <strong>Dokumen tidak dapat disiapkan</strong>
          <p>${escapeHtml_(message)}</p>
        </div>
      `;
    }

    // Satu lembar untuk satu langkah alur. Proses yang dijalankan dua kali
    // menghasilkan dua lembar terpisah dengan ukuran dan target BS masing
    // masing. SPK lama yang belum menyimpan urutan tetap dicetak seperti
    // sebelumnya: satu lembar per proses aktif, mengikuti urutan baku.
    function buildRoutingForms_(data) {
      const labelOf = {};
      PROCESS_DEFINITIONS.forEach(function (process) { labelOf[process.key] = process.label; });

      const steps = Array.isArray(data.routingSteps) ? data.routingSteps : [];
      if (!steps.length) {
        const legacy = [];
        PROCESS_DEFINITIONS.forEach(function (process) {
          if (data.proses && data.proses[process.key]) legacy.push({ key: process.key, label: process.label });
        });
        if (isMeaningful_(data.finishing) || isMeaningful_(data.handlePm)) {
          legacy.push({ key: 'cutting', label: cuttingTitle_(data) });
        }
        return legacy;
      }

      const totals = {};
      steps.forEach(function (step) {
        totals[step.key] = (totals[step.key] || 0) + 1;
      });

      const seen = {};
      const forms = [];
      steps.forEach(function (step) {
        const values = step && step.values ? step.values : {};
        const isCutting = step.key === 'cutting';
        if (!isCutting && !labelOf[step.key]) return;
        if (isCutting && !isMeaningful_(values.finishing) && !isMeaningful_(values.handlePm)) return;

        seen[step.key] = (seen[step.key] || 0) + 1;
        const label = isCutting
          ? cuttingTitle_({ finishing: values.finishing, handlePm: values.handlePm })
          : labelOf[step.key];
        const repeats = totals[step.key] > 1;

        forms.push({
          key: step.key,
          label: label,
          step: step,
          pageLabel: repeats
            ? label + ' (' + seen[step.key] + ' dari ' + totals[step.key] + ')'
            : label
        });
      });

      return forms;
    }

    function formStepValues_(form) {
      return form && form.step && form.step.values ? form.step.values : null;
    }

    // Nilai langkah didahulukan; bila langkahnya tidak menyimpan isian itu,
    // dipakai kolom ringkasan dari Database seperti perilaku lama.
    function formValue_(data, form, fieldId, dataKey) {
      const values = formStepValues_(form);
      if (values && Object.prototype.hasOwnProperty.call(values, fieldId)) return values[fieldId];
      return data[dataKey === undefined ? fieldId : dataKey];
    }

    function formBs_(data, form, bsKey) {
      const values = formStepValues_(form);
      const fieldId = 'bs-' + bsKey;
      if (values && Object.prototype.hasOwnProperty.call(values, fieldId)) {
        const parsed = parseFloat(values[fieldId]);
        return Number.isFinite(parsed) ? parsed : 0;
      }
      return data.bsPercent ? data.bsPercent[bsKey] : '';
    }

    function formNote_(data, form) {
      let noteKey = form.key;
      if (form.key === 'cutting') {
        noteKey = finishingNoteKey_(formValue_(data, form, 'finishing'));
      }
      if (!noteKey) return '';

      const values = formStepValues_(form);
      const fieldId = 'ket-' + noteKey;
      if (values && Object.prototype.hasOwnProperty.call(values, fieldId)) {
        return String(values[fieldId] || '').trim();
      }
      return processNote_(data, noteKey);
    }

    // Penanda urutan pemakaian, hanya muncul bila prosesnya memang berulang.
    function formRepeatSuffix_(form) {
      if (!form || !form.pageLabel || form.pageLabel === form.label) return '';
      return form.pageLabel.slice(form.label.length);
    }

    // Bag dicatat sebagai jumlah ball per outer, Roll sebagai isi per roll
    // beserta satuannya. Keduanya berasal dari langkah Cutting yang dicetak.
    function packingDetailText_(data, form) {
      const packing = String(formValue_(data, form, 'packing') || '').trim();
      const upper = packing.toUpperCase();
      if (upper === 'BAG') {
        const ball = String(formValue_(data, form, 'packingOuterBall') || '').trim();
        return ball === '' ? packing : packing + ' · ' + ball + ' ball/outer';
      }
      if (upper === 'ROLL') {
        const nilai = String(formValue_(data, form, 'packingRollNilai') || '').trim();
        const uom = String(formValue_(data, form, 'packingRollUom') || '').trim();
        if (nilai === '') return packing;
        return packing + ' · ' + nilai + (uom ? ' ' + uom : '');
      }
      return packing;
    }

    // Jenis bahan dan film kini satu kolom di Data Utama, jadi dicetak juga
    // sebagai satu baris.
    function bahanFilmText_(data) {
      return [data.material, data.film]
        .map(function (value) { return String(value || '').trim(); })
        .filter(Boolean)
        .join(' · ');
    }

    // Mode Lembaran menggandakan PCS/KG, jadi modenya ikut dicetak supaya
    // angkanya dapat ditelusuri.
    function pcsPerKgText_(data) {
      const base = formatNumber_(data.pcsPerKg, 2);
      const mode = String(data.pcsKgMode || '').trim();
      return mode ? base + ' (' + mode + ')' : base;
    }

    // Toleransi order dan toleransi produksi ditulis berdampingan.
    function toleransiText_(data) {
      const order = formatPercent_(data.toleransi);
      const produksi = Number(data.toleransiProduksi);
      if (!Number.isFinite(produksi) || produksi <= 0) return order;
      return order + ' / prod ' + formatPercent_(produksi);
    }

    // Bila ada jadwal bertahap, jumlah tahapnya disebut di samping tanggal.
    function tanggalKirimText_(data) {
      const base = formatDate_(data.etd);
      const jadwal = Array.isArray(data.pengirimanParsial) ? data.pengirimanParsial : [];
      // Satu tahap berarti kiriman sekaligus, jadi penanda tahap hanya ditulis
      // bila pengirimannya memang dibagi.
      return jadwal.length > 1 ? base + ' (' + jadwal.length + ' tahap)' : base;
    }

    // Ukuran bahan yang diketik manual pada form didahulukan; hasil hitungan
    // Spreadsheet di kolom M:Q hanya dipakai bila kolom manualnya kosong.
    const MANUAL_DIMENSION_KEYS = {
      lebar: 'bahanLebar',
      panjang: 'bahanPanjang',
      tebal: 'bahanTebal'
    };

    function dimensionText_(data, key, decimals) {
      const manual = Number(data[MANUAL_DIMENSION_KEYS[key]]);
      if (Number.isFinite(manual) && manual > 0) return formatNumber_(manual, decimals);

      const component = data.ukuranKomponen || {};
      const value = Number(component[key]);
      return Number.isFinite(value) && value > 0 ? formatNumber_(value, decimals) : '';
    }

    function cuttingBsForForm_(data, form) {
      const values = formStepValues_(form);
      if (!values) return cuttingBs_(data);

      const scoped = {
        finishing: values.finishing,
        handlePm: values.handlePm,
        modelKantong: data.modelKantong,
        bsPercent: {}
      };
      ['bottomSeal', 'sideSeal', 'tshirt', 'handle', 'pon'].forEach(function (key) {
        scoped.bsPercent[key] = formBs_(data, form, key);
      });
      return cuttingBs_(scoped);
    }

    function renderPrintPack_(data) {
      const forms = [{ key: 'po', label: 'PO Produksi' }].concat(buildRoutingForms_(data));

      const totalPages = forms.length;
      const generatedText = formatDateTime_(new Date());
      printRootEl.innerHTML = forms.map(function (form, index) {
        let page = '';
        if (form.key === 'po') {
          page = buildPoPage_(data, index + 1, totalPages, generatedText);
        } else {
          page = buildProcessPage_(data, form, index + 1, totalPages, generatedText);
        }
        return '<div class="print-page">' + page + '</div>';
      }).join('');

      window.requestAnimationFrame(function () { fitAllPages_(true); });
    }

    // Lebar jendela terakhir saat penyesuaian dijalankan. Hasil penyesuaian
    // hanya bergantung pada lebar; bila tidak berubah, pengukuran ulang tidak
    // menghasilkan apa pun dan cukup dilewati.
    let lastFitWidth = -1;

    // Versi lama menulis gaya lalu membaca scrollHeight secara bergantian, di
    // dalam perulangan, untuk setiap halaman. Tiap pembacaan setelah penulisan
    // memaksa browser menghitung ulang seluruh tata letak. Dengan tujuh
    // halaman berisi tabel bersarang, itu berarti puluhan perhitungan ulang
    // dan terasa berat, terutama saat dialog cetak dibuka.
    //
    // Sekarang penulisan dan pembacaan dikelompokkan: semua halaman diukur
    // dulu, baru semua gaya ditulis. Dua putaran sudah cukup karena putaran
    // kedua hanya menghaluskan hasil putaran pertama.
    function fitAllPages_(force) {
      const viewportWidth = window.innerWidth;
      if (!force && viewportWidth === lastFitWidth) return;
      lastFitWidth = viewportWidth;

      const sheets = [];
      document.querySelectorAll('.print-sheet').forEach(function (sheet) {
        const content = sheet.querySelector('.page-content');
        const footer = sheet.querySelector('.page-footer');
        if (content && footer) sheets.push({ sheet, content, footer, scale: 1 });
      });
      if (!sheets.length) return;

      // Tulis: kembalikan semua halaman ke keadaan tanpa penyusutan.
      sheets.forEach(function (item) {
        item.content.style.zoom = '';
        item.content.style.width = '100%';
        item.content.style.transform = 'none';
      });

      // Baca: ambil tinggi tersedia dan tinggi yang dibutuhkan sekaligus.
      sheets.forEach(function (item) {
        item.available = Math.max(1, item.footer.offsetTop - item.content.offsetTop - 4);
        item.required = Math.max(1, item.content.scrollHeight);
      });

      // Tulis hasil akhir. Satu putaran sudah cukup: zoom menyusutkan tata
      // letaknya secara seragam, jadi tinggi berubah linear terhadap skala.
      // Cara lama memakai transform disertai pelebaran width ke (100/skala)%,
      // yang mengubah pembungkusan teks sehingga perlu diukur berulang.
      sheets.forEach(function (item) {
        let scale = Math.min(1, item.available / item.required);
        if (scale >= 0.995) {
          scale = 1;
          item.content.style.zoom = '';
        } else {
          item.content.style.zoom = String(scale);
        }
        item.sheet.dataset.fitScale = scale.toFixed(3);
      });
    }

    function buildPoPage_(data, pageNumber, totalPages, generatedText) {
      const component = data.ukuranKomponen || {};
      // Enam baris agar tingginya sama persis dengan tabel Target BS di panel
      // sebelahnya, yang juga enam baris.
      const compositionItems = Array.isArray(data.komposisi) ? data.komposisi.slice(0, 6) : [];
      const compositionRows = Array.from({ length: 6 }, function (_, index) {
        const item = compositionItems[index] || {};
        return `
          <tr>
            <td>${index + 1}</td>
            <td class="left">${escapeHtml_(item.material || '')}</td>
            <td class="right">${item.kg === '' || item.kg === undefined ? '' : formatNumber_(item.kg, 2)}</td>
            <td class="right">${item.percent === '' || item.percent === undefined ? '' : formatPercent_(item.percent)}</td>
          </tr>
        `;
      }).join('');

      const bsRows = Array.from({ length: 6 }, function (_, index) {
        const left = BS_DEFINITIONS[index];
        const right = BS_DEFINITIONS[index + 6];
        return `
          <tr>
            <td class="left">${escapeHtml_(left.label)}</td>
            <td>${formatPercent_(data.bsPercent && data.bsPercent[left.key])}</td>
            <td class="left">${escapeHtml_(right.label)}</td>
            <td>${formatPercent_(data.bsPercent && data.bsPercent[right.key])}</td>
          </tr>
        `;
      }).join('');

      return `
        <section class="print-sheet po-sheet">
          <div class="page-content master-frame">
            <header class="po-head">
              <div class="po-company">
                <div class="mini-logo">${buildPolytaLogo_()}</div>
                <div>
                  <strong>PT POLYTA GLOBAL MANDIRI</strong>
                  <span>Industri Kemasan Plastik</span>
                </div>
              </div>
              <div class="po-title">
                <small>Surat Perintah Kerja</small>
                <strong>PO PRODUKSI</strong>
              </div>
              <div class="po-reference">
                <div class="po-reference-data">
                  <strong>SPK ${escapeHtml_(displayValue_(data.spk))}</strong>
                  <span>Tanggal SPK: ${escapeHtml_(formatDate_(data.tanggal))}</span>
                  <span>Nomor PO: ${escapeHtml_(displayValue_(data.nomorPO))}</span>
                  <span>PO Masuk: ${escapeHtml_(formatDate_(data.poMasuk))}</span>
                </div>
                ${releaseStamp_(data)}
              </div>
            </header>

            <div class="po-main-grid">
              <section class="po-panel">
                <h2>Data Utama</h2>
                <div class="po-panel-head">
                ${/* Data Utama menyisakan identitas order dan sisi komersial.
                      Seluruh data berdimensi dipindah ke kelompok Ukuran di
                      bawah agar operator membacanya dalam satu tempat. */''}
                ${fieldLine_('Nomor SPK', data.spk)}
                ${fieldLine_('Pelanggan', data.customer)}
                ${fieldLine_('Artikel', data.artikel)}
                ${fieldLine_('Pesanan', quantityWithUom_(data.jumlahOrder, data.uomOrder))}
                ${fieldLine_('Stok', data.stokOst || '')}
                ${fieldLine_('Keluar Bahan', quantityWithUom_(data.keluarBahan, data.uomKB))}
                ${fieldLine_('Bahan', data.material)}
                ${fieldLine_('Warna', data.keteranganWarna)}
                ${fieldLine_('Bahan', data.keteranganBahan)}
                </div>

                <div class="po-subtitle">Ukuran</div>
                ${fieldLine_('Ukuran Jadi', data.ukuranJadi)}
                ${fieldLine_('Ukuran Peniupan', data.ukuranBlow)}
                ${fieldLine_('L x P x T', joinNonEmpty_([
                  component.lebar,
                  component.panjang,
                  component.tebal
                ], ' x '))}
                ${fieldLine_('Tebal Blow', component.tebalBlow)}
              </section>

              <section class="po-panel">
                <h2>Urutan Proses &amp; Target BS</h2>
                <div class="po-panel-head">
                <div class="po-process-bs-grid">
                  <div class="po-process-column">
                    <div class="po-route">${buildRouteItems_(data)}</div>
                  </div>
                  <div class="po-bs-column">
                    <table class="grid-table po-bs-table">
                      <thead>
                        <tr>
                          <th>Divisi</th><th>%</th><th>Divisi</th><th>%</th>
                        </tr>
                      </thead>
                      <tbody>${bsRows}</tbody>
                      <tfoot>
                        <tr>
                          <th colspan="3">Total BS</th>
                          <td>${formatPercent_(data.totalBs)}</td>
                        </tr>
                      </tfoot>
                    </table>
                  </div>
                </div>
                ${/* Pengiriman dan Keterangan Produk digabung: keduanya sama-sama
                      berisi keterangan pelengkap di luar alur proses. */''}                </div>

                <div class="po-subtitle">Spesifikasi</div>
                ${fieldLine_('Bahan / Film', bahanFilmText_(data))}
                ${fieldLine_('Density', formatNumber_(data.density, 2))}
                ${fieldLine_('PCS / KG', pcsPerKgText_(data))}
                ${fieldLine_('Toleransi', toleransiText_(data))}
              </section>

              <section class="po-panel">
                <h2>Komposisi Bahan</h2>
                <div class="po-panel-head">
                <div class="order-type po-order-status">
                  <span class="${isRepeatOrder_(data) ? 'is-active' : ''}">Pesanan Ulang</span>
                  <span class="${isRepeatOrder_(data) ? '' : 'is-active'}">Pesanan Baru</span>
                </div>
                <table class="grid-table po-composition-table">
                  <thead>
                    <tr>
                      <th style="width:9%">No.</th>
                      <th>Jenis Bahan</th>
                      <th style="width:22%">Qty (KG)</th>
                      <th style="width:20%">Percent</th>
                    </tr>
                  </thead>
                  <tbody>${compositionRows}</tbody>
                  <tfoot>
                    <tr>
                      <th colspan="2">Total</th>
                      <td class="right">${formatNumber_(data.totalKomposisiKg, 2)}</td>
                      <td class="right">${formatPercent_(data.totalKomposisiPercent)}</td>
                    </tr>
                  </tfoot>
                </table>
                </div>

                <div class="po-subtitle">Administrasi</div>
                ${fieldLine_('Tanggal Kirim', tanggalKirimText_(data))}
                ${fieldLine_('SPK Ref.', data.spkReferensi)}
                ${fieldLine_('Marketing', data.marketing)}
                ${fieldLine_('Kode Item', data.kodeItem)}
              </section>
            </div>

            ${/* Keterangan artikel dikeluarkan dari kolom panel dan dibuat
                  selebar halaman: isinya bisa panjang dan sering ditambahi
                  tangan di lapangan, sehingga satu kolom sempit tidak cukup.
                  Labelnya berada di dalam bingkai, isinya tepat di bawahnya. */''}
            <section class="po-article-note" aria-label="Keterangan Artikel">
              <div class="po-article-note-label">Keterangan Artikel</div>
              <div class="po-article-note-body">${escapeHtml_(displayValue_(data.keteranganArtikel))}</div>
            </section>

            <div class="po-signatures" aria-label="Persetujuan PO Produksi">
              ${/* Kepala divisi ditempatkan tepat setelah Admin, sama dengan
                    urutan pada lembar tiap alur produksi. */''}
              ${poSignature_('Dibuat', 'Admin')}
              ${poSignature_('Mengetahui', 'Kepala Blowing')}
              ${poSignature_('Diperiksa', 'Asmen PPIC')}
              ${poSignature_('Diverifikasi', 'Manager PPIC')}
              ${poSignature_('Diverifikasi', 'Manager QC / QA')}
              ${poSignature_('Disetujui', 'Senior Manager')}
              ${poSignature_('Disahkan', 'General Manager')}
            </div>
          </div>
          ${pageFooter_(data, 'PO Produksi', pageNumber, totalPages, generatedText)}
        </section>
      `;
    }

    function buildProcessPage_(data, form, pageNumber, totalPages, generatedText) {
      let body = '';
      if (form.key === 'mixer') body = buildMixerSection_(data);
      else if (form.key === 'blowing') body = buildBlowingSection_(data, form);
      else if (form.key === 'printing') body = buildPrintingSection_(data, form);
      else if (form.key === 'cutting') body = buildCuttingSection_(data, form);
      else body = buildConversionSection_(data, form);

      return `
        <section class="print-sheet process-sheet" data-form="${escapeHtml_(form.key)}">
          <div class="page-content master-frame">
            ${buildMasterHeader_(data, form)}
            ${body}
            ${processSignatures_(form)}
          </div>
          ${pageFooter_(data, form.pageLabel || form.label, pageNumber, totalPages, generatedText)}
        </section>
      `;
    }

    function buildMasterHeader_(data, form) {
      const productNote = form.step ? formNote_(data, form) : buildProcessProductNote_(data, form.key);
      const orderUnit = String(data.uomOrder || '').toUpperCase();
      return `
        <header>
          <div class="master-topline">
            <div class="master-name">
              <strong>SPK PRODUKSI</strong>
            </div>
            <div class="master-code">
              ${/* Lembar SPK asli selalu menulis "No. Po Customer" beserta nomor
                    PO customer, tanpa memandang UOM order. Sebelumnya order
                    ROLL dan KG keliru menampilkan Artikel di sini. */''}
              <span>Nomor PO</span>
              <strong>${escapeHtml_(displayValue_(data.nomorPO))}</strong>
            </div>
            <div class="master-company">
              <div class="mini-logo">${buildPolytaLogo_()}</div>
              <div>
                <strong>PT POLYTA GLOBAL MANDIRI</strong>
                <small>Industri Kemasan Plastik</small>
              </div>
            </div>
            ${releaseStamp_(data)}
          </div>

          <div class="master-header-grid">
            <div class="master-info">
              <div class="order-type">
                <span class="${isRepeatOrder_(data) ? 'is-active' : ''}">Pesanan Ulang</span>
                <span class="${isRepeatOrder_(data) ? '' : 'is-active'}">Pesanan Baru</span>
              </div>
              ${/* Nomor PO customer sudah tampil pada baris judul lembar ini,
                    jadi tidak diulang lagi sebagai field di bawahnya. */''}
              ${fieldLine_('Tgl SPK', formatDate_(data.tanggal))}
              ${fieldLine_('No. SPK', data.spk)}
              ${fieldLine_('Pelanggan', data.customer)}
              ${fieldLine_('Artikel', data.artikel)}
              ${fieldLine_('Bahan', data.material)}
              ${fieldLine_('PCS / KG', formatNumber_(data.pcsPerKg, 2))}
              ${fieldLine_('Ukuran Jadi', data.ukuranJadi)}
            </div>

            <div class="master-info">
              ${fieldLine_('Jumlah Pesanan', orderWithKgEquivalent_(data))}
              ${fieldLine_('Tanggal Kirim', formatDate_(data.etd))}
              ${fieldLine_('Jumlah Bahan', quantityWithUom_(data.keluarBahan, data.uomKB))}
              ${fieldLine_('Toleransi', formatPercent_(data.toleransi))}
              ${fieldLine_('Kg / Roll', kgPerRollText_(data))}
              ${fieldLine_('Meter / Roll', meterPerRollText_(data))}
              ${fieldLine_('Marketing', data.marketing)}
              ${fieldLine_('PO Sebelumnya', data.spkReferensi)}
            </div>

            <div class="master-route">
              <h3>Urutan Proses</h3>
              <div class="route-list">${buildRouteItems_(data)}</div>
            </div>

            <div class="master-note">
              <h3>Keterangan Produk</h3>
              <p>${escapeHtml_(productNote)}</p>
            </div>
          </div>
        </header>
      `;
    }

    function buildMixerSection_(data) {
      const compositionItems = Array.isArray(data.komposisi) ? data.komposisi.slice(0, 8) : [];
      const compositionRows = Array.from({ length: 8 }, function (_, index) {
        const item = compositionItems[index] || {};
        return `
          <tr>
            <td class="left">${escapeHtml_(item.material || '')}</td>
            <td>${item.percent === '' || item.percent === undefined ? '' : formatPercent_(item.percent)}</td>
            <td class="right">${item.kg === '' || item.kg === undefined ? '' : formatNumber_(item.kg, 2)}</td>
          </tr>
        `;
      }).join('');
      const materialHeaders = Array.from({ length: 7 }, function (_, index) {
        const item = compositionItems[index] || {};
        return `<th>${escapeHtml_(item.material || 'Bahan ' + (index + 1))}</th>`;
      }).join('');

      return `
        <section class="process-section">
          <div class="process-title">
            <strong>PENCAMPURAN</strong>
            <span>Komposisi dan pemakaian bahan baku</span>
          </div>
          <div class="mixer-layout">
            <div class="mixer-fields">
              ${processField_('Mesin', '')}
              ${processField_('Jenis Bahan', data.material)}
              ${processField_('Kode Item', data.kodeItem)}
              ${processField_('Keterangan', processNote_(data, 'mixer'))}
              ${processField_('Keluar Bahan', quantityWithUom_(data.keluarBahan, data.uomKB))}
            </div>
            <table class="grid-table mixer-composition">
              <thead><tr><th>Jenis Bahan</th><th>Percent (%)</th><th>Qty (KG)</th></tr></thead>
              <tbody>${compositionRows}</tbody>
              <tfoot>
                <tr>
                  <th>Total</th>
                  <td>${formatPercent_(data.totalKomposisiPercent)}</td>
                  <td class="right">${formatNumber_(data.totalKomposisiKg, 2)}</td>
                </tr>
              </tfoot>
            </table>
          </div>
          <div class="process-table-wrap">
            <table class="grid-table mixer-log">
              <thead>
                <tr>
                  <th style="width:12%">Tanggal</th>
                  <th colspan="7">Jenis Bahan Baku / Batch Aktual</th>
                </tr>
                <tr>
                  <th>Shift / Operator</th>
                  ${materialHeaders}
                </tr>
              </thead>
              <tbody>${blankRows_(8, 8)}</tbody>
            </table>
          </div>
        </section>
      `;
    }

    function buildBlowingSection_(data, form) {
      const component = data.ukuranKomponen || {};
      const gramatur = calculateGramatur_(data.pcsPerKg);
      const bsValue = formBs_(data, form, 'blowing');
      return `
        <section class="process-section">
          <div class="process-title">
            <strong>BLOWING${escapeHtml_(formRepeatSuffix_(form).toUpperCase())}</strong>
            <span>Kontrol roll, hasil, waktu, dan gramatur</span>
          </div>
          <div class="process-fields cols-4">
            ${processField_('Mesin', formValue_(data, form, 'mesin-blowing'))}
            ${processField_('Ukuran Peniupan', data.ukuranBlow)}
            ${processField_('Microne', component.tebalBlow)}
            ${processField_('Ket', data.film)}
            ${processField_('Kode Item', data.kodeItem)}
            ${processField_('Estimasi Proses', '')}
            ${processField_('Keterangan', formNote_(data, form))}
            ${processField_('Target BS', formatPercent_(bsValue))}
            ${processField_('BS (KG)', targetBsKg_(data, bsValue))}
            ${processField_('Gram. Std.', formatNumber_(gramatur.std, 2))}
            ${processField_('Gram. Max.', formatNumber_(gramatur.max, 2))}
            ${processField_('Gram. Min.', formatNumber_(gramatur.min, 2))}
            ${processField_('Threat', formValue_(data, form, 'blowingThreat'))}
            ${processField_('Mode Cetak', formValue_(data, form, 'blowingModeCetak'))}
            ${processField_('Density', formatNumber_(data.density, 2))}
          </div>
          <div class="process-table-wrap">
            ${buildRollLogTable_(9)}
          </div>
        </section>
      `;
    }

    function calculateGramatur_(pcsPerKg) {
      const number = Number(pcsPerKg);
      if (!Number.isFinite(number) || number <= 0) return { std: null, max: null, min: null };
      const std = 1000 / number;
      return { std: std, max: std * 1.05, min: std * 0.95 };
    }

    function buildPrintingSection_(data, form) {
      const component = data.ukuranKomponen || {};
      const bsValue = formBs_(data, form, 'printing');
      const kodeSilinder = formValue_(data, form, 'printingKodeSilinder');
      const warnaList = (data.warna || []).filter(function (item) { return isMeaningful_(item.nama); });
      const jumlahWarna = warnaList.length;
      const inkRows = (jumlahWarna
        ? warnaList.map(function (item, index) {
            const pemakaian = item.pemakaian === '' || item.pemakaian === null || item.pemakaian === undefined
              ? ''
              : formatNumber_(item.pemakaian, 2);
            return '<tr><th class="left">Tinta ' + (index + 1) + '</th><td>' +
              escapeHtml_(item.nama) + '</td><td>' + escapeHtml_(pemakaian) + '</td></tr>';
          })
        : Array.from({ length: 6 }, function (_, index) {
            return ['<tr><th class="left">Tinta ', index + 1, '</th><td></td><td></td></tr>'].join('');
          })
      ).join('');

      return `
        <section class="process-section">
          <div class="process-title">
            <strong>PRINTING${escapeHtml_(formRepeatSuffix_(form).toUpperCase())}</strong>
            <span>Kontrol cetak, warna, tinta, silinder, dan solvent</span>
          </div>
          <div class="process-fields cols-4">
            ${processField_('Kode Item', data.kodeItem)}
            ${processField_('Mesin', formValue_(data, form, 'mesin-printing'))}
            ${/* SPK asli menulis jumlah warna sebagai "1+0", yaitu depan+belakang.
                  Cacah baris tinta dipakai hanya bila kolom itu kosong. */''}
            ${processField_(
              'Jumlah Warna',
              isMeaningful_(data.keteranganWarna)
                ? data.keteranganWarna
                : (jumlahWarna ? String(jumlahWarna) : '')
            )}
            ${processField_('Target BS', formatPercent_(bsValue))}
            ${processField_('BS (KG)', targetBsKg_(data, bsValue))}
            ${processField_('Width', component.lebar)}
            ${processField_('Pitch', component.panjang)}
            ${processField_('Keterangan', formNote_(data, form))}
          </div>
          <div class="printing-grid">
            <table class="grid-table roll-log printing-main">
              <thead>
                <tr>
                  <th rowspan="2">No. Roll</th><th rowspan="2">Tgl</th>
                  <th colspan="2">Hasil</th><th colspan="2">Jam</th><th rowspan="2">Ket.</th>
                  <th rowspan="2">No. Roll</th><th rowspan="2">Tgl</th>
                  <th colspan="2">Hasil</th><th colspan="2">Jam</th><th rowspan="2">Ket.</th>
                </tr>
                <tr>
                  <th>Shift</th><th>KG</th><th>Start</th><th>Finish</th>
                  <th>Shift</th><th>KG</th><th>Start</th><th>Finish</th>
                </tr>
              </thead>
              <tbody>${blankRows_(14, 9)}</tbody>
              <tfoot>
                <tr><th colspan="5">Total Hasil</th><td colspan="4">BS / NG Pencetakan</td><td colspan="5">BS / NG Polos</td></tr>
              </tfoot>
            </table>
            <div>
              <table class="grid-table printing-side">
                <thead><tr><th>Pemakaian Tinta</th><th>Warna</th><th>KG</th></tr></thead>
                <tbody>${inkRows}</tbody>
              </table>
              <div class="support-box">
                <strong>Nomer Silinder</strong>
                <span>${isMeaningful_(kodeSilinder)
                  ? escapeHtml_(kodeSilinder)
                  : '................................................'}</span>
              </div>
              <div class="support-box">
                <strong>Solvent</strong>
                <span>........ KG &nbsp; / &nbsp; ........ Meter</span>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    // Slitting, Folding, dan Gusset memakai kerangka yang sama. Ukurannya
    // diambil dari kolom routing milik prosesnya masing-masing, bukan dari
    // Ukuran Jadi; Ukuran Jadi adalah ukuran produk akhir dan tidak
    // menggambarkan ukuran yang dikerjakan divisi ini.
    const CONVERSION_FIELD_MAP = {
      slitting: { label: 'Ukuran Pembelahan', ukuran: 'ukuranSlitting' },
      folding: { label: 'Ukuran Lipat', ukuran: 'ukuranFolding' },
      gusset: { label: 'Ukuran Lipatan', ukuran: 'ukuranGusset', extraLabel: 'Lebar Lipatan', extra: 'lebarGusset' }
    };

    function buildConversionSection_(data, form) {
      const map = CONVERSION_FIELD_MAP[form.key] || {};
      const bsValue = formBs_(data, form, form.key);
      const ukuran = map.ukuran ? formValue_(data, form, map.ukuran) : '';
      return `
        <section class="process-section">
          <div class="process-title">
            <strong>${escapeHtml_((form.pageLabel || form.label).toUpperCase())}</strong>
            <span>Kontrol operator, roll awal, dan hasil produksi</span>
          </div>
          <div class="process-fields cols-4">
            ${processField_('Kode Item', data.kodeItem)}
            ${processField_('Mesin', formValue_(data, form, 'mesin-' + form.key))}
            ${processField_(map.label || 'Ukuran', ukuran)}
            ${processField_(map.extraLabel || 'Lebar Bahan', map.extra ? formValue_(data, form, map.extra) : dimensionText_(data, 'lebar', 2))}
            ${processField_('Target BS', formatPercent_(bsValue))}
            ${processField_('BS (KG)', targetBsKg_(data, bsValue))}
            ${processField_('BS Lembaran', formatPercent_(formBs_(data, form, 'sheet')))}
            ${processField_('Model Kantong', data.modelKantong)}
            ${processField_('Keterangan', formNote_(data, form))}
          </div>
          <div class="process-table-wrap">
            ${buildConversionLogTable_(data.uomOrder, 9)}
          </div>
        </section>
      `;
    }

    function buildCuttingSection_(data, form) {
      const bsValue = cuttingBsForForm_(data, form);
      const finishing = formValue_(data, form, 'finishing');
      const handlePm = formValue_(data, form, 'handlePm');
      return `
        <section class="process-section">
          <div class="process-title">
            <strong>${escapeHtml_((form.pageLabel || cuttingTitle_(data)).toUpperCase())}</strong>
            <span>Kendali penyelesaian, pengepakan, berat, dan hasil</span>
          </div>
          <div class="cutting-top">
            <div class="cutting-fields">
              ${/* SPK asli menulis jenis finishing pada baris Mesin. */''}
              ${processField_('Mesin', formValue_(data, form, 'mesin-cutting') || finishing)}
              ${processField_('Kode Item', data.kodeItem)}
              ${processField_('Model Kantong', data.modelKantong)}
              ${processField_('Jenis Potongan', data.jenisPotongan)}
              ${processField_('Handle / Pon', handlePm)}
              ${processField_('Jenis Packing', formValue_(data, form, 'jenisPacking'))}
              ${processField_('Packing', packingDetailText_(data, form))}
              ${processField_('Target BS', formatPercent_(bsValue))}
              ${processField_('BS (KG)', targetBsKg_(data, bsValue))}
              ${processField_('Keterangan', formNote_(data, form))}
            </div>
            <div class="cutting-metrics">
              ${/* Kolom MIC.PO dan MIC.ACT diisi tangan saat penimbangan,
                    sama seperti pada lembar SPK asli. */''}
              <div class="metric-box">
                <strong>Berat Timbangan</strong>
                <table class="grid-table weigh-table">
                  <thead><tr><th></th><th>MIC.PO</th><th>MIC.ACT</th></tr></thead>
                  <tbody>
                    <tr><th class="left">Standart</th><td>&nbsp;</td><td>&nbsp;</td></tr>
                    <tr><th class="left">Maximal</th><td>&nbsp;</td><td>&nbsp;</td></tr>
                    <tr><th class="left">Minimal</th><td>&nbsp;</td><td>&nbsp;</td></tr>
                  </tbody>
                </table>
              </div>
              <div class="metric-box">
                <strong>Target Mesin</strong>
                Target Speed: ........<br>Target Per jam: ........
              </div>
              <div class="metric-box">
                <strong>PO Sebelumnya</strong>
                ${escapeHtml_(displayValue_(data.spkReferensi))}
              </div>
            </div>
          </div>
          <div class="process-table-wrap">
            ${buildCuttingLogTable_(data.uomOrder, 8)}
          </div>
        </section>
      `;
    }

    function buildRollLogTable_(rowCount) {
      return `
        <table class="grid-table roll-log">
          <thead>
            <tr>
              <th rowspan="2">No. Roll</th><th rowspan="2">Tgl</th>
              <th colspan="2">Hasil</th><th colspan="2">Jam</th><th rowspan="2">Ket.</th>
              <th rowspan="2">No. Roll</th><th rowspan="2">Tgl</th>
              <th colspan="2">Hasil</th><th colspan="2">Jam</th><th rowspan="2">Ket.</th>
            </tr>
            <tr>
              <th>Shift</th><th>KG</th><th>Start</th><th>Finish</th>
              <th>Shift</th><th>KG</th><th>Start</th><th>Finish</th>
            </tr>
          </thead>
          <tbody>${blankRows_(14, rowCount)}</tbody>
        </table>
      `;
    }

    function buildConversionLogTable_(uom, rowCount) {
      const unit = String(uom || 'KG').toUpperCase();
      const groupHeader = `
        <th>Tgl / Operator</th><th>Roll Awal</th><th>Hasil ${escapeHtml_(unit)}</th>
      `;
      return `
        <table class="grid-table fold-log">
          <thead><tr>${groupHeader}${groupHeader}${groupHeader}${groupHeader}</tr></thead>
          <tbody>${blankRows_(12, rowCount)}</tbody>
        </table>
      `;
    }

    function buildCuttingLogTable_(uom, rowCount) {
      const unit = String(uom || 'KG').toUpperCase();
      const groupHeader = `
        <th>Roll Awal / Tgl</th><th>Shift</th><th>Hasil ${escapeHtml_(unit)}</th>
      `;
      return `
        <table class="grid-table cutting-log">
          <thead>
            <tr><th colspan="3">Hasil 1</th><th colspan="3">Hasil 2</th><th colspan="3">Hasil 3</th><th colspan="3">Hasil 4</th></tr>
            <tr>${groupHeader}${groupHeader}${groupHeader}${groupHeader}</tr>
          </thead>
          <tbody>${blankRows_(12, rowCount)}</tbody>
        </table>
      `;
    }

    // SPK yang menyimpan urutan menampilkan alurnya apa adanya dan bernomor,
    // termasuk proses yang dijalankan lebih dari sekali. SPK lama tetap
    // memakai daftar tetap dengan penanda proses yang aktif.
    function buildRouteItems_(data) {
      const labelOf = {};
      PROCESS_DEFINITIONS.forEach(function (process) { labelOf[process.key] = process.label; });

      const steps = Array.isArray(data.routingSteps) ? data.routingSteps : [];
      if (steps.length) {
        return steps.map(function (step, index) {
          const label = step.key === 'cutting'
            ? 'Cutting'
            : (labelOf[step.key] || step.key);
          return `
            <span class="route-item is-active">
              <span class="route-item-order">${index + 1}</span>${escapeHtml_(label)}
            </span>
          `;
        }).join('');
      }

      const items = PROCESS_DEFINITIONS.map(function (process) {
        return {
          label: process.label,
          active: Boolean(data.proses && data.proses[process.key])
        };
      });
      items.push({
        label: 'Cutting',
        active: isMeaningful_(data.finishing) || isMeaningful_(data.handlePm)
      });
      return items.map(function (item) {
        return `
          <span class="route-item${item.active ? ' is-active' : ''}">
            ${escapeHtml_(item.label)}
          </span>
        `;
      }).join('');
    }

    function buildProcessProductNote_(data, processKey) {
      const noteKey = processKey === 'cutting' ? finishingNoteKey_(data.finishing) : processKey;
      return processNote_(data, noteKey);
    }

    function processNote_(data, key) {
      return String(data.keteranganProses && data.keteranganProses[key] || '').trim();
    }

    function finishingNoteKey_(finishing) {
      const key = String(finishing || '').trim().toUpperCase();
      if (key === 'BOTTOM SEAL') return 'bottomSeal';
      if (key === 'SIDE SEAL') return 'sideSeal';
      if (key === 'TSHIRT') return 'tshirt';
      return '';
    }

    function modelMentionsTshirt_(data) {
      // Toleran terhadap variasi ketikan manual: "T-SHIRT", "T - SHIRT BAG",
      // "Tshirt", "TS", dan sejenisnya.
      const model = String(data.modelKantong || '').toUpperCase();
      return /T[\s\-]*SHIRT/.test(model) || /\bTS\b/.test(model);
    }

    function cuttingBs_(data) {
      const bs = data.bsPercent || {};
      let total = 0;
      const finishing = String(data.finishing || '').trim().toUpperCase();
      const handle = String(data.handlePm || '').trim().toUpperCase();
      if (finishing === 'BOTTOM SEAL') {
        const bottomSeal = Number(bs.bottomSeal) || 0;
        // Data lama kadang menyimpan BS cutting di slot T-Shirt walau alurnya
        // Bottom Seal (Model Kantong menyebut T-Shirt). Pakai nilai itu saat
        // slot Bottom Seal kosong.
        total += bottomSeal > 0
          ? bottomSeal
          : (modelMentionsTshirt_(data) ? Number(bs.tshirt) || 0 : 0);
      }
      if (finishing === 'SIDE SEAL') total += Number(bs.sideSeal) || 0;
      if (finishing === 'TSHIRT') total += Number(bs.tshirt) || 0;
      if (handle === 'HANDLE') total += Number(bs.handle) || 0;
      if (handle === 'PON') total += Number(bs.pon) || 0;
      return total;
    }

    function cuttingTitle_(data) {
      const labels = ['Cutting'];
      if (isMeaningful_(data.finishing)) labels.push(data.finishing);
      if (isMeaningful_(data.handlePm)) labels.push(data.handlePm);
      return labels.join(' - ');
    }

    // SPK asli menulis Quantity Order sebagai "100.000 PCS = 1.182,95 KG",
    // yaitu jumlah order beserta padanannya dalam KG lewat konversi PCS/KG.
    function orderWithKgEquivalent_(data) {
      const base = quantityWithUom_(data.jumlahOrder, data.uomOrder);
      const jumlah = Number(data.jumlahOrder);
      const pcsPerKg = Number(data.pcsPerKg);
      const uom = String(data.uomOrder || '').trim().toUpperCase();
      if (uom !== 'PCS' || !Number.isFinite(jumlah) || !(pcsPerKg > 0)) return base;
      return base + ' = ' + formatNumber_(jumlah / pcsPerKg, 2) + ' KG';
    }

    // Berat tiap roll diturunkan dari panjang per roll dibagi konversi
    // Meter/KG. Keduanya berasal dari Database, jadi tidak ada tebakan.
    function kgPerRollText_(data) {
      const meterRoll = Number(data.meterRoll);
      const meterPerKg = Number(data.meterPerKg);
      if (!(meterRoll > 0) || !(meterPerKg > 0)) return '';
      return formatNumber_(meterRoll / meterPerKg, 2) + ' KG';
    }

    function meterPerRollText_(data) {
      const meterRoll = Number(data.meterRoll);
      if (!(meterRoll > 0)) return '';
      return formatNumber_(meterRoll, 2) + ' Mtr';
    }

    // Target BS dalam KG dihitung dari Jumlah Bahan Baku, sama seperti SPK
    // asli: 1.300 KG x 2% = 26 KG.
    function targetBsKg_(data, percent) {
      return targetBsQuantity_(data.keluarBahan, data.uomKB, percent);
    }

    function targetBsQuantity_(quantity, uom, percent) {
      const base = Number(quantity);
      const rate = Number(percent);
      if (!Number.isFinite(base) || !Number.isFinite(rate)) return '';
      return formatNumber_(base * rate / 100, 2) + ' ' + String(uom || '');
    }

    function blankRows_(columnCount, rowCount) {
      return Array.from({ length: rowCount }, function () {
        return '<tr>' + Array.from({ length: columnCount }, function () {
          return '<td>&nbsp;</td>';
        }).join('') + '</tr>';
      }).join('');
    }

    function fieldLine_(label, value) {
      return `
        <div class="field-line">
          <span>${escapeHtml_(label)}</span>
          <strong>${escapeHtml_(displayValue_(value))}</strong>
        </div>
      `;
    }

    function processField_(label, value) {
      return `
        <div class="process-field">
          <span>${escapeHtml_(label)}</span>
          <strong>${escapeHtml_(displayValue_(value))}</strong>
        </div>
      `;
    }

    function poSignature_(approval, role) {
      return `
        <div class="po-signature">
          <span class="signature-label">${escapeHtml_(approval)}</span>
          <span class="signature-space" aria-hidden="true"></span>
          <strong>${escapeHtml_(role)}</strong>
          <small>Nama jelas / Tanggal</small>
        </div>
      `;
    }

    function processSignatures_(form) {
      const division = form.key === 'cutting' ? 'Finishing' : form.label;
      // Tiap lembar alur perlu pengesahan kepala divisi yang mengerjakannya,
      // ditempatkan setelah Admin seperti pada lembar SPK asli yang memuat
      // baris KA.BLOWING, KA.PRODUKSI, dan seterusnya.
      const signatures = [
        { approval: 'Dibuat', role: 'Admin' },
        { approval: 'Mengetahui', role: 'Kepala ' + division },
        { approval: 'Diperiksa', role: 'Asmen PPIC' },
        { approval: 'Diverifikasi', role: 'Manager PPIC' },
        { approval: 'Diverifikasi', role: 'Manager QC / QA' },
        { approval: 'Disetujui', role: 'Senior Manager' },
        { approval: 'Disahkan', role: 'General Manager' }
      ];

      return `
        <section class="process-signatures" aria-label="Pengesahan alur ${escapeHtml_(division)}">
          ${signatures.map(function (signature) {
            return `
              <div class="process-signature">
                <span class="process-signature-label">${escapeHtml_(signature.approval)}</span>
                <span class="process-signature-space" aria-hidden="true"></span>
                <strong>${escapeHtml_(signature.role)}</strong>
                <small>Nama jelas / Tanggal</small>
              </div>
            `;
          }).join('')}
        </section>
      `;
    }

    function releaseStamp_(data) {
      const released = data.release === 'YA';
      const releaseLabel = released ? 'RELEASE' : 'NON RELEASE';
      return `
        <div class="release-stamp ${released ? 'is-released' : 'is-non-release'}" data-release-badge>
          <span>${releaseLabel}</span>
        </div>
      `;
    }

    function pageFooter_(data, formLabel, pageNumber, totalPages, generatedText) {
      return `
        <footer class="page-footer">
          <span>SPK ${escapeHtml_(displayValue_(data.spk))} - ${escapeHtml_(formLabel)}</span>
          <span>Halaman ${pageNumber} dari ${totalPages} - ${escapeHtml_(generatedText)}</span>
          <span data-release-footer>Status: ${data.release === 'YA' ? 'RELEASE' : 'NON RELEASE'}</span>
        </footer>
      `;
    }

    function buildPolytaLogo_() {
      return `
        <svg class="polyta-logo" viewBox="0 0 120 120" focusable="false" aria-hidden="true">
          <path d="M14 12h50v43h42v53h-8V63H64v45H14V55h42V20H14z" fill="#101217"/>
          <rect x="15" y="22" width="41" height="12" rx="6" fill="#4563b3"/>
          <rect x="22" y="63" width="34" height="37" fill="#ef2631"/>
          <rect x="84" y="64" width="11" height="44" rx="5.5" fill="#40b84e"/>
          <path d="M17 15h43M24 66h30M86.5 67v35" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="2" opacity=".32"/>
        </svg>
      `;
    }

    function isRepeatOrder_(data) {
      return String(data.jenisOrder || '').trim().toUpperCase() === 'REPEAT ORDER';
    }

    function displayValue_(value) {
      if (value === 0) return '0';
      if (value === null || value === undefined || String(value).trim() === '') return '-';
      return String(value);
    }

    function isMeaningful_(value) {
      const normalized = String(value === null || value === undefined ? '' : value)
        .trim()
        .toUpperCase();
      return normalized !== '' && normalized !== '-';
    }

    function quantityWithUom_(quantity, uom) {
      const number = formatNumber_(quantity, 2);
      const unit = String(uom || '').trim();
      return joinNonEmpty_([number === '-' ? '' : number, unit], ' ') || '-';
    }

    function joinNonEmpty_(values, separator) {
      return values
        .filter(function (value) {
          return value !== null &&
            value !== undefined &&
            String(value).trim() !== '' &&
            String(value).trim() !== '-';
        })
        .join(separator);
    }

    function formatNumber_(value, maximumFractionDigits) {
      if (value === '' || value === null || value === undefined) return '-';
      const number = Number(value);
      if (!Number.isFinite(number)) return displayValue_(value);
      return new Intl.NumberFormat('id-ID', {
        minimumFractionDigits: 0,
        maximumFractionDigits: maximumFractionDigits
      }).format(number);
    }

    function formatPercent_(value) {
      if (value === '' || value === null || value === undefined) return '0%';
      const number = Number(value);
      if (!Number.isFinite(number)) return displayValue_(value);
      return new Intl.NumberFormat('id-ID', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }).format(number) + '%';
    }

    function formatDate_(value) {
      if (!value) return '-';
      const match = String(value).match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (!match) return displayValue_(value);
      const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
      return new Intl.DateTimeFormat('id-ID', {
        day: '2-digit',
        month: 'short',
        year: 'numeric'
      }).format(date);
    }

    function formatDateTime_(date) {
      return new Intl.DateTimeFormat('id-ID', {
        day: '2-digit',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      }).format(date);
    }

    function escapeHtml_(value) {
      return String(value === null || value === undefined ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
