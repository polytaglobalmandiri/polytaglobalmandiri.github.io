<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produksi Mixer</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#202327;background:#e5e8e4}
    *{box-sizing:border-box}body{margin:0}.shell{max-width:1280px;margin:auto;padding:28px}
    .topbar,.panel{background:#f5f6f3;border:1px solid #b8bbb9;border-radius:14px;box-shadow:0 3px 0 #8e9091,0 12px 25px #20232718}
    .topbar{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:20px 24px;margin-bottom:20px}
    .eyebrow{margin:0 0 5px;color:#a6131d;font-size:.7rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.title{margin:0;font-size:1.55rem}.subtitle{margin:7px 0 0;color:#6c7175;font-size:.78rem}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap}.control,.button{height:36px;border:1px solid #aeb2b0;border-radius:8px;background:#fff;padding:0 11px;font:inherit;font-size:.75rem}.button{background:#a6131d;color:white;border-color:#8c1018;font-weight:800;cursor:pointer}.button.secondary{background:#e6e8e5;color:#292c2f;border-color:#aeb2b0}
    .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.metric{padding:15px 17px;background:#f5f6f3;border:1px solid #b8bbb9;border-radius:11px}.metric small{display:block;color:#6c7175;font-size:.68rem}.metric strong{display:block;margin-top:5px;font-size:1.3rem}
    .panel{overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:16px 19px;border-bottom:1px solid #c5c8c5}.panel-head h2{margin:0;font-size:.9rem}.panel-head span{color:#6c7175;font-size:.7rem}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:11px 13px;border-bottom:1px solid #d0d3d0;text-align:left;font-size:.72rem;white-space:nowrap}th{background:#292c2f;color:#fff;font-size:.66rem;letter-spacing:.04em;text-transform:uppercase}tbody tr:hover{background:#eef0ed}.spk{font-weight:900;color:#a6131d}.muted{color:#707579}.status{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:.63rem;font-weight:800}.status.wait{background:#fff0d6;color:#8b5a08}.status.done{background:#dff2e5;color:#176b35}.row-action{height:29px;padding:0 9px;border-radius:7px;border:1px solid #aeb2b0;background:#e7e9e6;font-size:.68rem;font-weight:800;cursor:pointer}
    dialog{width:min(720px,calc(100% - 28px));border:1px solid #aeb2b0;border-radius:14px;padding:0;box-shadow:0 22px 60px #0005}dialog::backdrop{background:#20232799}.dialog-head{padding:17px 20px;background:#292c2f;color:#fff}.dialog-head h2{margin:0;font-size:.95rem}.dialog-body{padding:20px;background:#f5f6f3}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field{display:grid;gap:6px}.field label{font-size:.68rem;font-weight:800}.field input,.field select,.field textarea{width:100%;min-height:36px;border:1px solid #aeb2b0;border-radius:8px;padding:8px;font:inherit;font-size:.75rem;background:#fff}.field textarea{min-height:72px;resize:vertical}.full{grid-column:1/-1}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
    @media(max-width:720px){.shell{padding:14px}.topbar{align-items:flex-start;flex-direction:column}.summary{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div><p class="eyebrow">Production</p><h1 class="title">Produksi Mixer</h1><p class="subtitle">Catat hasil produksi dan pemakaian bahan baku per SPK.</p></div>
      <div class="toolbar"><input id="search" class="control" placeholder="Cari SPK, customer, bahan..." aria-label="Cari data produksi"><select id="status" class="control" aria-label="Filter status"><option value="all">Semua status</option><option value="pending">Menunggu</option><option value="done">Selesai</option></select><button class="button secondary" id="refresh" type="button">Muat ulang</button></div>
    </header>
    <section class="summary" aria-label="Ringkasan produksi"><div class="metric"><small>Total SPK</small><strong id="total">0</strong></div><div class="metric"><small>Menunggu hasil</small><strong id="pending">0</strong></div><div class="metric"><small>Selesai</small><strong id="done">0</strong></div><div class="metric"><small>Total pemakaian</small><strong id="usage">0 KG</strong></div></section>
    <section class="panel"><div class="panel-head"><h2>Antrean Produksi Mixer</h2><span id="caption">Data contoh lokal</span></div><div class="table-wrap"><table><thead><tr><th>SPK</th><th>Customer / Brand</th><th>Ukuran</th><th>Order</th><th>Mesin</th><th>Shift</th><th>Hasil</th><th>Pemakaian</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div></section>
  </main>
  <dialog id="entryDialog"><div class="dialog-head"><h2 id="dialogTitle">Input Hasil Produksi</h2></div><form id="entryForm" class="dialog-body"><div class="form-grid"><div class="field"><label for="result">Hasil produksi (KG)</label><input id="result" type="number" min="0" step="any" required></div><div class="field"><label for="machine">Mesin</label><input id="machine" required></div><div class="field"><label for="shift">Shift</label><select id="shift"><option>1</option><option>2</option><option>3</option></select></div><div class="field"><label for="operator">Operator</label><input id="operator"></div><div class="field full"><label for="materials">Pemakaian bahan baku (KG)</label><textarea id="materials" placeholder="Contoh: ASRENE UF 1810 T — 322,5 KG"></textarea></div><div class="field full"><label for="note">Keterangan</label><textarea id="note"></textarea></div></div><div class="dialog-actions"><button class="button secondary" id="cancel" type="button">Batal</button><button class="button" type="submit">Simpan lokal</button></div></form></dialog>
  <script>
    const sample=[
      {spk:'I26.071',customer:'YAY PE ORANGE',size:'41/28 X 0.04',order:1500,machine:'PE01',shift:'1',result:675,usage:375,status:'pending',materials:'ASRENE UF 1810 T — 322,5 KG; COSMOTHEN 410 — 37,5 KG; MB ORANGE 7098 — 15 KG'},
      {spk:'I26.095',customer:'GEMATIRTA',size:'73 X 0.07',order:8200,machine:'PE02',shift:'1',result:1375,usage:500,status:'pending',materials:'ASRENE UF 1810 T — 225 KG; COSMOTHEN 410 — 25 KG; ASRENE UF 1810 — 250 KG'},
      {spk:'I26.105',customer:'GEMATIRTA',size:'100 X 0.45',order:275,machine:'PE05',shift:'1',result:275,usage:174.25,status:'done',materials:'ASRENE UF 1810 T — 164,5 KG; COSMOTHEN 410 — 8,75 KG; MB NATURAL — 1,75 KG'}
    ];
    let active=null;
    const fmt=n=>new Intl.NumberFormat('id-ID',{maximumFractionDigits:2}).format(Number(n)||0);
    let records=sample;
    function render(){const q=document.querySelector('#search').value.trim().toUpperCase(), s=document.querySelector('#status').value; const rows=records.filter(x=>(s==='all'||x.status===s)&&(!q||Object.values(x).join(' ').toUpperCase().includes(q))); document.querySelector('#rows').innerHTML=rows.map(x=>`<tr><td class="spk">${x.spk}</td><td>${x.customer}</td><td>${x.size||x.ukuran||'—'}</td><td>${fmt(x.order||x.jumlahOrder)} ${x.uomOrder||'PCS'}</td><td>${x.machine||x.mesin||'—'}</td><td>${x.shift||'—'}</td><td>${x.result||x.hasilProduksi?fmt(x.result||x.hasilProduksi)+' KG':'—'}</td><td>${fmt(x.usage||0)} KG</td><td><span class="status ${x.status==='done'?'done':'wait'}">${x.status==='done'?'Selesai':'Menunggu'}</span></td><td><button class="row-action" data-spk="${x.spk}">${x.status==='done'?'Lihat':'Input hasil'}</button></td></tr>`).join('')||'<tr><td colspan="10" class="muted">Tidak ada data yang cocok.</td></tr>'; document.querySelector('#total').textContent=records.length; document.querySelector('#pending').textContent=records.filter(x=>x.status==='pending').length; document.querySelector('#done').textContent=records.filter(x=>x.status==='done').length; document.querySelector('#usage').textContent=fmt(records.reduce((a,x)=>a+(Number(x.usage)||0),0))+' KG';}
    function loadProduction(){if(!(window.google&&google.script&&google.script.run)){render();return;}google.script.run.withSuccessHandler(function(response){if(response&&response.status==='success'){records=response.data||[];render();document.querySelector('#caption').textContent='Terhubung ke database';}}).withFailureHandler(function(){render();}).getProductionMixerData(true);}
    document.querySelector('#rows').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;active=sample.find(x=>x.spk===b.dataset.spk);document.querySelector('#dialogTitle').textContent='Input Hasil Produksi · '+active.spk;document.querySelector('#result').value=active.result||'';document.querySelector('#machine').value=active.machine;document.querySelector('#shift').value=active.shift;document.querySelector('#operator').value='';document.querySelector('#materials').value=active.materials||'';document.querySelector('#note').value='';document.querySelector('#entryDialog').showModal();});
    document.querySelector('#entryForm').addEventListener('submit',e=>{e.preventDefault();if(!active)return;const payload={spk:active.spk,routingId:active.routingId||'',hasilProduksi:document.querySelector('#result').value,mesin:document.querySelector('#machine').value,shift:document.querySelector('#shift').value,operator:document.querySelector('#operator').value,pemakaianBahan:document.querySelector('#materials').value,keterangan:document.querySelector('#note').value};if(window.google&&google.script&&google.script.run){google.script.run.withSuccessHandler(function(response){if(!response||response.status!=='success'){alert(response&&response.message||'Gagal menyimpan hasil produksi.');return;}active.result=payload.hasilProduksi;active.machine=payload.mesin;active.shift=payload.shift;active.status='done';document.querySelector('#entryDialog').close();render();}).withFailureHandler(function(error){alert(error&&error.message||'Gagal menyimpan hasil produksi.');}).saveProductionMixerEntry(payload);}else{active.result=Number(payload.hasilProduksi)||0;active.machine=payload.mesin;active.shift=payload.shift;active.materials=payload.pemakaianBahan;active.status='done';document.querySelector('#entryDialog').close();render();}});
    document.querySelector('#cancel').onclick=()=>document.querySelector('#entryDialog').close(); document.querySelector('#search').oninput=render; document.querySelector('#status').onchange=render; document.querySelector('#refresh').onclick=loadProduction; loadProduction();
  </script>
</body>
</html>
