    function captureRouteStepFieldDefaults_() {
      Object.keys(ROUTE_STEP_FIELDS).forEach(function(key) {
        ROUTE_STEP_FIELDS[key].forEach(function(fieldId) {
          if (Object.prototype.hasOwnProperty.call(routeStepFieldDefaults, fieldId)) return;
          const field = document.getElementById(fieldId);
          routeStepFieldDefaults[fieldId] = field
            ? String(field.value === null || field.value === undefined ? '' : field.value)
            : '';
        });
      });
    }

    function routeStepFieldDefault_(fieldId) {
      return Object.prototype.hasOwnProperty.call(routeStepFieldDefaults, fieldId)
        ? routeStepFieldDefaults[fieldId]
        : '';
    }

    function stepValue_(step, fieldId) {
      const values = step && step.values ? step.values : {};
      return Object.prototype.hasOwnProperty.call(values, fieldId)
        ? values[fieldId]
        : routeStepFieldDefault_(fieldId);
    }

    function captureRouteStepValues_(key) {
      const values = {};
      (ROUTE_STEP_FIELDS[key] || []).forEach(function(fieldId) {
        const field = document.getElementById(fieldId);
        if (!field) return;
        values[fieldId] = String(field.value === null || field.value === undefined ? '' : field.value);
      });
      return values;
    }

    function applyRouteStepValues_(key, values, step) {
      // Daftar mesin Cutting bergantung pada finishing, jadi finishing dipasang
      // lebih dulu agar pilihan mesin langkah ini tidak hilang.
      if (key === 'cutting') {
        const source = values || {};
        const finishingField = document.getElementById('finishing');
        if (finishingField) {
          finishingField.value = Object.prototype.hasOwnProperty.call(source, 'finishing')
            ? source.finishing
            : routeStepFieldDefault_('finishing');
        }
        syncCuttingMachineOptions_();
      }

      (ROUTE_STEP_FIELDS[key] || []).forEach(function(fieldId) {
        const field = document.getElementById(fieldId);
        if (!field) return;
        field.value = values && Object.prototype.hasOwnProperty.call(values, fieldId)
          ? values[fieldId]
          : routeStepFieldDefault_(fieldId);
        // Penanda isi otomatis dilepas supaya ukuran hasil edit operator tidak
        // ikut tertimpa saat Ukuran Jadi berubah.
        if (field.dataset && field.dataset.automaticRouteSize) {
          delete field.dataset.automaticRouteSize;
        }
      });

      // Langkah yang ukurannya masih hasil isian otomatis mendapatkan kembali
      // penandanya, supaya statusnya tidak hilang setelah diedit lalu disimpan.
      const sizeField = AUTOMATIC_ROUTE_SIZE_FIELDS[key];
      if (step && step.auto && sizeField) {
        const field = document.getElementById(sizeField);
        if (field) field.dataset.automaticRouteSize = String(field.value || '');
      }

      if (key === 'cutting') updatePackingDetailVisibility_();
    }

    // Ukuran dianggap masih otomatis bila isinya sama persis dengan nilai yang
    // terakhir diturunkan dari Ukuran Jadi.
    function isActiveRouteSizeAutomatic_(key) {
      const sizeField = AUTOMATIC_ROUTE_SIZE_FIELDS[key];
      if (!sizeField) return false;
      const field = document.getElementById(sizeField);
      if (!field) return false;
      const marker = String(field.dataset.automaticRouteSize || '').trim();
      return marker !== '' && String(field.value || '').trim() === marker;
    }

    function routingStepById_(stepId) {
      return routingSteps.find(function(step) { return step.id === stepId; }) || null;
    }

    // Target BS yang benar-benar berlaku untuk satu langkah. Berbeda dengan
    // pemeriksaan lama yang global, gerbangnya kini dinilai per langkah.
    function stepBsKeys_(step) {
      const key = step ? step.key : '';
      if (key === 'blowing' || key === 'printing') return [key];
      if (BS_SHEET_ROUTING_KEYS.indexOf(key) > -1) return [key, 'sheet'];
      if (key !== 'cutting') return [];

      const keys = ['sheetSlitting'];
      const noteKey = FINISHING_NOTE_KEY_MAP[
        String(stepValue_(step, 'finishing') || '-').toUpperCase()
      ];
      if (noteKey) keys.push(noteKey);

      const handlePon = String(stepValue_(step, 'handlePm') || '-').toUpperCase();
      if (handlePon === 'PON') keys.push('pon');
      if (handlePon === 'HANDLE') keys.push('handle');
      return keys;
    }

    // Langkah yang sedang diedit dibaca langsung dari panel supaya Total BS dan
    // Keluar Bahan ikut bergerak sebelum tombol simpan ditekan. Langkah baru
    // yang belum disimpan sengaja tidak dihitung.
    function getEffectiveRoutingSteps_() {
      return routingSteps.map(function(step) {
        if (!activeStepId || step.id !== activeStepId) return step;
        return {
          id: step.id,
          key: step.key,
          values: captureRouteStepValues_(step.key),
          auto: isActiveRouteSizeAutomatic_(step.key)
        };
      });
    }

    function findFirstRoutingStep_(key) {
      return getEffectiveRoutingSteps_().find(function(step) {
        return step.key === key;
      }) || null;
    }

    // Database menyimpan satu kolom per jenis BS, jadi langkah yang berulang
    // dijumlahkan. Total BS-nya tetap sama persis dengan cara lama untuk alur
    // yang tidak mengulang proses.
    function getAggregatedBsPercent_() {
      const totals = {};
      BS_LIST.forEach(function(item) { totals[item.key] = 0; });
      getEffectiveRoutingSteps_().forEach(function(step) {
        stepBsKeys_(step).forEach(function(bsKey) {
          if (!Object.prototype.hasOwnProperty.call(totals, bsKey)) return;
          totals[bsKey] += parseFloat(stepValue_(step, 'bs-' + bsKey)) || 0;
        });
      });
      return totals;
    }

    // Kotak centang proses dipertahankan sebagai cermin daftar langkah supaya
    // pemeriksaan lama seperti isRoutingProcessSelected_ tetap berlaku.
    function syncRoutingCheckboxes_() {
      ROUTING_LIST.forEach(function(item) {
        const input = document.getElementById('proses-' + item.key);
        if (!input) return;
        input.checked = routingSteps.some(function(step) { return step.key === item.key; });
      });
    }

    function afterRoutingStepsChanged_(message, tone) {
      syncRoutingCheckboxes_();
      updateTotalProses_();
      syncRoutingTabs_();
      syncWarnaVisibility_();
      syncBsSheetVisibility_();
      syncBahanUkuranVisibility_();
      hitungTotalBs();
      if (message) showRoutingFeedback_(message, tone);
      updateWizardState_();
    }

    // Membangun ulang urutan langkah dari data SPK sumber. SPK yang disimpan
    // sebelum fitur ini ada tidak punya kolom urutan, jadi dipulihkan sebagai
    // satu langkah per proses aktif mengikuti urutan baku.
    function restoreRoutingStepsFromData_(data) {
      routingSteps = [];
      routingStepIdCounter = 0;

      const ukuranJadi = document.getElementById('ukuranJadi');
      const derivedSize = ukuranJadi
        ? String(deriveAutomaticRouteSize_(ukuranJadi.value) || '').trim()
        : '';
      const markAutomatic = function(step) {
        const sizeField = AUTOMATIC_ROUTE_SIZE_FIELDS[step.key];
        step.auto = Boolean(
          sizeField && derivedSize &&
          String(step.values[sizeField] || '').trim() === derivedSize
        );
        return step;
      };

      const incoming = data && Array.isArray(data.routingSteps) ? data.routingSteps : [];
      if (incoming.length) {
        incoming.forEach(function(entry) {
          const key = entry && entry.key ? String(entry.key) : '';
          if (!routingItemByKey_(key)) return;

          const source = entry.values && typeof entry.values === 'object' ? entry.values : {};
          const values = {};
          (ROUTE_STEP_FIELDS[key] || []).forEach(function(fieldId) {
            if (!Object.prototype.hasOwnProperty.call(source, fieldId)) return;
            const value = source[fieldId];
            values[fieldId] = String(value === null || value === undefined ? '' : value);
          });

          routingStepIdCounter += 1;
          routingSteps.push(markAutomatic({
            id: routingStepIdCounter, key: key, values: values
          }));
        });
      } else {
        // BS Sheet hanya satu nilai di SPK lama. Bila Folding, Slitting, dan
        // Gusset sama-sama berjalan, nilai itu diberikan pada langkah pertama
        // saja supaya Total BS tidak terhitung berlipat.
        let sheetBsTaken = false;
        ROUTING_LIST.forEach(function(item) {
          const input = document.getElementById('proses-' + item.key);
          if (!input || !input.checked) return;

          const values = captureRouteStepValues_(item.key);
          if (BS_SHEET_ROUTING_KEYS.indexOf(item.key) > -1) {
            if (sheetBsTaken) values['bs-sheet'] = routeStepFieldDefault_('bs-sheet');
            else sheetBsTaken = true;
          }

          routingStepIdCounter += 1;
          routingSteps.push(markAutomatic({
            id: routingStepIdCounter, key: item.key, values: values
          }));
        });
      }

      syncRoutingCheckboxes_();
    }

    function moveRoutingStep_(stepId, direction) {
      const index = routingSteps.findIndex(function(step) { return step.id === stepId; });
      const target = index + direction;
      if (index === -1 || target < 0 || target >= routingSteps.length) return;

      const moved = routingSteps.splice(index, 1)[0];
      routingSteps.splice(target, 0, moved);

      const item = routingItemByKey_(moved.key);
      afterRoutingStepsChanged_(
        (item ? item.label : moved.key) + ' dipindah ke langkah ' + (target + 1) + '.',
        'success'
      );
    }

    function renderProsesGrid() {
      const grid = document.getElementById('prosesGrid');
      if (!grid) return;

      grid.innerHTML = ROUTING_LIST.map(function(item) {
        return `<input type="checkbox" id="proses-${item.key}" tabindex="-1" aria-hidden="true">`;
      }).join('');

      const select = document.getElementById('routingProcessSelect');
      if (select) {
        select.innerHTML = '<option value="">Pilih proses yang akan ditambahkan</option>' +
          ROUTING_LIST.map(function(item) {
            return `<option value="${item.key}">${item.label}</option>`;
          }).join('');
      }

      renderRoutingProcessTabs_();

      renderMachineOptions_();
      captureRouteStepFieldDefaults_();
      activeRoutingKey = '';
      activeStepId = 0;
      syncRoutingTabs_();
      updateTotalProses_();
      syncRoutingEmpty_();
    }

    function routingItemByKey_(key) {
      return ROUTING_LIST.find(function(item) { return item.key === key; }) || null;
    }

    function routingProcessIcon_(key) {
      const paths = {
        mixer: '<path stroke-linecap="round" stroke-linejoin="round" d="M8 3h8M9 3v4l-4 7a4 4 0 0 0 3.5 6h7a4 4 0 0 0 3.5-6l-4-7V3M7.5 14h9M9 17h6"></path>',
        blowing: '<path stroke-linecap="round" d="M3 8h10.5a2.5 2.5 0 1 0-2.2-3.7M3 12h15a2.5 2.5 0 1 1-2.2 3.7M3 16h7"></path>',
        printing: '<path stroke-linecap="round" stroke-linejoin="round" d="M7 8V3h10v5M7 17H5a2 2 0 0 1-2-2v-4a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v4a2 2 0 0 1-2 2h-2M7 14h10v7H7zM17 11h.01"></path>',
        folding: '<path stroke-linecap="round" stroke-linejoin="round" d="M4 4h10v16H4zM14 4l6 5v11h-6M14 9h6M9 8l2 2-2 2"></path>',
        slitting: '<path stroke-linecap="round" stroke-linejoin="round" d="m4 4 8 8M4 20l6-6M14 10l6-6M14 14l6 6M8 12h8"></path><circle cx="5" cy="4" r="2"></circle><circle cx="5" cy="20" r="2"></circle>',
        gusset: '<path stroke-linecap="round" stroke-linejoin="round" d="M5 3h14v18H5zM9 3v18M15 3v18M9 8l3 3 3-3M9 16l3-3 3 3"></path>',
        cutting: '<path stroke-linecap="round" stroke-linejoin="round" d="m4 5 7 7-7 7M20 5l-7 7 7 7M9 12h6"></path><circle cx="4" cy="5" r="2"></circle><circle cx="4" cy="19" r="2"></circle>'
      };
      return '<svg fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24" aria-hidden="true">' + (paths[key] || paths.mixer) + '</svg>';
    }

    function renderRoutingProcessTabs_() {
      const tabs = document.getElementById('routingProcessTabs');
      if (!tabs) return;
      tabs.innerHTML = ROUTING_LIST.map(function(item) {
        return '<button type="button" class="routing-process-tab" role="tab" data-routing-process="' + item.key + '" aria-controls="route-' + item.key + '" aria-selected="false" onclick="selectRoutingProcess_(\'' + item.key + '\')">' +
          '<span class="routing-process-tab-icon">' + routingProcessIcon_(item.key) + '</span>' +
          '<span class="routing-process-tab-label">' + item.label + '</span>' +
          '<span class="routing-process-tab-state" aria-hidden="true"><svg fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m6 12 4 4 8-9"></path></svg></span>' +
          '</button>';
      }).join('');
    }

    function getSelectedRoutingKeys_() {
      return ROUTING_LIST.filter(function(item) {
        const input = document.getElementById('proses-' + item.key);
        return Boolean(input && input.checked);
      }).map(function(item) { return item.key; });
    }

    // Menekan tab proses selalu menyiapkan langkah BARU, termasuk bila proses
    // itu sudah ada di urutan. Itulah cara satu proses dapat dipilih berulang;
    // untuk mengubah langkah yang sudah ada, pakai tombol Edit pada kartunya.
    function selectRoutingProcess_(key) {
      if (!routingItemByKey_(key)) {
        activeRoutingKey = '';
        activeStepId = 0;
      } else {
        activeRoutingKey = key;
        activeStepId = 0;
        applyRouteStepValues_(key, null);
        if (AUTOMATIC_ROUTE_SIZE_FIELDS[key]) {
          setAutomaticRouteSizeForProcess_(key, { force: true });
        }
      }

      syncRoutingTabs_();
      syncWarnaVisibility_();
      syncBsSheetVisibility_();
      syncBahanUkuranVisibility_();
      updateFinishingNoteVisibility_();
      updateWizardState_();
    }

    // Nama lama dipertahankan sebagai jembatan bagi pemanggilan internal
    // yang mungkin masih membuka panel dari validasi.
    function openRoutingTab_(key) {
      selectRoutingProcess_(key);
    }

    function saveActiveRoutingProcess_() {
      const key = activeRoutingKey;
      const item = routingItemByKey_(key);
      if (!item) return;

      const values = captureRouteStepValues_(key);
      const auto = isActiveRouteSizeAutomatic_(key);
      const editing = activeStepId ? routingStepById_(activeStepId) : null;
      let message;

      if (editing) {
        editing.values = values;
        editing.auto = auto;
        message = item.label + ' langkah ' +
          (routingSteps.indexOf(editing) + 1) + ' diperbarui.';
      } else {
        routingStepIdCounter += 1;
        routingSteps.push({ id: routingStepIdCounter, key: key, values: values, auto: auto });
        message = item.label + ' ditambahkan sebagai langkah ' + routingSteps.length + '.';
      }

      activeRoutingKey = '';
      activeStepId = 0;
      afterRoutingStepsChanged_(message, 'success');
    }

    function cancelRoutingEditor_() {
      activeRoutingKey = '';
      activeStepId = 0;
      syncRoutingTabs_();
      syncWarnaVisibility_();
      syncBsSheetVisibility_();
      syncBahanUkuranVisibility_();
      updateWizardState_();
    }

    function editRoutingStep_(stepId) {
      const step = routingStepById_(stepId);
      if (!step) return;

      activeRoutingKey = step.key;
      activeStepId = step.id;
      applyRouteStepValues_(step.key, step.values, step);

      syncRoutingTabs_();
      syncWarnaVisibility_();
      syncBsSheetVisibility_();
      syncBahanUkuranVisibility_();
      updateFinishingNoteVisibility_();
      updateWizardState_();

      const panel = document.getElementById('route-' + step.key);
      if (panel && typeof panel.scrollIntoView === 'function') {
        panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function removeRoutingStep_(stepId) {
      const step = routingStepById_(stepId);
      if (!step) return;

      const item = routingItemByKey_(step.key);
      const position = routingSteps.indexOf(step) + 1;
      routingSteps = routingSteps.filter(function(entry) { return entry.id !== stepId; });
      if (activeStepId === stepId) {
        activeRoutingKey = '';
        activeStepId = 0;
      }

      afterRoutingStepsChanged_(
        (item ? item.label : step.key) + ' langkah ' + position + ' dihapus.',
        'remove'
      );
    }

    function showRoutingFeedback_(message, tone) {
      const feedback = document.getElementById('routingSaveFeedback');
      if (!feedback) return;
      if (routingFeedbackTimer) window.clearTimeout(routingFeedbackTimer);
      feedback.textContent = message;
      feedback.className = 'routing-save-feedback is-visible ' + (tone === 'remove' ? 'is-remove' : 'is-success');
      routingFeedbackTimer = window.setTimeout(function() {
        feedback.className = 'routing-save-feedback';
        feedback.textContent = '';
      }, 2600);
    }

    function countRoutingStepsByKey_(key) {
      return routingSteps.filter(function(step) { return step.key === key; }).length;
    }

    function syncRoutingSelectOptions_() {
      const select = document.getElementById('routingProcessSelect');
      if (select) {
        ROUTING_LIST.forEach(function(item) {
          const option = select.querySelector('option[value="' + item.key + '"]');
          if (!option) return;
          const total = countRoutingStepsByKey_(item.key);
          option.textContent = item.label + (total ? ' — ' + total + '×' : '');
        });
        select.value = activeRoutingKey || '';
      }

      ROUTING_LIST.forEach(function(item) {
        const tab = document.querySelector('[data-routing-process="' + item.key + '"]');
        if (!tab) return;
        const active = activeRoutingKey === item.key;
        const total = countRoutingStepsByKey_(item.key);
        tab.classList.toggle('is-active', active);
        tab.classList.toggle('is-saved', total > 0);
        tab.setAttribute('aria-selected', String(active));
        tab.setAttribute(
          'aria-label',
          item.label + (total ? ', dipakai ' + total + ' kali' : '')
        );

        // Badge jumlah pemakaian hanya muncul bila prosesnya berulang, supaya
        // tab yang biasa tetap bersih seperti sebelumnya.
        let badge = tab.querySelector('.routing-process-tab-count');
        if (total > 1) {
          if (!badge) {
            badge = document.createElement('span');
            badge.className = 'routing-process-tab-count';
            tab.appendChild(badge);
          }
          badge.textContent = total + '×';
        } else if (badge) {
          badge.remove();
        }
      });

    }

    function syncRoutingTabs_() {
      ROUTING_LIST.forEach(function(item) {
        const panel = document.getElementById('route-' + item.key);
        const active = activeRoutingKey === item.key;
        if (panel) {
          panel.hidden = !active;
          panel.setAttribute('aria-hidden', active ? 'false' : 'true');
          panel.classList.toggle('is-editing-existing', active && activeStepId > 0);
          panel.classList.remove('is-preview');
        }
      });

      const actions = document.getElementById('routingEditorActions');
      if (actions) actions.hidden = activeRoutingKey === '';
      const saveButton = document.getElementById('routingSaveProcessBtn');
      if (saveButton) {
        const editing = activeStepId ? routingStepById_(activeStepId) : null;
        saveButton.textContent = editing
          ? 'Perbarui Langkah ' + (routingSteps.indexOf(editing) + 1)
          : 'Tambah ke Urutan';
      }

      syncRoutingSelectOptions_();
      renderSavedRoutingList_();
      syncRoutingEmpty_();
    }

    function syncRoutePanel_(key) {
      syncRoutingTabs_();
    }

    function syncRoutingEmpty_() {
      const empty = document.getElementById('routingEmpty');
      if (!empty) return;
      empty.hidden = activeRoutingKey !== '';
      empty.textContent = routingSteps.length
        ? 'Pilih proses berikutnya untuk menambah langkah. Proses yang sama boleh dipilih lagi; gunakan tombol Edit pada kartu untuk mengubah langkah yang sudah ada.'
        : 'Pilih proses produksi di atas untuk menambahkan langkah pertama pada urutan.';
    }

    function toggleProsesPill(key) {
      syncRoutingTabs_();

      // Nilai Cutting tetap dipertahankan saat proses dibatalkan agar dapat
      // ditinjau atau dipilih kembali. Payload memastikan nilai yang tidak
      // aktif tidak ikut disimpan ke Database.
      if (key === 'cutting') {
        updateFinishingNoteVisibility_();
      }

      if (key === 'printing' || key === 'blowing') syncWarnaVisibility_();
      if (BS_SHEET_ROUTING_KEYS.indexOf(key) > -1) syncBsSheetVisibility_();

      updateTotalProses_();
      syncRoutingEmpty_();
      hitungTotalBs();
    }

    function routeFieldText_(id, fallback) {
      const field = document.getElementById(id);
      const value = field ? String(field.value || '').trim() : '';
      return value && value !== '-' ? value : (fallback || '—');
    }

    function getWarnaSummaryText_() {
      const colors = warnaRows.filter(function(row) { return String(row.nama || '').trim() !== ''; });
      if (!colors.length) return '—';
      const totalKg = colors.reduce(function(sum, row) {
        return sum + (parseCalculationNumber_(row.pemakaian) || 0);
      }, 0);
      return colors.map(function(row) { return String(row.nama).trim(); }).join(', ') +
        ' · ' + formatCalculationNumber_(totalKg, 2) + ' KG';
    }

    function stepFieldText_(step, fieldId, fallback) {
      const value = String(stepValue_(step, fieldId) || '').trim();
      return value && value !== '-' ? value : (fallback || '—');
    }

    function stepBsText_(step, bsKey) {
      const value = parseCalculationNumber_(stepValue_(step, 'bs-' + bsKey));
      return value === null ? '—' : formatCalculationNumber_(value, 2) + '%';
    }

    function getStepPackingDetail_(step) {
      const packing = String(stepValue_(step, 'packing') || '').toUpperCase();
      if (packing === 'BAG') {
        const ball = String(stepValue_(step, 'packingOuterBall') || '').trim();
        const isi = String(stepValue_(step, 'packingBallNilai') || '').trim();
        const isiUom = String(stepValue_(step, 'packingBallUom') || '').trim();
        const bagian = [];
        if (ball !== '') bagian.push(ball + ' ball / outer');
        if (isi !== '') bagian.push(isi + (isiUom ? ' ' + isiUom : '') + ' / ball');
        return bagian.join(' · ');
      }
      if (packing === 'ROLL') {
        const nilai = String(stepValue_(step, 'packingRollNilai') || '').trim();
        const uom = String(stepValue_(step, 'packingRollUom') || '').trim();
        if (nilai === '') return '';
        return nilai + (uom ? ' ' + uom : '');
      }
      return '';
    }

    function getStepCuttingBsSummary_(step) {
      // 'sheet' tidak ada di sini karena kini menjadi bagian dari Slitting.
      const keys = ['bottomSeal', 'sideSeal', 'tshirt', 'sheetSlitting', 'pon', 'handle'];
      const activeKeys = stepBsKeys_(step);
      return keys.map(function(bsKey) {
        if (activeKeys.indexOf(bsKey) === -1) return '';
        const value = parseCalculationNumber_(stepValue_(step, 'bs-' + bsKey));
        if (value === null || value === 0) return '';
        const item = BS_LIST.find(function(bsItem) { return bsItem.key === bsKey; });
        return (item ? item.label : bsKey) + ' ' + formatCalculationNumber_(value, 2) + '%';
      }).filter(Boolean).join(' · ') || '—';
    }

    // Ringkasan dibaca dari nilai langkah, bukan dari panel, supaya setiap
    // kartu menampilkan datanya sendiri walau prosesnya berulang.
    function getRouteSummaryItems_(step) {
      const key = step ? step.key : '';
      const items = [];
      const add = function(label, value) {
        const text = String(value === null || value === undefined ? '' : value).trim();
        if (text && text !== '—' && text !== '-') items.push({ label: label, value: text });
      };

      if (key === 'mixer') {
        const calculable = bahanRows.slice(0, MAX_BAHAN - 1);
        const filled = calculable.filter(function(row) { return String(row.material || '').trim() !== ''; });
        const totalKg = calculable.reduce(function(sum, row) { return sum + (parseCalculationNumber_(row.kg) || 0); }, 0);
        const totalPercent = calculable.reduce(function(sum, row) { return sum + (parseCalculationNumber_(row.percent) || 0); }, 0);
        add('Komposisi', filled.map(function(row, index) {
          return (index + 1) + '. ' + String(row.material).trim();
        }).join('\n'));
        add('Total', formatCalculationNumber_(totalKg, 2) + ' KG · ' + formatCalculationNumber_(totalPercent, 2) + '%');
      }
      if (key === 'blowing') {
        // Ukuran Blowing dan Film bernilai tunggal untuk satu SPK, jadi tetap
        // dibaca dari Data Utama walau langkah Blowing lebih dari satu.
        add('Ukuran', routeFieldText_('ukuranBlow'));
        add('Film', routeFieldText_('film'));
        add('Threat', stepFieldText_(step, 'blowingThreat'));
        add('Mesin', stepFieldText_(step, 'mesin-blowing'));
        add('Mode Cetak', stepFieldText_(step, 'blowingModeCetak'));
        // Sengaja tidak lewat add(): Keterangan Warna tetap ditampilkan walau
        // kosong, agar posisinya pada detail Blowing dan Printing konsisten
        // antar SPK. Nilainya berasal dari Data Utama, bukan panel routing.
        items.push({ label: 'Keterangan Warna', value: routeFieldText_('keteranganWarna', '-') });
        if (stepFieldText_(step, 'blowingModeCetak') === 'INLINE') add('Warna', getWarnaSummaryText_());
        add('Target BS', stepBsText_(step, 'blowing'));
      }
      if (key === 'printing') {
        add('Mesin', stepFieldText_(step, 'mesin-printing'));
        add('Kode Silinder', stepFieldText_(step, 'printingKodeSilinder'));
        items.push({ label: 'Keterangan Warna', value: routeFieldText_('keteranganWarna', '-') });
        add('Warna', getWarnaSummaryText_());
        add('Target BS', stepBsText_(step, 'printing'));
      }
      if (BS_SHEET_ROUTING_KEYS.indexOf(key) > -1) {
        add('Mesin', stepFieldText_(step, 'mesin-' + key));
        add('Ukuran', stepFieldText_(step, AUTOMATIC_ROUTE_SIZE_FIELDS[key]));
        if (key === 'gusset') add('Lebar Gusset', stepFieldText_(step, 'lebarGusset'));
        add('Target BS', stepBsText_(step, key));
        add('BS Sheet', stepBsText_(step, 'sheet'));
      }
      if (key === 'mixer') add('Mesin', stepFieldText_(step, 'mesin-mixer'));
      if (key === 'cutting') {
        add('Finishing', stepFieldText_(step, 'finishing'));
        add('Mesin', stepFieldText_(step, 'mesin-cutting'));
        add('Handle/Pon', stepFieldText_(step, 'handlePm'));
        add('Jenis Packing', stepFieldText_(step, 'jenisPacking'));
        add('Packing', stepFieldText_(step, 'packing'));
        add('Packing Detail', getStepPackingDetail_(step));
        add('Target BS', getStepCuttingBsSummary_(step));
      }

      let noteId = 'ket-' + key;
      if (key === 'cutting') {
        const noteKey = FINISHING_NOTE_KEY_MAP[stepFieldText_(step, 'finishing', '-')];
        noteId = noteKey ? 'ket-' + noteKey : '';
      }
      if (noteId) add('Keterangan', stepFieldText_(step, noteId));
      return items.length ? items : [{ label: 'Detail', value: 'Data proses tersimpan' }];
    }

    function renderSavedRoutingList_() {
      const steps = getEffectiveRoutingSteps_();
      const list = document.getElementById('routingSavedList');
      const empty = document.getElementById('routingSavedEmpty');
      const count = document.getElementById('routingSavedCount');
      if (count) count.textContent = steps.length;
      if (empty) empty.hidden = steps.length > 0;
      if (!list) return;

      const lastIndex = steps.length - 1;
      list.innerHTML = steps.map(function(step, index) {
        const item = routingItemByKey_(step.key);
        if (!item) return '';

        // Urutan pemakaian ditandai hanya bila prosesnya memang berulang, agar
        // alur biasa tidak jadi ramai oleh label tambahan.
        const repeatTotal = countRoutingStepsByKey_(step.key);
        let repeatIndex = 0;
        for (let scan = 0; scan <= index; scan++) {
          if (steps[scan].key === step.key) repeatIndex += 1;
        }
        const repeatBadge = repeatTotal > 1
          ? `<span class="routing-saved-repeat">${repeatIndex}/${repeatTotal}</span>`
          : '';

        const details = getRouteSummaryItems_(step).map(function(detail) {
          const isCompositionList = step.key === 'mixer' && detail.label === 'Komposisi';
          return `
            <div class="routing-saved-detail${isCompositionList ? ' is-composition-list' : ''}">
              <span>${escapeAttr_(detail.label)}</span>
              <strong>${escapeAttr_(detail.value)}</strong>
            </div>`;
        }).join('');

        return `
          <article class="routing-saved-card${activeStepId === step.id ? ' is-editing' : ''}">
            <div class="routing-saved-order">
              <button type="button" class="routing-saved-move is-up" onclick="moveRoutingStep_(${step.id}, -1)" ${index === 0 ? 'disabled' : ''} title="Naikkan langkah" aria-label="Naikkan ${escapeAttr_(item.label)} ke langkah ${index}">&#9650;</button>
              <div class="routing-saved-index">${String(index + 1).padStart(2, '0')}</div>
              <button type="button" class="routing-saved-move is-down" onclick="moveRoutingStep_(${step.id}, 1)" ${index === lastIndex ? 'disabled' : ''} title="Turunkan langkah" aria-label="Turunkan ${escapeAttr_(item.label)} ke langkah ${index + 2}">&#9660;</button>
            </div>
            <div class="routing-saved-content">
              <div class="routing-saved-card-head">
                <div>
                  <span class="routing-saved-status"><i></i>Tersimpan</span>
                  <h4>${escapeAttr_(item.label)}${repeatBadge}</h4>
                </div>
                <div class="routing-saved-actions">
                  <button type="button" class="routing-saved-edit" onclick="editRoutingStep_(${step.id})">Edit</button>
                  <button type="button" class="routing-saved-remove" onclick="removeRoutingStep_(${step.id})" aria-label="Hapus langkah ${index + 1} ${escapeAttr_(item.label)}">Hapus</button>
                </div>
              </div>
              <div class="routing-saved-details">${details}</div>
            </div>
          </article>`;
      }).join('');
    }

    // Blok warna hanya ada satu; ia dipindahkan ke panel yang memakainya.
    // Printing didahulukan karena kolom warna di Database memang miliknya.
    function syncWarnaVisibility_() {
      const area = document.getElementById('warnaArea');
      if (!area) return;

      const modeCetak = document.getElementById('blowingModeCetak');
      const inlineOn = modeCetak
        && String(modeCetak.value).toUpperCase() === 'INLINE';

      let host = null;
      if (activeRoutingKey === 'printing') {
        host = document.getElementById('warnaHost-printing');
      } else if (activeRoutingKey === 'blowing' && inlineOn) {
        host = document.getElementById('warnaHost-blowing');
      }

      if (!host) {
        area.hidden = true;
        return;
      }

      if (area.parentElement !== host) host.appendChild(area);
      area.hidden = false;
    }

    // dibuka, sama seperti perlakuan blok warna tinta.
    function syncBsSheetVisibility_() {
      const area = document.getElementById('bsSheetArea');
      if (!area) return;

      const host = BS_SHEET_ROUTING_KEYS.indexOf(activeRoutingKey) > -1
        ? document.getElementById('bsSheetHost-' + activeRoutingKey)
        : null;

      if (!host) {
        area.hidden = true;
        return;
      }

      if (area.parentElement !== host) host.appendChild(area);
      area.hidden = false;

    // tombol pilihan, kolom target BS, dan kotak keterangannya.
    function updateFinishingNoteVisibility_() {

      const noteKey = FINISHING_NOTE_KEY_MAP[selected] || '';

      document.querySelectorAll('.finishing-choice').forEach(function(button) {

    function updateTotalProses_() {

    function isRoutingProcessSelected_(key) {

    // Total BS dijumlahkan per langkah, sehingga Folding yang dijalankan dua
    // kali menyumbang target BS-nya dua kali pula.
    function getTotalBs_() {
      const totals = getAggregatedBsPercent_();
      const bs = BS_LIST.reduce(function(total, item) {
        return total + (totals[item.key] || 0);
      }, 0);
      // Toleransi produksi adalah kelebihan yang sengaja dijalankan di luar
      // target BS tiap proses, jadi ikut menambah Total BS.
      return bs + getToleransiProduksi_();

    // KG setiap bahan Mixer selalu diturunkan dari persentase komposisi dan
    // nilai Keluar Bahan: KG = (% / 100) x Keluar Bahan.
    function calculateMixerKg_(percent, keluarBahan) {
      const percentNumber = parseCalculationNumber_(percent);
      if (!(keluarBahan > 0) || percentNumber === null || percentNumber < 0) return '';

      const result = (percentNumber / 100) * keluarBahan;
      return Math.round(result * 1000000) / 1000000;
    }

    function syncMixerKgFromPercent_(updateInputs) {
      const shouldUpdateInputs = updateInputs !== false;
      const keluarBahanField = document.getElementById('keluarBahan');
      const keluarBahan = parseCalculationNumber_(keluarBahanField ? keluarBahanField.value : '');

      bahanRows.forEach((row, index) => {
        if (index === MAX_BAHAN - 1) return;
        const calculatedKg = calculateMixerKg_(row.percent, keluarBahan);
        row.kg = calculatedKg === '' ? '' : String(calculatedKg);

        if (shouldUpdateInputs) {
          const kgInput = document.getElementById('bahanKg-' + row.id);
          if (kgInput) kgInput.value = row.kg;
        }
      });

      hitungTotalKomposisi();
      refreshSavedMixerSummary_();
    }

    function escapeAttr_(value) {
      return String(value === null || value === undefined ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function hitungTotalKomposisi() {
      let totalKg = 0;
      let totalPercent = 0;
      bahanRows.forEach((row, index) => {
        if (index === MAX_BAHAN - 1) return;
        totalKg += parseCalculationNumber_(row.kg) || 0;
        totalPercent += parseCalculationNumber_(row.percent) || 0;
      });
      document.getElementById('totalKomposisiDisplay').textContent =
        totalKg.toFixed(2) + ' KG · ' + totalPercent.toFixed(2) + '%';
    }

      'TEAL', 'YELLOW', 'ORANGE', 'CYAN'
    ];

    const WARNA_DOT_COLORS = [
      ['MAGENTA', '#d946ef'],
      ['TOSCA|TEAL', '#0d9488'],
      ['CYAN', '#06b6d4'],
      ['NAVY|DONGKER', '#1e3a8a'],
      ['MAROON', '#7f1d1d'],
      ['HITAM|BLACK', '#1f2937'],
      ['PUTIH|WHITE', '#f9fafb'],
      ['MERAH|RED', '#dc2626'],
      ['BIRU|BLUE', '#2563eb'],
      ['HIJAU|GREEN', '#16a34a'],
      ['KUNING|YELLOW', '#eab308'],
      ['ORANGE|ORANYE|JINGGA', '#f97316'],
      ['PINK', '#ec4899'],
      ['UNGU|VIOLET|PURPLE', '#7c3aed'],
      ['GOLD|EMAS', '#d4af37'],
      ['SILVER|PERAK', '#c0c0c0'],
      ['COKLAT|BROWN', '#92400e'],
      ['ABU|GREY|GRAY', '#6b7280'],

    function warnaDotColor_(nama) {
      const text = String(nama || '').toUpperCase();
      if (text.trim() === '') return '';
      for (let index = 0; index < WARNA_DOT_COLORS.length; index++) {
        if (new RegExp('\\b(' + WARNA_DOT_COLORS[index][0] + ')').test(text)) {
          return WARNA_DOT_COLORS[index][1];
        }
      }
      return '';
    }

          <span class="warna-chip" data-warna-chip="${nama}" onclick="tambahWarnaDariChip_('${nama}')">
            <span class="warna-dot"${color ? ` style="background:${color}"` : ''}></span>${nama}
          </span>

        return `
          <div class="bahan-row route-color-row">

    // Validasi SPK baru dan pencarian SPK lama ditangani pada blok JENIS ORDER di atas.

    // ==========================================
    // JADWAL KIRIM
    // ==========================================
    // Tanggal kirim dan pengiriman bertahap adalah satu daftar: tahap pertama
    // menjadi ETD, tahap berikutnya hanya diisi bila barang dikirim bertahap.
    //
    // Jumlah tiap tahap dipilih antara Full dan Custom. Full berarti tahap itu
    // mengambil sisa order yang belum dipesan tahap Custom mana pun, sehingga
    // Admin tidak perlu menghitung sendiri. Bila lebih dari satu tahap memakai
    // Full, sisanya dibagi rata di antara mereka dan jumlah seluruh tahap tetap
    // sama dengan Jumlah Order.
    const MAX_PENGIRIMAN = 12;
    const JADWAL_MODE_FULL = 'FULL';
    const JADWAL_MODE_CUSTOM = 'CUSTOM';

    function tambahPengirimanRow_(entry) {
      pengirimanIdCounter += 1;
      const mode = String(entry && entry.mode ? entry.mode : '').toUpperCase() === JADWAL_MODE_CUSTOM
        ? JADWAL_MODE_CUSTOM
        : JADWAL_MODE_FULL;
      pengirimanRows.push({
        id: pengirimanIdCounter,
        tanggal: String(entry && entry.tanggal ? entry.tanggal : ''),
        mode: mode,
        jumlah: entry && entry.jumlah !== null && entry.jumlah !== undefined ? entry.jumlah : '',
        uom: String(entry && entry.uom ? entry.uom : '').toUpperCase()
      });
    }

    function tambahPengiriman() {
      if (pengirimanRows.length >= MAX_PENGIRIMAN) return;
      tambahPengirimanRow_({ uom: String(getFieldValue_('uomOrder') || 'PCS').toUpperCase() });
      renderPengirimanList_();
      updateWizardState_();
    }

    // Tahap pertama tidak dapat dihapus karena ia yang menjadi ETD; yang bisa
    // dilakukan hanya mengosongkan tanggalnya.
    function hapusPengiriman(id) {
      if (pengirimanRows.length <= 1) return;
      pengirimanRows = pengirimanRows.filter(function(row) { return row.id !== id; });
      renderPengirimanList_();
      updateWizardState_();
    }

    function updatePengiriman(id, field, value) {
      const row = pengirimanRows.find(function(item) { return item.id === id; });
      if (!row) return;
      row[field] = value;
      refreshJadwalComputed_();
      updateWizardState_();
    }

    function setJadwalMode_(id, mode) {
      const row = pengirimanRows.find(function(item) { return item.id === id; });
      if (!row) return;

      const next = mode === JADWAL_MODE_CUSTOM ? JADWAL_MODE_CUSTOM : JADWAL_MODE_FULL;
      if (row.mode === next) return;

      // Beralih ke Custom membawa serta angka yang sedang tampil, supaya Admin
      // tinggal menyesuaikan alih-alih mengetik ulang dari nol.
      if (next === JADWAL_MODE_CUSTOM) {
        const amounts = computeJadwalAmounts_();
        const index = pengirimanRows.indexOf(row);
        const current = amounts[index];
        if (current !== null && current > 0) row.jumlah = formatCalculationNumber_(current, 2, 0);
      }

      row.mode = next;
      renderPengirimanList_();
      updateWizardState_();
    }

    // Nilai tiap tahap setelah Full diterjemahkan menjadi angka.
    function computeJadwalAmounts_() {
      const order = parseCalculationNumber_(getFieldValue_('jumlahOrder'));
      let diambilCustom = 0;
      let jumlahFull = 0;

      pengirimanRows.forEach(function(row) {
        if (row.mode === JADWAL_MODE_CUSTOM) {
          diambilCustom += parseCalculationNumber_(row.jumlah) || 0;
        } else {
          jumlahFull += 1;
        }
      });

      const sisa = order === null ? null : Math.max(0, order - diambilCustom);
      const perFull = sisa === null || jumlahFull === 0 ? null : sisa / jumlahFull;

      return pengirimanRows.map(function(row) {
        return row.mode === JADWAL_MODE_CUSTOM
          ? parseCalculationNumber_(row.jumlah)
          : perFull;
      });
    }

    // Tanggal diketik singkat seperti 6/8, lalu ditulis kembali dalam bentuk
    // panjang begitu isian ditinggalkan.
    function commitPengirimanTanggal_(id, input) {
      const row = pengirimanRows.find(function(item) { return item.id === id; });
      if (!row || !input) return;

      const raw = String(input.value || '').trim();
      if (raw === '') {
        row.tanggal = '';
        input.classList.remove('wizard-invalid');
      } else {
        const iso = parseEtdQuickValue_(raw);
        row.tanggal = iso;
        input.classList.toggle('wizard-invalid', !iso);
        if (iso) input.value = formatEtdLong_(iso);
      }

      syncEtdFromJadwal_();
      refreshJadwalComputed_();
      updateWizardState_();
    }

    // ETD adalah tanggal paling awal pada jadwal, sehingga urutan pengisian
    // barisnya tidak memengaruhi hasil.
    function syncEtdFromJadwal_() {
      const field = document.getElementById('etd');
      if (!field) return;

      const dates = pengirimanRows
        .map(function(row) { return String(row.tanggal || '').trim(); })
        .filter(Boolean)
        .sort();
      field.value = dates.length ? dates[0] : '';
    }

    // Menyegarkan angka tahap Full dan ringkasannya tanpa menggambar ulang
    // daftar, supaya kursor tidak lompat saat Admin sedang mengetik.
    function refreshJadwalComputed_() {
      const amounts = computeJadwalAmounts_();

      pengirimanRows.forEach(function(row, index) {
        const field = document.querySelector('[data-jadwal-full="' + row.id + '"]');
        if (!field) return;
        const value = amounts[index];
        field.value = value === null ? '' : formatCalculationNumber_(value, 2, 0);
      });

      updatePengirimanSummary_(amounts);
    }

    function updatePengirimanSummary_(precomputed) {
      const summary = document.getElementById('partialSummary');
      if (!summary) return;

      const amounts = precomputed || computeJadwalAmounts_();
      const terjadwal = pengirimanRows.filter(function(row) {
        return String(row.tanggal || '').trim() !== '';
      });

      const setTone = function(tone, text) {
        summary.className = 'partial-summary' + (tone ? ' is-' + tone : '');
        summary.textContent = text;
      };

      if (!terjadwal.length) {
        setTone('', 'Tanggal kirim belum diisi');
        return;
      }
      if (pengirimanRows.length === 1) {
        setTone('ok', 'Kirim sekaligus pada ' + formatEtdLong_(terjadwal[0].tanggal));
        return;
      }

      const uom = String(getFieldValue_('uomOrder') || '').toUpperCase();
      const total = amounts.reduce(function(sum, value) { return sum + (value || 0); }, 0);
      const order = parseCalculationNumber_(getFieldValue_('jumlahOrder'));
      let text = pengirimanRows.length + ' tahap \u00b7 ' + formatCalculationNumber_(total, 2, 0) + ' ' + uom;

      if (order === null) {
        setTone('', text);
        return;
      }

      const sisa = order - total;
      if (Math.abs(sisa) < 0.005) {
        setTone('ok', text + ' \u00b7 sesuai order');
        return;
      }
      setTone(
        'warn',
        text + ' \u00b7 ' + (sisa > 0 ? 'kurang ' : 'lebih ') +
          formatCalculationNumber_(Math.abs(sisa), 2, 0) + ' ' + uom
      );
    }

    function renderPengirimanList_() {
      const container = document.getElementById('partialList');
      if (!container) return;

      if (!pengirimanRows.length) tambahPengirimanRow_();
      const amounts = computeJadwalAmounts_();

      container.innerHTML = pengirimanRows.map(function(row, index) {
        const isEtd = index === 0;
        const isCustom = row.mode === JADWAL_MODE_CUSTOM;
        const tampilan = row.tanggal ? formatEtdLong_(row.tanggal) : '';
        const nilaiFull = amounts[index];
        // Nomor tahap ditulis langsung pada nama kolomnya, jadi tidak perlu
        // bulatan penanda terpisah. Tahap pertama tetap ditandai ETD karena
        // tanggalnya yang dipakai sebagai tanggal kirim utama.
        const judul = 'Tanggal Kirim ' + (index + 1)
          + (isEtd ? ' <span class="field-label-hint">(ETD)</span>' : '');

        const tombolHapus = isEtd
          ? ''
          : `<button type="button" class="jadwal-remove" onclick="hapusPengiriman(${row.id})" title="Hapus tahap ${index + 1}" aria-label="Hapus tahap ${index + 1}">\u2715</button>`;

        // Nilai dan satuannya memakai bentuk input-pair yang sama dengan
        // Order, Keluar Bahan, dan Jenis Bahan di Data Utama.
        const kolomNilai = isCustom
          ? `<input type="number" min="0" step="any" class="field-input" value="${escapeAttr_(row.jumlah)}" placeholder="0" aria-label="Jumlah tahap ${index + 1}" oninput="updatePengiriman(${row.id},'jumlah',this.value)">`
          : `<input type="text" class="field-input is-readonly" data-jadwal-full="${row.id}" value="${escapeAttr_(nilaiFull === null ? '' : formatCalculationNumber_(nilaiFull, 2, 0))}" placeholder="Ikut Jumlah Order" readonly tabindex="-1" aria-label="Jumlah tahap ${index + 1}, mengikuti sisa order">`;

        // Tombol hapus ditaruh di ujung baris label kolom Nilai, bukan pada
        // baris judul tersendiri, sehingga tinggi tiap tahap berkurang satu
        // baris penuh tanpa menggeser kolom isian dari grid Data Utama.
        return `
          <article class="jadwal-stage${isEtd ? ' is-etd' : ''}">
            <div class="form-grid">
              <div class="form-cell span-2">
                <label class="field-label">${judul}</label>
                <input type="text" class="field-input etd-display-input" data-partial-date="${row.id}"
                  inputmode="numeric" maxlength="20" autocomplete="off" spellcheck="false"
                  placeholder="6/8" title="Ketik tanggal/bulan, contoh 6/8" value="${escapeAttr_(tampilan)}"
                  onchange="commitPengirimanTanggal_(${row.id}, this)"
                  onblur="commitPengirimanTanggal_(${row.id}, this)">
              </div>
              <div class="form-cell">
                <label class="field-label">Jumlah</label>
                <div class="jadwal-segment" role="group" aria-label="Jumlah tahap ${index + 1}">
                  <button type="button" class="jadwal-segment-option${isCustom ? '' : ' active'}" aria-pressed="${!isCustom}" onclick="setJadwalMode_(${row.id}, 'FULL')">Full</button>
                  <button type="button" class="jadwal-segment-option${isCustom ? ' active' : ''}" aria-pressed="${isCustom}" onclick="setJadwalMode_(${row.id}, 'CUSTOM')">Custom</button>
                </div>
              </div>
              <div class="form-cell">
                <label class="field-label jadwal-label jadwal-label--end">
                  <span>Nilai</span>
                  ${tombolHapus}
                </label>
                <div class="input-pair">
                  ${kolomNilai}
                  <select class="field-input input-pair-uom" aria-label="Satuan tahap ${index + 1}" onchange="updatePengiriman(${row.id},'uom',this.value)">
                    <option value="">UOM</option>
                    <option value="PCS"${row.uom === 'PCS' ? ' selected' : ''}>PCS</option>
                    <option value="KG"${row.uom === 'KG' ? ' selected' : ''}>KG</option>
                    <option value="ROLL"${row.uom === 'ROLL' ? ' selected' : ''}>ROLL</option>
                  </select>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');

      const button = document.getElementById('btnAddPartial');
      if (button) button.classList.toggle('disabled', pengirimanRows.length >= MAX_PENGIRIMAN);
      syncEtdFromJadwal_();
      updatePengirimanSummary_(amounts);
    }

    // Nilai tahap Full disimpan sebagai angka hasil hitungan, bukan sebagai
    // penanda saja, supaya pembacanya di Dashboard dan lembar cetak tidak perlu
    // ikut menghitung ulang. Mode tetap disertakan agar pilihannya kembali utuh
    // saat SPK dibuka lagi.
    function buildJadwalPayload_() {
      const amounts = computeJadwalAmounts_();
      return pengirimanRows
        .map(function(row, index) {
          return {
            tanggal: row.tanggal,
            mode: row.mode,
            jumlah: amounts[index] === null ? '' : amounts[index],
            uom: row.uom
          };
        })
        .filter(function(entry) { return String(entry.tanggal || '').trim() !== ''; });
    }

    function setPengirimanRows_(entries) {
      pengirimanRows = [];
      pengirimanIdCounter = 0;
      (Array.isArray(entries) ? entries : [])
        .slice(0, MAX_PENGIRIMAN)
        .forEach(function(entry) { tambahPengirimanRow_(entry); });
      if (!pengirimanRows.length) tambahPengirimanRow_();
      renderPengirimanList_();
    }

    // ==========================================
    // SUBMIT
    // ==========================================
    function bindWizardSubmit_() {
      formEl.addEventListener('submit', function (event) {
        event.preventDefault();
        submitDatabase_();
      });
    }

    function showSaveSuccess_(message, spk) {
      const overlay = document.getElementById('saveSuccessOverlay');
      const printLink = document.getElementById('printSpkLink');
      document.getElementById('saveSuccessMessage').textContent =
        'SPK menunggu persetujuan wajib. Cetak dan release akan terbuka otomatis setelah semua tanda tangan lengkap.';
      document.getElementById('saveSuccessSpk').textContent = spk || '—';
      printLink.href = printLink.dataset.baseUrl;

      overlay.hidden = false;
      const root = document.getElementById('spkInputRoot');
      if (root) root.classList.add('dialog-open');
      if (typeof window.onSpkInputSaved === 'function') window.onSpkInputSaved(spk);

      window.setTimeout(() => {
        printLink.focus();
      }, 0);
    }

    const SPK_AUTH_STORAGE_KEY_ = 'pgm:spk-auth-v1';

    function approvalRpcPromise_(method) {
      const args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function(resolve, reject) {
        const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        runner[method].apply(runner, args);
      });
    }

    async function ensureCreatorApprovalLogin_() {
      let saved = null;
      let savedPermanently = false;
      try {
        const localAuth = localStorage.getItem(SPK_AUTH_STORAGE_KEY_);
        savedPermanently = Boolean(localAuth);
        saved = JSON.parse(localAuth || sessionStorage.getItem(SPK_AUTH_STORAGE_KEY_) || 'null');
      } catch (ignore) {}
      if (saved && saved.token) {
        try {
          const current = await approvalRpcPromise_('getApprovalSession', saved.token);
          if (current && current.status === 'success' && current.user.roleKey === 'admin_ppic') {
            saved.user = current.user;
            (savedPermanently ? localStorage : sessionStorage).setItem(SPK_AUTH_STORAGE_KEY_, JSON.stringify(saved));
            return saved;
          }
        } catch (ignore) {}
        localStorage.removeItem(SPK_AUTH_STORAGE_KEY_);
        sessionStorage.removeItem(SPK_AUTH_STORAGE_KEY_);
      }

      const result = await Swal.fire({
        icon: 'info',
        title: 'Login Admin PPIC',
        html: '<p style="font-size:.9rem;color:#5f6670">SPK baru hanya dapat dibuat oleh Admin PPIC. Paraf pembuat akan terisi otomatis.</p>' +
          '<input id="approvalLoginEmail" class="swal2-input" type="email" autocomplete="username" placeholder="Email">' +
          '<input id="approvalLoginPassword" class="swal2-input" type="password" autocomplete="current-password" placeholder="Password">' +
          '<label style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:.9rem"><input id="approvalLoginRemember" type="checkbox"> Remember me</label>',
        showCancelButton: true,
        confirmButtonText: 'Masuk & Lanjutkan',
        cancelButtonText: 'Batal',
        confirmButtonColor: '#202020',
        showLoaderOnConfirm: true,
        allowOutsideClick: function() { return !Swal.isLoading(); },
        preConfirm: async function() {
          const email = document.getElementById('approvalLoginEmail').value.trim();
          const password = document.getElementById('approvalLoginPassword').value;
          if (!email || !password) { Swal.showValidationMessage('Email dan password wajib diisi.'); return false; }
          try {
            const remember = document.getElementById('approvalLoginRemember').checked;
            const response = await approvalRpcPromise_('loginApprovalUser', email, password, remember);
            if (!response || response.status !== 'success') throw new Error(response && response.message || 'Login gagal.');
            if (!response.user || response.user.roleKey !== 'admin_ppic') throw new Error('Hanya akun Admin PPIC/pembuat yang dapat membuat SPK.');
            response.remember = remember;
            return response;
          } catch (error) { Swal.showValidationMessage(error.message || 'Login gagal.'); return false; }
        }
      });
      if (!result.isConfirmed || !result.value) return null;
      const auth = { token: result.value.token, user: result.value.user };
      localStorage.removeItem(SPK_AUTH_STORAGE_KEY_);
      sessionStorage.removeItem(SPK_AUTH_STORAGE_KEY_);
      (result.value.remember ? localStorage : sessionStorage).setItem(SPK_AUTH_STORAGE_KEY_, JSON.stringify(auth));
      return auth;
    }

    async function submitDatabase_() {
      if (!validateAllSteps_()) return;

      const activeTargetState = getActiveTargetSpkState_();
      if (activeTargetState.duplicate || activeTargetState.state !== 'available') {
        Swal.fire({
          icon: 'warning',
          title: 'SPK Belum Valid',
          text: 'Pastikan nomor SPK baru sudah diperiksa dan berstatus tersedia.',
          confirmButtonColor: '#202020',
          background: '#e0e5ec',
          customClass: { popup: 'swal2-popup-neumorphic' }
        });
        return;
      }

      const creatorAuth = await ensureCreatorApprovalLogin_();
      if (!creatorAuth) return;

      completedSteps.add(WIZARD_STEPS.length);
      updateWizardState_();

      // Kolom ringkasan di Database hanya menyediakan satu tempat per proses,
      // jadi nilainya diambil dari langkah pertama proses tersebut. Rincian
      // lengkap tiap langkah tetap utuh pada payload.routingSteps.
      const submittedSteps = getEffectiveRoutingSteps_();
      const stepOf = function(key) {
        return submittedSteps.find(function(step) { return step.key === key; }) || null;
      };
      const firstValue = function(key, fieldId) {
        const step = stepOf(key);
        return step ? String(stepValue_(step, fieldId) || '') : '';
      };

      const blowingStep = stepOf('blowing');
      const cuttingStep = stepOf('cutting');

      const payload = {
        authToken: creatorAuth.token,
        spk: getActiveSpkValue_(),
        spkReferensi: getOrderMode_() === 'repeat' ? spkSebelumnyaField.value.trim().toUpperCase() : '',
        tanggal: document.getElementById('tanggal').value,
        jenisOrder: document.getElementById('jenisOrder').value,
        marketing: document.getElementById('marketing').value,
        nomorPO: document.getElementById('nomorPO').value,
        customer: document.getElementById('customer').value,
        material: document.getElementById('material').value,
        film: document.getElementById('film').value,
        artikel: document.getElementById('artikel').value,
        kodeItem: document.getElementById('kodeItem').value,
        keteranganWarna: document.getElementById('keteranganWarna').value,
        keteranganBahan: document.getElementById('keteranganBahan').value,
        keteranganArtikel: document.getElementById('keteranganArtikel').value,
        modelKantong: document.getElementById('modelKantong').value,
        blowingThreat: firstValue('blowing', 'blowingThreat'),
        blowingModeCetak: firstValue('blowing', 'blowingModeCetak'),
        printingKodeSilinder: firstValue('printing', 'printingKodeSilinder'),
        ukuranFolding: firstValue('folding', 'ukuranFolding'),
        ukuranSlitting: firstValue('slitting', 'ukuranSlitting'),
        ukuranGusset: firstValue('gusset', 'ukuranGusset'),
        jenisPacking: firstValue('cutting', 'jenisPacking'),
        packing: firstValue('cutting', 'packing'),
        pcsKgMode: document.getElementById('pcsKgMode').value,
        jenisPotongan: document.getElementById('jenisPotongan').value,
        poMasuk: document.getElementById('poMasuk').value,
        stok: document.getElementById('stok').value,
        ots: document.getElementById('ots').value,
        wip: document.getElementById('wip').value,
        toleransiProduksi: document.getElementById('toleransiProduksi').value,
        bahanLebar: bahanUkuranManual.lebar,
        bahanPanjang: bahanUkuranManual.panjang,
        bahanTebal: bahanUkuranManual.tebal,
        bahanDensity: bahanUkuranManual.density,
        // Seluruh tahap dikirim apa adanya, termasuk tahap pertama yang
        // menjadi ETD, supaya jadwalnya tersimpan utuh.
        pengirimanParsial: buildJadwalPayload_(),
        routingSteps: submittedSteps.map(function(step) {
          return { key: step.key, values: step.values };
        }),
        ukuranBlow: document.getElementById('ukuranBlow').value,
        ukuranJadi: document.getElementById('ukuranJadi').value,
        proses: {},
        keteranganProses: {},
        finishing: cuttingStep ? String(stepValue_(cuttingStep, 'finishing') || '-') : '-',
        handlePm: cuttingStep ? String(stepValue_(cuttingStep, 'handlePm') || '-') : '-',
        bsPercent: {},
        jumlahOrder: document.getElementById('jumlahOrder').value,
        uomOrder: document.getElementById('uomOrder').value,
        meterRoll: document.getElementById('meterRoll').value,
        keluarBahan: document.getElementById('keluarBahan').value,
        uomKB: document.getElementById('uomKB').value,
        toleransi: document.getElementById('toleransi').value,
        etd: document.getElementById('etd').value,
        komposisi: bahanRows.map(row => ({ material: row.material, kg: row.kg, percent: row.percent })),
        warna: []
      };

      PROCESS_NOTE_KEYS.forEach(function(key) {
        payload.keteranganProses[key] = '';
      });
      PROSES_LIST.forEach(p => {
        payload.proses[p.key] = Boolean(stepOf(p.key));
      });

      // Satu kolom keterangan per proses. Bila prosesnya berulang dan tiap
      // langkah punya catatan sendiri, semuanya digabung dan diberi nomor
      // langkah supaya tidak ada yang hilang dari lembar cetak.
      const noteFieldOf = {};
      PROSES_LIST.forEach(function(p) {
        if (p.noteLabel) noteFieldOf[p.key] = 'ket-' + p.key;
      });
      const collectedNotes = {};
      submittedSteps.forEach(function(step, index) {
        let noteKey = step.key;
        if (step.key === 'cutting') {
          noteKey = FINISHING_NOTE_KEY_MAP[
            String(stepValue_(step, 'finishing') || '-').toUpperCase()
          ] || '';
        } else if (!noteFieldOf[step.key]) {
          noteKey = '';
        }
        if (!noteKey || PROCESS_NOTE_KEYS.indexOf(noteKey) === -1) return;

        const note = String(stepValue_(step, 'ket-' + noteKey) || '').trim();
        if (note === '') return;
        if (!collectedNotes[noteKey]) collectedNotes[noteKey] = [];
        collectedNotes[noteKey].push({ position: index + 1, note: note });
      });
      Object.keys(collectedNotes).forEach(function(noteKey) {
        const entries = collectedNotes[noteKey];
        payload.keteranganProses[noteKey] = entries.length === 1
          ? entries[0].note
          : entries.map(function(entry) {
              return 'Langkah ' + entry.position + ': ' + entry.note;
            }).join(' | ');
      });

      // Warna dipakai Printing, atau Blowing bila mode cetaknya Inline.
      const inlineActive = Boolean(blowingStep) &&
        String(stepValue_(blowingStep, 'blowingModeCetak') || '').toUpperCase() === 'INLINE';
      if (payload.proses.printing || inlineActive) {
        payload.warna = warnaRows.map(row => ({ nama: row.nama, pemakaian: row.pemakaian }));
      }

      const bsTotals = getAggregatedBsPercent_();
      BS_LIST.forEach(b => {
        payload.bsPercent[b.key] = bsTotals[b.key] || 0;
      });

      btnSubmitEl.disabled = true;
      btnSubmitEl.dataset.saving = 'true';
      btnSubmitEl.innerHTML = `
        <span class="button-spinner"></span>
        MENYIMPAN...
      `;

      google.script.run
        .withSuccessHandler(res => {
          delete btnSubmitEl.dataset.saving;
          btnSubmitEl.disabled = false;
          updateNavigationButtons_();

          const response = res || {
            status: 'error',
            message: 'Respons server tidak dikenali. Periksa PPIC sebelum mencoba menyimpan ulang.'
          };

          if (response.status === 'success') {
            const currentSnapshot = getFreshSpkExistenceSnapshot_();
            if (currentSnapshot) {
              currentSnapshot.add(normalizeClientSpk_(payload.spk));
              spkExistenceSnapshotAt = Date.now();
            }
            showSaveSuccess_(response.message, payload.spk);
          } else if (response.status === 'duplicate') {
            const currentSnapshot = getFreshSpkExistenceSnapshot_();
            if (currentSnapshot) {
              currentSnapshot.add(normalizeClientSpk_(payload.spk));
              spkExistenceSnapshotAt = Date.now();
            }
            setTargetSpkDuplicate_(getOrderMode_(), getActiveSpkValue_());
            changeStep_(1, 'backward');
            Swal.fire({
              icon: 'warning',
              title: 'SPK Sudah Ada',
              text: response.message,
              confirmButtonColor: '#202020',
              background: '#e0e5ec',
              customClass: { popup: 'swal2-popup-neumorphic' }
            });
          } else {
            Swal.fire({
              icon: 'error',
              title: 'Gagal Menyimpan',
              text: response.message,
              confirmButtonColor: '#dc2626',
              background: '#e0e5ec',
              customClass: { popup: 'swal2-popup-neumorphic' }
            });
          }
        })
        .withFailureHandler(err => {
          delete btnSubmitEl.dataset.saving;
          btnSubmitEl.disabled = false;
          updateNavigationButtons_();
          Swal.fire({
            icon: 'error',
            title: 'Kesalahan Sistem',
            text: err && err.message
              ? err.message
              : 'Konfirmasi server tidak dapat dibaca. Periksa PPIC sebelum mencoba menyimpan ulang.',
            confirmButtonColor: '#dc2626',
            background: '#e0e5ec',
            customClass: { popup: 'swal2-popup-neumorphic' }
          });
        })
        .submitDatabase(payload);
    }
</script>
