    function getFreshSpkExistenceSnapshot_() {
      if (!spkExistenceSnapshot) return null;
      if (Date.now() - spkExistenceSnapshotAt <= SPK_SNAPSHOT_MAX_AGE_MS) {
        return spkExistenceSnapshot;
      }

      spkExistenceSnapshot = null;
      spkExistenceSnapshotAt = 0;
      return null;
    }

    function warmSpkExistenceSnapshot_() {
      if (getFreshSpkExistenceSnapshot_() || spkExistenceWarmupStarted) return;
      spkExistenceWarmupStarted = true;

      google.script.run
        .withSuccessHandler(function(res) {
          spkExistenceWarmupStarted = false;
          if (!res || res.status !== 'success' || !Array.isArray(res.spks)) return;

          spkExistenceSnapshot = new Set(
            res.spks.map(normalizeClientSpk_).filter(Boolean)
          );
          spkExistenceSnapshotAt = Date.now();
        })
        .withFailureHandler(function() {
          spkExistenceWarmupStarted = false;
        })
        .getSpkExistenceSnapshot();
    }

    function parseCalculationNumber_(value) {
      if (value === '' || value === null || value === undefined) return null;

      let text = String(value).trim().replace(/\s+/g, '');
      if (text === '') return null;

      if (text.includes(',') && text.includes('.')) {
        if (text.lastIndexOf(',') > text.lastIndexOf('.')) {
          text = text.replace(/\./g, '').replace(',', '.');
        } else {
          text = text.replace(/,/g, '');
        }
      } else if (text.includes(',')) {
        text = text.replace(',', '.');
      }

      const number = Number(text);
      return Number.isFinite(number) ? number : null;
    }

    function extractFirstCalculationNumber_(value) {
      const match = String(value === null || value === undefined ? '' : value)
        .match(/-?\d+(?:[.,]\d+)?/);
      return match ? parseCalculationNumber_(match[0]) : null;
    }

    function parseCalculationDimensions_(ukuranBlow, ukuranJadi) {
      const jadiParts = String(ukuranJadi || '').split(/\s*[xX]\s*/);
      const blowParts = String(ukuranBlow || '').split(/\s*[xX]\s*/);

      return {
        lebar: extractFirstCalculationNumber_(
          String(jadiParts[0] || '').replace(/[(/]/g, ' ')
        ),
        panjang: jadiParts.length > 1
          ? extractFirstCalculationNumber_(jadiParts[1])
          : null,
        tebal: jadiParts.length > 2
          ? extractFirstCalculationNumber_(jadiParts[jadiParts.length - 1])
          : null,
        lebarBahan: extractFirstCalculationNumber_(
          String(blowParts[0] || '').replace(/[(/]/g, ' ')
        ),
        upTertulis: extractWrittenUp_(ukuranBlow)
      };
    }

    // Admin menuliskan jumlah lajur langsung pada Ukuran Blowing, misalnya
    // "47 X 0.032 (10 UP)". Angka itu yang dipakai lebih dulu karena berasal
    // dari orang yang tahu kondisi mesin; hitungan dari lebar hanya cadangan.
    function extractWrittenUp_(ukuranBlow) {
      const match = String(ukuranBlow || '').match(/(\d+)\s*UP\b/i);
      if (!match) return null;
      const value = parseInt(match[1], 10);
      return Number.isFinite(value) && value > 0 ? value : null;
    }

    function getCalculationMeter_(tebal, material) {
      if (!(tebal > 0)) return null;
      if (String(material || '').toUpperCase().includes('CPP')) return 6000;
      if (tebal >= 0.029) return 3000;
      if (tebal >= 0.020) return 4000;
      return 6000;
    }

    function getCalculationDensity_(material) {
      const text = String(material || '').trim().toUpperCase();
      // SHRINK tidak memuat penggal PE, HD, maupun PP. Tanpa baris ini
      // massa jenisnya kosong dan hitungan meter per kg ikut gagal. Nilai
      // lama 'PE SHRINK' pun tetap 0,92, jadi hasilnya tidak berubah.
      if (text.includes('SHRINK')) return 0.92;
      if (text.includes('HD')) return 0.94;
      if (text.includes('PE')) return 0.92;
      if (text.includes('CPP') || text.includes('OPP') || text.includes('PP')) return 0.91;
      return null;
    }

    function getFilmLayerFactor_(film) {
      const text = String(film || '').trim().toUpperCase();
      if (text === '') return null;
      return text.includes('TUBE') ? 2 : 1;
    }

    function calculateMeterPerKg_(lebar, tebal, density, filmLayerFactor) {
      if (
        !(lebar > 0) ||
        !(tebal > 0) ||
        !(density > 0) ||
        !(filmLayerFactor > 0)
      ) {
        return null;
      }

      return 1 /
        (
          density *
          ((lebar / 100) * (tebal * 1000) * filmLayerFactor) /
          1000
        );
    }

    function classifyRawMaterial_(material, uomOrder, customer) {
      const materialText = String(material || '').trim().toUpperCase();
      const customerText = String(customer || '').trim().toUpperCase();
      const uom = String(uomOrder || '').trim().toUpperCase();
      const isCpp = materialText.includes('CPP');
      const isOpp = materialText.includes('OPP');
      // PP memakai jalur rumus yang sama dengan HD/PE. Batas token menjaga
      // agar PP di dalam CPP/OPP tidak ikut terbaca sebagai material PP.
      const isHdPePp =
        /(^|[^A-Z])(HDPE|HD|LLDPE|LDPE|PE|PP)([^A-Z]|$)/.test(materialText);

      if (uom === 'ROLL') {
        return {
          code: 'F',
          label: 'F · Order ROLL',
          sheetTitle: 'Logika Perhitungan Kirim ROLL',
          resultUom: 'ROLL'
        };
      }
      if (isCpp && isOpp && uom === 'PCS') {
        return {
          error: true,
          fieldId: 'material',
          message: 'Material memuat CPP dan OPP sekaligus. Pilih salah satu di Data Utama.'
        };
      }
      if (uom === 'PCS' && isCpp) {
        if (customerText.includes('MUSTIKA')) {
          return {
            code: 'A-MUSTIKA',
            label: 'A · CPP PCS Mustika',
            sheetTitle: 'Logika Perhitungan CPP PCS Mustika',
            resultUom: 'ROLL'
          };
        }
        return {
          code: 'A',
          label: 'A · CPP + PCS',
          sheetTitle: 'Logika Perhitungan CPP PCS',
          resultUom: 'KG'
        };
      }
      if (uom === 'PCS' && isOpp) {
        return {
          code: 'B',
          label: 'B · OPP + PCS',
          sheetTitle: 'Logika Perhitungan OPP PCS',
          resultUom: 'ROLL'
        };
      }
      if (uom === 'KG' && (isCpp || isOpp)) {
        return {
          code: 'C',
          label: 'C · CPP/OPP + KG',
          sheetTitle: 'Logika Perhitungan CPP/OPP KG',
          resultUom: 'ROLL'
        };
      }
      if (uom === 'PCS' && isHdPePp) {
        return {
          code: 'D',
          label: 'D · HD/PE/PP + PCS',
          sheetTitle: 'Logika Perhitungan HD/PE/PP PCS',
          resultUom: 'KG'
        };
      }
      if (uom === 'KG' && isHdPePp) {
        return {
          code: 'E',
          label: 'E · HD/PE/PP + KG',
          sheetTitle: 'Logika Perhitungan HD/PE/PP KG',
          resultUom: 'KG'
        };
      }

      return {
        error: true,
        fieldId: 'material',
        message: 'Material dan UOM belum masuk kategori A-F. Periksa Material di Data Utama.'
      };
    }

    function calculateRawMaterial_() {
      const material = document.getElementById('material').value;
      const customer = document.getElementById('customer').value;
      const film = document.getElementById('film').value;
      const ukuranBlow = document.getElementById('ukuranBlow').value;
      const ukuranJadi = document.getElementById('ukuranJadi').value;
      const jumlahOrder = parseCalculationNumber_(document.getElementById('jumlahOrder').value);
      const uomOrder = document.getElementById('uomOrder').value.toUpperCase();
      // Stok yang sudah ada memotong jumlah yang perlu diproduksi. Satuannya
      // sama dengan Jumlah Order karena keduanya menghitung barang jadi.
      const stok = parseCalculationNumber_(getFieldValue_('stok'));
      const ots = parseCalculationNumber_(getFieldValue_('ots'));
      const wip = parseCalculationNumber_(getFieldValue_('wip'));
      const orderSetelahStok = jumlahOrder === null
        ? null
        : Math.max(0, jumlahOrder - (stok === null ? 0 : stok));
      const meterRoll = uomOrder === 'ROLL'
        ? parseCalculationNumber_(document.getElementById('meterRoll').value)
        : null;
      const dimensions = getEffectiveDimensions_();
      const meter = getCalculationMeter_(dimensions.tebal, material);
      const density = getEffectiveDensity_(material);
      const filmLayerFactor = getFilmLayerFactor_(film);
      const meterPerKg = calculateMeterPerKg_(
        dimensions.lebar,
        dimensions.tebal,
        density,
        filmLayerFactor
      );
      const totalBs = getTotalBs_();
      const orderAfterBs = orderSetelahStok === null
        ? null
        : orderSetelahStok * (1 + (totalBs / 100));
      let pcsPerKg = null;
      let up = null;

      // PCS/KG memakai lebar jadi (angka pertama Ukuran Jadi), bukan
      // lebar bahan/blowing (angka pertama Ukuran Blow).
      if (
        dimensions.panjang > 0 &&
        dimensions.tebal > 0 &&
        dimensions.lebar > 0
      ) {
        pcsPerKg = 5444 /
          dimensions.panjang /
          dimensions.tebal /
          dimensions.lebar;
      }
      // Lembaran menghasilkan dua keping per kantong, jadi PCS/KG-nya dua kali
      // lipat. Kantong maupun mode kosong dipakai apa adanya.
      if (pcsPerKg !== null) pcsPerKg *= getPcsKgModeFactor_();
      up = dimensions.upTertulis;
      if (!(up > 0) && dimensions.lebar > 0 && dimensions.lebarBahan > 0) {
        up = Math.floor(dimensions.lebarBahan / dimensions.lebar);
      }

      const base = {
        ok: false,
        dimensions,
        meter,
        totalBs,
        orderAfterBs,
        pcsPerKg,
        density,
        filmLayerFactor,
        meterPerKg,
        up,
        meterRoll,
        stok,
        ots,
        wip,
        orderSetelahStok
      };

      if (!String(material).trim()) {
        return {
          ...base,
          incomplete: true,
          fieldId: 'material',
          message: 'Isi Material pada tab Data Utama.'
        };
      }

      const category = classifyRawMaterial_(material, uomOrder, customer);
      if (category.error) return { ...base, ...category };
      const categorizedBase = { ...base, category };

      if (!String(ukuranBlow).trim()) {
        return {
          ...categorizedBase,
          incomplete: true,
          fieldId: 'ukuranBlow',
          message: 'Isi Ukuran Blow.'
        };
      }
      if (!String(ukuranJadi).trim()) {
        return {
          ...categorizedBase,
          incomplete: true,
          fieldId: 'ukuranJadi',
          message: 'Isi Ukuran Jadi.'
        };
      }
      if (!(jumlahOrder > 0)) {
        return {
          ...categorizedBase,
          incomplete: true,
          fieldId: 'jumlahOrder',
          message: 'Isi Jumlah Order lebih dari 0.'
        };
      }

      let keluarBahan = null;
      if (category.code === 'A' || category.code === 'D') {
        if (!(pcsPerKg > 0)) {
          return {
            ...base,
            category,
            error: true,
            fieldId: 'ukuranJadi',
            message: 'Panjang, Tebal, atau Lebar Jadi belum valid.'
          };
        }
        keluarBahan = orderAfterBs / pcsPerKg;
      } else if (category.code === 'B' || category.code === 'A-MUSTIKA') {
        if (!(dimensions.panjang > 0) || !(meter > 0)) {
          return {
            ...base,
            category,
            error: true,
            fieldId: 'ukuranJadi',
            message: 'Panjang atau Tebal pada Ukuran Jadi belum valid.'
          };
        }
        keluarBahan = orderAfterBs * dimensions.panjang / 100 / meter;
      } else if (category.code === 'C') {
        if (!(dimensions.panjang > 0) || !(pcsPerKg > 0) || !(meter > 0)) {
          return {
            ...base,
            category,
            error: true,
            fieldId: 'ukuranJadi',
            message: 'Dimensi belum lengkap untuk kategori C.'
          };
        }
        keluarBahan = orderAfterBs * dimensions.panjang * pcsPerKg / 100 / meter;
      } else if (category.code === 'E') {
        keluarBahan = orderAfterBs;
      } else if (category.code === 'F') {
        if (!(meter > 0)) {
          return {
            ...base,
            category,
            error: true,
            fieldId: 'ukuranJadi',
            message: 'Tebal/Mikron belum valid untuk menentukan Meter.'
          };
        }
        if (!(up >= 1)) {
          return {
            ...base,
            category,
            error: true,
            fieldId: 'ukuranBlow',
            message: 'UP tidak valid. Lebar Bahan harus minimal sama dengan Lebar Jadi.'
          };
        }
        if (!(meterRoll > 0)) {
          return {
            ...base,
            category,
            incomplete: true,
            fieldId: 'meterRoll',
            message: 'Isi Meter/Roll untuk order ROLL.'
          };
        }
        keluarBahan = orderAfterBs * meterRoll / meter / up;
      }

      // UP yang ditulis pada Ukuran Blowing berlaku untuk seluruh kategori.
      // Kategori F dikecualikan karena rumusnya sudah membagi dengan UP.
      // Hanya UP tertulis yang dipakai, agar SPK tanpa keterangan UP pada
      // Ukuran Blowing tidak ikut berubah hasilnya.
      if (
        category.code !== 'F' &&
        dimensions.upTertulis > 0 &&
        keluarBahan !== null
      ) {
        keluarBahan = keluarBahan / dimensions.upTertulis;
      }

      // OTS menambah dan WIP mengurangi kebutuhan bahan. Keduanya dalam KG,
      // jadi hanya diterapkan pada hasil yang memang bersatuan KG; order ROLL
      // (kategori F) menghasilkan ROLL sehingga tidak ikut disesuaikan.
      if (keluarBahan !== null && category.resultUom !== 'ROLL') {
        if (ots !== null) keluarBahan += ots;
        if (wip !== null) keluarBahan -= wip;
        if (keluarBahan < 0) keluarBahan = 0;
      }

      if (!(keluarBahan >= 0) || !Number.isFinite(keluarBahan)) {
        return {
          ...base,
          category,
          error: true,
          message: 'Hasil tidak valid. Periksa dimensi dan order.'
        };
      }

      return {
        ...base,
        ok: true,
        incomplete: false,
        category,
        keluarBahan,
        uomKB: category.resultUom,
        message: 'Hasil otomatis kategori ' + category.code + '. Gunakan sebagai acuan; input Keluar Bahan bersifat opsional untuk Admin.'
      };
    }

    function formatCalculationNumber_(value, maximumFractionDigits, minimumFractionDigits) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return '—';
      const maximum = maximumFractionDigits === undefined ? 2 : maximumFractionDigits;
      const minimum = minimumFractionDigits === undefined ? 0 : minimumFractionDigits;
      return Number(value).toLocaleString('id-ID', {
        minimumFractionDigits: Math.min(minimum, maximum),
        maximumFractionDigits: maximum
      });
    }

    function setCalculationMetric_(id, value) {
      const element = document.getElementById(id);
      if (element) element.textContent = value;
    }

    function getCalculationOrderTypeNote_() {
      return 'Note: OPP - CPP - Kirim Roll, Mohon atur ukuran panjang sesuai meter kebutuhan!';
    }

    function buildCalculationSheetView_(result) {
      const category = result.category || null;
      const dimensions = result.dimensions || {};
      const material = document.getElementById('material').value;
      const jumlahOrder = parseCalculationNumber_(document.getElementById('jumlahOrder').value);
      const uomOrder = document.getElementById('uomOrder').value || 'PCS';
      const number = value => formatCalculationNumber_(value, 2);
      const resultNumber = value => formatCalculationNumber_(value, 2, 2);
      const orderLine = jumlahOrder > 0
        ? number(jumlahOrder) + ' ' + uomOrder +
          ' + ' + number(result.totalBs) + '% = ' +
          number(result.orderAfterBs) + ' ' + uomOrder
        : '—';

      let formulaLabel = 'Rumus';
      let formulaLine = '—';
      const references = [];

      // Kategori F menampilkan UP lewat rumusnya sendiri. Untuk kategori lain,
      // pembagian UP hanya terjadi bila angkanya ditulis pada Ukuran Blowing,
      // sehingga rumus yang tampil pun harus ikut menyebutkannya.
      const upTertulisAktif = category &&
        category.code !== 'F' &&
        dimensions.upTertulis > 0;
      const upLabelSuffix = upTertulisAktif ? ' ÷ UP' : '';
      const upValueSuffix = upTertulisAktif
        ? ' ÷ ' + number(dimensions.upTertulis)
        : '';

      if (category) {
        if (category.code === 'A' || category.code === 'D') {
          formulaLabel = 'Hasil ÷ Konversi PCS/KG' + upLabelSuffix;
          formulaLine =
            number(result.orderAfterBs) + ' ÷ ' +
            number(result.pcsPerKg) + upValueSuffix + ' = ' +
            (result.ok ? resultNumber(result.keluarBahan) + ' KG' : '—');
          references.push(
            'Panjang: ' + number(dimensions.panjang),
            'Tebal: ' + number(dimensions.tebal),
            'Lebar Jadi: ' + number(dimensions.lebar),
            'PCS/KG: ' + number(result.pcsPerKg)
          );
        } else if (category.code === 'B' || category.code === 'A-MUSTIKA') {
          formulaLabel = 'Hasil × Panjang ÷ 100 ÷ Meter' + upLabelSuffix;
          formulaLine =
            number(result.orderAfterBs) + ' × ' +
            number(dimensions.panjang) + ' ÷ 100 ÷ ' +
            number(result.meter) + upValueSuffix + ' = ' +
            (result.ok ? resultNumber(result.keluarBahan) + ' ROLL' : '—');
          references.push(
            'Panjang: ' + number(dimensions.panjang),
            'Tebal: ' + number(dimensions.tebal),
            'Meter: ' + number(result.meter)
          );
        } else if (category.code === 'C') {
          formulaLabel = 'Hasil × Panjang × Konversi PCS/KG ÷ 100 ÷ Meter' + upLabelSuffix;
          formulaLine =
            number(result.orderAfterBs) + ' × ' +
            number(dimensions.panjang) + ' × ' +
            number(result.pcsPerKg) + ' ÷ 100 ÷ ' +
            number(result.meter) + upValueSuffix + ' = ' +
            (result.ok ? resultNumber(result.keluarBahan) + ' ROLL' : '—');
          references.push(
            'Panjang: ' + number(dimensions.panjang),
            'Tebal: ' + number(dimensions.tebal),
            'Lebar Jadi: ' + number(dimensions.lebar),
            'PCS/KG: ' + number(result.pcsPerKg),
            'Meter: ' + number(result.meter)
          );
        } else if (category.code === 'E') {
          formulaLabel = 'Hasil' + upLabelSuffix;
          formulaLine =
            number(result.orderAfterBs) + ' KG' + upValueSuffix + ' = ' +
            (result.ok ? resultNumber(result.keluarBahan) + ' KG' : '—');
          references.push('Tidak memakai konversi; hasil sama dengan Order + BS.');
        } else if (category.code === 'F') {
          formulaLabel = 'Hasil × Meter Roll ÷ Meter ÷ UP';
          formulaLine =
            number(result.orderAfterBs) + ' × ' +
            number(result.meterRoll) + ' ÷ ' +
            number(result.meter) + ' ÷ ' +
            (result.up === null || result.up === undefined ? '—' : result.up) +
            ' UP = ' +
            (result.ok ? resultNumber(result.keluarBahan) + ' ROLL' : '—');
          references.push(
            'Lebar: ' + number(dimensions.lebar),
            'Lebar Bahan: ' + number(dimensions.lebarBahan),
            'Tebal: ' + number(dimensions.tebal),
            'Meter Roll: ' + number(result.meterRoll),
            'Meter: ' + number(result.meter),
            'UP: ' + (result.up === null || result.up === undefined ? '—' : result.up) +
              (dimensions.upTertulis > 0
                ? ' (tertulis pada Ukuran Blowing)'
                : ' (dihitung dari lebar)')
          );
        }
      }

      if (upTertulisAktif) {
        references.push(
          'UP: ' + number(dimensions.upTertulis) + ' (tertulis pada Ukuran Blowing)'
        );
      }

      if (
        category &&
        ['A-MUSTIKA', 'B', 'C', 'F'].includes(category.code) &&
        result.meter > 0
      ) {
        references.push(
          String(material || '').toUpperCase().includes('CPP')
            ? 'Aturan Meter CPP: tetap 6.000'
            : 'Meter dari Tebal ' + number(dimensions.tebal) + ': ' + number(result.meter)
        );
      }

      if (result.meterPerKg > 0) {
        references.push(
          'Meter/KG: ' + number(result.meterPerKg),
          'Density: ' + formatCalculationNumber_(result.density, 2),
          'Lapisan film: ' + result.filmLayerFactor
        );
      }

      return {
        title: category ? category.sheetTitle : 'Logika Perhitungan',
        categoryText: category
          ? (category.code === 'A-MUSTIKA' ? 'Kategori A · Khusus Mustika' : 'Kategori ' + category.code)
          : 'Kategori —',
        orderLine,
        formulaLabel,
        formulaLine,
        resultLine: result.ok
          ? resultNumber(result.keluarBahan) + ' ' + result.uomKB
          : '—',
        referenceLine: references.length
          ? references.join(' · ')
          : 'Kategori ditentukan dari Material dan UOM Order.',
        orderTypeNote: getCalculationOrderTypeNote_(),
        ukuranBlowing: document.getElementById('ukuranBlow').value.trim() || '—',
        jenisFilm: document.getElementById('film').value.trim() || '—',
        density: formatCalculationNumber_(result.density, 2),
        meterPerKg: formatCalculationNumber_(result.meterPerKg, 2)
      };
    }

    function renderRawMaterialCalculation_(result) {
      const card = document.getElementById('rawMaterialCalculation');
      const status = document.getElementById('calculationStatus');
      const message = document.getElementById('calculationMessage');
      const sheetView = buildCalculationSheetView_(result);

      card.classList.toggle('is-ready', Boolean(result.ok));
      card.classList.toggle('is-error', Boolean(!result.ok && result.error));
      status.textContent = result.ok ? 'Siap' : (result.error ? 'Periksa input' : 'Belum lengkap');
      message.textContent = result.message || 'Lengkapi data perhitungan.';

      setCalculationMetric_('calcSheetTitle', sheetView.title);
      setCalculationMetric_('calcSheetCategory', sheetView.categoryText);
      setCalculationMetric_('calcOrderLine', sheetView.orderLine);
      setCalculationMetric_('calcFormulaLabel', sheetView.formulaLabel);
      setCalculationMetric_('calcFormulaLine', sheetView.formulaLine);
      setCalculationMetric_('calcResult', sheetView.resultLine);
      setCalculationMetric_('calcReferenceDetail', sheetView.referenceLine);
      setCalculationMetric_('calcOrderTypeNote', sheetView.orderTypeNote);
      setCalculationMetric_('calcUkuranBlowing', sheetView.ukuranBlowing);
      setCalculationMetric_('calcJenisFilm', sheetView.jenisFilm);
      setCalculationMetric_('calcDensity', sheetView.density);
      setCalculationMetric_('calcMeterPerKg', sheetView.meterPerKg);
    }

    // Rumus PCS/KG di Database: 5444 / panjang / tebal / lebar (kolom M-O).
    // Ditiru di sini hanya untuk ditampilkan; kolom R tetap berisi rumus.
    function getFieldValue_(id) {
      const field = document.getElementById(id);
      return field ? field.value : '';
    }

    // Lembaran menggandakan PCS/KG. Kantong dan mode yang belum dipilih
    // memakai nilai apa adanya.
    function getPcsKgModeFactor_() {
      return String(getFieldValue_('pcsKgMode') || '').toUpperCase() === 'LEMBARAN' ? 2 : 1;
    }

    // Density dan jumlah lapisan film sepenuhnya turunan dari Jenis Bahan dan
    // Film di Data Utama. Panel Blowing hanya menampilkannya kembali.
    function syncMaterialDerivedFields_() {
      const material = getFieldValue_('material');
      const film = getFieldValue_('film');

      const filmMirror = document.getElementById('blowingFilmDisplay');
      if (filmMirror) filmMirror.value = film || '';

      const densityMirror = document.getElementById('blowingDensityDisplay');
      if (densityMirror) {
        const density = getEffectiveDensity_(material);
        densityMirror.value = density === null ? '' : formatCalculationNumber_(density, 2, 2);
      }

      syncBahanUkuranDisplays_();
      recalculateRawMaterial_();
    }

    // Label satuan Stok mengikuti UOM Order karena keduanya menghitung barang
    // jadi yang sama.
    function syncStokUomHint_() {
      const hint = document.getElementById('stokUomHint');
      if (!hint) return;
      const uom = String(getFieldValue_('uomOrder') || 'PCS').toUpperCase();
      hint.textContent = '(' + (uom || 'PCS') + ')';
    }

    function updatePcsPerKgDisplay_() {
      const field = document.getElementById('pcsPerKgDisplay');
      if (!field) return;

      const dimensions = getEffectiveDimensions_();
      const lebar = parseCalculationNumber_(dimensions.lebar);
      const panjang = parseCalculationNumber_(dimensions.panjang);
      const tebal = parseCalculationNumber_(dimensions.tebal);

      if (!(lebar > 0) || !(panjang > 0) || !(tebal > 0)) {
        field.value = '';
        return;
      }

      field.value = formatCalculationNumber_(
        (5444 / panjang / tebal / lebar) * getPcsKgModeFactor_(),
        2,
        2
      );
    }

    function recalculateRawMaterial_() {
      updatePcsPerKgDisplay_();

      rawMaterialCalculation = calculateRawMaterial_();
      renderRawMaterialCalculation_(rawMaterialCalculation);
    }

    // ==========================================
    // WIZARD
    // ==========================================
    function bindWizardTracking_() {
      formEl.addEventListener('input', event => {
        if (event.target.classList.contains('wizard-invalid') && String(event.target.value).trim() !== '') {
          event.target.classList.remove('wizard-invalid');
        }
        updateWizardState_();
      });

      formEl.addEventListener('change', () => updateWizardState_());
    }

    function getProgressLevel_(filled, total) {
      if (total > 0 && filled >= total) return 'complete';
      if (total > 0 && filled / total >= 0.5) return 'half';
      return 'low';
    }

    function getStepTabStatus_(step) {
      if (step === 1) {
        const mode = getOrderMode_();
        const fieldIds = [
          mode === 'repeat' ? 'spkRepeat' : 'spkNew',
          'tanggal',
          'marketing',
          'nomorPO',
          'customer',
          'material',
          'film',
          'artikel',
          'kodeItem',
          'keteranganWarna',
          'keteranganBahan',
          'keteranganArtikel',
          'modelKantong',
          'etd'
        ];
        if (mode === 'repeat') fieldIds.unshift('spkSebelumnya');

        const filled = fieldIds.filter(id => {
          const field = document.getElementById(id);
          return field && String(field.value).trim() !== '';
        }).length;

        return {
          text: filled + '/' + fieldIds.length + ' terisi',
          level: getProgressLevel_(filled, fieldIds.length)
        };
      }

      if (step === 2) {
        const filled = BS_LIST.filter(item => {
          const field = document.getElementById('bs-' + item.key);
          return field && Number(field.value) > 0;
        }).length;

        return {
          text: filled + '/' + BS_LIST.length + ' terisi',
          level: getProgressLevel_(filled, BS_LIST.length)
        };
      }

      if (step === 3) {
        let total = 0;
        let filled = 0;

        bahanRows.forEach((row, index) => {
          const values = index === MAX_BAHAN - 1
            ? [row.material]
            : [row.material, row.kg, row.percent];
          total += values.length;
          filled += values.filter(value =>
            String(value === null || value === undefined ? '' : value).trim() !== ''
          ).length;
        });

        return {
          text: filled + '/' + total + ' terisi',
          level: getProgressLevel_(filled, total)
        };
      }

      if (step === 4) {
        const cuttingStep = findFirstRoutingStep_('cutting');
        const filled = [
          routingSteps.length > 0,
          Boolean(cuttingStep) && String(stepValue_(cuttingStep, 'finishing') || '-') !== '-',
          Boolean(cuttingStep) && String(stepValue_(cuttingStep, 'handlePm') || '-') !== '-'
        ].filter(Boolean).length;

        return {
          text: filled + '/3 terisi',
          level: getProgressLevel_(filled, 3)
        };
      }

      if (step === 5) {
        const values = [
          document.getElementById('ukuranBlow').value,
          document.getElementById('ukuranJadi').value,
          document.getElementById('jumlahOrder').value
        ];
        if (document.getElementById('uomOrder').value === 'ROLL') {
          values.push(document.getElementById('meterRoll').value);
        }
        const filled = values.filter(value => String(value).trim() !== '').length;
        return {
          text: filled + '/' + values.length + ' terisi',
          level: getProgressLevel_(filled, values.length)
        };
      }

      return { text: 'Belum mulai', level: 'low' };
    }




    // Dulu berpindah panel; kini seluruh bagian selalu tampil sehingga
    // fungsinya hanya menggulir ke bagian yang dituju.
    function changeStep_(targetStep) {
      const target = document.querySelector(`[data-panel="${targetStep}"]`);
      if (target && typeof target.scrollIntoView === 'function') {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }


    function validateStep_(step, showAlert) {
      clearWizardInvalid_();

      if (step === 1) {
        const missing = [];
        const tanggal = document.getElementById('tanggal');
        const customer = document.getElementById('customer');
        const material = document.getElementById('material');
        const etd = document.getElementById('etd');
        const etdDisplay = document.querySelector('[data-partial-date]') ||
          document.getElementById('partialList');
        const mode = getOrderMode_();
        const targetUi = getActiveTargetSpkUi_();
        const targetState = getActiveTargetSpkState_();

        if (mode === 'repeat') {
          if (spkSebelumnyaField.value.trim() === '') {
            missing.push('SPK Item Sebelumnya');
            spkSebelumnyaField.classList.add('wizard-invalid');
          }
          if (repeatLookupState.state !== 'found') {
            if (repeatLookupState.state === 'checking') {
              if (showAlert) showValidationAlert_('SPK Lama Sedang Dicari', 'Tunggu sampai data SPK sebelumnya selesai dimuat.');
              return false;
            }
            if (spkSebelumnyaField.value.trim() !== '') {
              if (showAlert) showValidationAlert_('SPK Lama Belum Ditemukan', 'Pastikan SPK item sebelumnya ditemukan dan data berhasil dimuat.');
              spkSebelumnyaField.classList.add('wizard-invalid');
              spkSebelumnyaField.focus();
              return false;
            }
          }
        }

        if (targetUi.field.value.trim() === '') {
          missing.push(mode === 'repeat' ? 'Nomor SPK Repeat Baru' : 'Nomor SPK New Order');
          targetUi.field.classList.add('wizard-invalid');
        }
        if (tanggal.value === '') {
          missing.push('Tanggal');
          tanggal.classList.add('wizard-invalid');
        }
        if (customer.value.trim() === '') {
          missing.push('Customer');
          customer.classList.add('wizard-invalid');
        }
        if (material.value.trim() === '') {
          missing.push('Material');
          material.classList.add('wizard-invalid');
        }
        if (etd.value === '') {
          missing.push('Tanggal Kirim');
          if (etdDisplay) etdDisplay.classList.add('wizard-invalid');
        }

        if (missing.length) {
          if (showAlert) showValidationAlert_('Data Utama Belum Lengkap', 'Lengkapi: ' + missing.join(', ') + '.');
          focusFirstInvalid_();
          return false;
        }

        const keteranganWarnaField = document.getElementById('keteranganWarna');
        const keteranganWarnaValue = String(keteranganWarnaField.value || '').trim();
        if (keteranganWarnaValue !== '' && !/^\d+(?:\+\d+)?$/.test(keteranganWarnaValue)) {
          keteranganWarnaField.classList.add('wizard-invalid');
          if (showAlert) showValidationAlert_('Keterangan Warna Belum Valid', 'Gunakan angka atau format angka+angka, contoh 5+1.');
          keteranganWarnaField.focus();
          return false;
        }

        const keteranganBahanField = document.getElementById('keteranganBahan');
        if (
          keteranganBahanField.value !== '' &&
          !['BAHAN INTERNAL', 'BAHAN DARI LUAR'].includes(keteranganBahanField.value)
        ) {
          keteranganBahanField.classList.add('wizard-invalid');
          if (showAlert) showValidationAlert_('Keterangan Bahan Belum Valid', 'Pilih Bahan Internal atau Bahan dari Luar.');
          keteranganBahanField.focus();
          return false;
        }

        if (mode === 'repeat' && normalizeClientSpk_(targetUi.field.value) === normalizeClientSpk_(spkSebelumnyaField.value)) {
          targetUi.field.classList.add('wizard-invalid');
          if (showAlert) showValidationAlert_('Nomor SPK Tidak Boleh Sama', 'SPK repeat baru harus berbeda dari SPK item sebelumnya.');
          targetUi.field.focus();
          return false;
        }

        if (targetState.state === 'checking') {
          if (showAlert) showValidationAlert_('SPK Sedang Diperiksa', 'Tunggu sampai pengecekan nomor SPK baru selesai.');
          return false;
        }

        if (targetState.state === 'duplicate' || targetState.duplicate) {
          if (showAlert) showValidationAlert_('SPK Sudah Ada', 'Ganti nomor SPK baru sebelum melanjutkan.');
          targetUi.field.focus();
          return false;
        }

        if (targetState.state !== 'available') {
          if (showAlert) showValidationAlert_('SPK Belum Terverifikasi', 'Ketik nomor SPK baru lalu tunggu hingga statusnya tersedia.');
          targetUi.field.focus();
          return false;
        }
      }

      if (step === 5) {
        recalculateRawMaterial_();
        const ukuranJadiField = document.getElementById('ukuranJadi');
        const jumlahOrderField = document.getElementById('jumlahOrder');
        const uomOrderField = document.getElementById('uomOrder');
        const meterRollField = document.getElementById('meterRoll');
        const keluarBahanField = document.getElementById('keluarBahan');
        const uomKbField = document.getElementById('uomKB');
        const jumlahOrder = parseCalculationNumber_(jumlahOrderField.value);
        const meterRoll = parseCalculationNumber_(meterRollField.value);
        const manualKeluarBahan = parseCalculationNumber_(keluarBahanField.value);

        if (ukuranJadiField.value.trim() === '') {
          ukuranJadiField.classList.add('wizard-invalid');
          if (showAlert) showValidationAlert_('Data Utama Belum Lengkap', 'Lengkapi: Ukuran Jadi.');
          ukuranJadiField.focus();
          return false;
        }

        if (!(jumlahOrder > 0)) {
          jumlahOrderField.classList.add('wizard-invalid');
          if (showAlert) showValidationAlert_('Data Utama Belum Lengkap', 'Jumlah Order wajib lebih dari 0.');
          jumlahOrderField.focus();
          return false;
        }

        if (!['PCS', 'KG', 'ROLL'].includes(uomOrderField.value)) {
          uomOrderField.classList.add('wizard-invalid');
          if (showAlert) showValidationAlert_('UOM Order Belum Valid', 'Pilih PCS, KG, atau ROLL.');
          uomOrderField.focus();
          return false;
        }

        if (uomOrderField.value === 'ROLL' && !(meterRoll > 0)) {
          meterRollField.classList.add('wizard-invalid');
          if (showAlert) {
            showValidationAlert_(
              'Meter/Roll Belum Lengkap',
              'Isi Meter/Roll lebih dari 0 untuk order ROLL.'
            );
          }
          meterRollField.focus();
          return false;
        }

        if (keluarBahanField.value.trim() !== '' && !(manualKeluarBahan > 0)) {
          keluarBahanField.classList.add('wizard-invalid');
          if (showAlert) {
            showValidationAlert_(
              'Keluar Bahan Belum Valid',
              'Kosongkan kolom atau isi Keluar Bahan lebih dari 0.'
            );
          }
          keluarBahanField.focus();
          return false;
        }

        if (
          keluarBahanField.value.trim() !== '' &&
          !['KG', 'ROLL'].includes(uomKbField.value)
        ) {
          uomKbField.classList.add('wizard-invalid');
          if (showAlert) {
            showValidationAlert_('UOM Keluar Bahan Belum Valid', 'Pilih UOM KG atau ROLL.');
          }
          uomKbField.focus();
          return false;
        }

        // Perhitungan bahan tetap ditampilkan sebagai bantuan, tetapi hasil
        // yang belum lengkap tidak lagi menghalangi penyimpanan Data Utama.
      }

      return true;
    }

    function validateAllSteps_() {
      if (!validateStep_(1, false)) {
        changeStep_(1, 'backward');
        validateStep_(1, true);
        return false;
      }
      if (!validateStep_(5, false)) {
        changeStep_(5, currentStep > 5 ? 'backward' : 'forward');
        validateStep_(5, true);
        return false;
      }
      return true;
    }

    function updateWizardState_() {
      document.querySelectorAll('.wizard-tab').forEach(tab => {
        const step = Number(tab.dataset.step);
        const active = step === currentStep;
        const status = tab.querySelector('.wizard-tab-status');
        const tabStatus = getStepTabStatus_(step);
        const complete = tabStatus.level === 'complete';

        tab.classList.toggle('active', active);
        tab.classList.toggle('completed', complete);
        tab.classList.toggle('progress-complete', tabStatus.level === 'complete');
        tab.classList.toggle('progress-half', tabStatus.level === 'half');
        tab.classList.toggle('progress-low', tabStatus.level === 'low');
        tab.setAttribute('aria-selected', active ? 'true' : 'false');

        status.textContent = tabStatus.text;
      });

      updateNavigationButtons_();
    }

    function updateNavigationButtons_() {
      if (btnSubmitEl.dataset.saving) return;

      btnSubmitEl.innerHTML = `
        SIMPAN KE DATABASE
        <svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      `;

      // Selama nomor SPK masih diperiksa ke server, penyimpanan ditahan
      // agar tidak menabrak nomor yang ternyata sudah terpakai.
      const activeTargetState = getActiveTargetSpkState_();
      const repeatIsChecking = getOrderMode_() === 'repeat' && repeatLookupState.state === 'checking';
      btnSubmitEl.disabled = activeTargetState.state === 'checking' || repeatIsChecking;
    }

    function showValidationAlert_(title, text) {
      Swal.fire({
        icon: 'warning',
        title: title,
        text: text,
        confirmButtonColor: '#202020',
        background: '#e0e5ec',
        customClass: { popup: 'swal2-popup-neumorphic' }
      });
    }

    function clearWizardInvalid_() {
      document.querySelectorAll('.wizard-invalid').forEach(el => el.classList.remove('wizard-invalid'));
    }

    // Kolom yang bermasalah bisa berada di panel routing yang sedang
    // tertutup; panelnya dibuka lebih dulu agar bisa benar-benar dilihat.
    function focusFirstInvalid_() {
      const first = document.querySelector('.wizard-invalid');
      if (!first) return;

      const panel = first.closest('.route-panel');
      if (panel && panel.hidden) {
        const key = String(panel.id || '').replace('route-', '');
        activeRoutingKey = key;
        syncRoutingTabs_();
        syncWarnaVisibility_();
        syncBsSheetVisibility_();
      syncBahanUkuranVisibility_();
      }

      if (typeof first.scrollIntoView === 'function') {
        first.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      first.focus();
    }

    // ==========================================
    // JENIS ORDER & REPEAT ORDER
    // ==========================================
    function bindOrderTypeEvents_() {
      TARGET_SPK_UI.new.field.addEventListener('input', () => handleTargetSpkInput_('new'));
      TARGET_SPK_UI.repeat.field.addEventListener('input', () => handleTargetSpkInput_('repeat'));
      spkSebelumnyaField.addEventListener('input', handleRepeatSourceInput_);
    }

    function getOrderMode_() {
      return jenisOrderField.value === 'Repeat Order' ? 'repeat' : 'new';
    }

    function getActiveTargetSpkUi_() {
      return TARGET_SPK_UI[getOrderMode_()];
    }

    function getActiveTargetSpkState_() {
      return targetSpkStates[getOrderMode_()];
    }

    function getActiveSpkValue_() {
      return getActiveTargetSpkUi_().field.value.trim().toUpperCase();
    }

    function normalizeClientSpk_(value) {
      return String(value === null || value === undefined ? '' : value).trim().toUpperCase();
    }

    function setOrderType_(type, options) {
      const opts = options || {};
      const isRepeat = type === 'Repeat Order';
      jenisOrderField.value = isRepeat ? 'Repeat Order' : 'New Order';

      // Satu kolom Tanggal PO Masuk dipakai kedua mode. Elemennya dipindah,
      // bukan diduplikasi, agar tidak ada dua ID yang sama dan nilainya tidak
      // perlu disinkronkan. Sebelumnya kolom ini tertinggal di blok New Order
      // sehingga tidak pernah tampil saat mode Repeat Order.
      const newOrderSection = document.getElementById('newOrderSpkSection');
      const repeatOrderSection = document.getElementById('repeatOrderSpkSection');
      const poMasukInlineField = document.getElementById('poMasukInlineField');
      const activeOrderSection = isRepeat ? repeatOrderSection : newOrderSection;
      if (poMasukInlineField && activeOrderSection && poMasukInlineField.parentElement !== activeOrderSection) {
        activeOrderSection.appendChild(poMasukInlineField);
      }

      document.getElementById('orderTypeNew').classList.toggle('active', !isRepeat);
      document.getElementById('orderTypeRepeat').classList.toggle('active', isRepeat);
      document.getElementById('orderTypeNew').setAttribute('aria-pressed', String(!isRepeat));
      document.getElementById('orderTypeRepeat').setAttribute('aria-pressed', String(isRepeat));
      newOrderSection.classList.toggle('order-mode-hidden', isRepeat);
      repeatOrderSection.classList.toggle('order-mode-hidden', !isRepeat);

      window.dispatchEvent(new CustomEvent('spk-order-mode', {
        detail: isRepeat ? 'repeat' : 'new'
      }));

      clearWizardInvalid_();
      recalculateRawMaterial_();
      updateWizardState_();

      if (opts.focus !== false) {
        setTimeout(() => {
          (isRepeat ? spkSebelumnyaField : TARGET_SPK_UI.new.field).focus();
        }, 30);
      }
    }

    function handleTargetSpkInput_(mode) {
      const ui = TARGET_SPK_UI[mode];
      const state = targetSpkStates[mode];
      ui.field.value = ui.field.value.toUpperCase();
      ui.field.classList.remove('wizard-invalid');
      clearTimeout(state.timer);

      const seq = ++state.seq;
      const value = ui.field.value.trim();

      if (value === '') {
        setTargetSpkIdle_(mode);
        return;
      }

      setTargetSpkChecking_(mode);
      const snapshot = getFreshSpkExistenceSnapshot_();
      if (!snapshot) warmSpkExistenceSnapshot_();
      state.timer = setTimeout(() => {
        const currentSnapshot = getFreshSpkExistenceSnapshot_();
        if (currentSnapshot) {
          if (seq !== state.seq) return;
          currentSnapshot.has(normalizeClientSpk_(value))
            ? setTargetSpkDuplicate_(mode, value)
            : setTargetSpkAvailable_(mode);
          return;
        }

        google.script.run
          .withSuccessHandler(res => {
            if (seq !== state.seq) return;
            if (res.status === 'success') {
              res.exists ? setTargetSpkDuplicate_(mode, value) : setTargetSpkAvailable_(mode);
            } else {
              setTargetSpkIdle_(mode);
              showSystemError_('Gagal Memeriksa SPK', res.message);
            }
          })
          .withFailureHandler(err => {
            if (seq !== state.seq) return;
            setTargetSpkIdle_(mode);
            showSystemError_('Gagal Memeriksa SPK', err.message);
          })
          .checkSpkExists(value);
      }, snapshot ? 70 : 180);
    }

    function resetTargetSpkVisual_(mode) {
      const ui = TARGET_SPK_UI[mode];
      ui.field.classList.remove('field-error', 'field-success');
      ui.statusIcon.classList.remove('state-checking', 'state-success', 'state-error');
    }

    function setTargetSpkIdle_(mode) {
      resetTargetSpkVisual_(mode);
      targetSpkStates[mode].duplicate = false;
      targetSpkStates[mode].state = 'idle';
      updateWizardState_();
    }

    function setTargetSpkChecking_(mode) {
      resetTargetSpkVisual_(mode);
      TARGET_SPK_UI[mode].statusIcon.classList.add('state-checking');
      targetSpkStates[mode].duplicate = true;
      targetSpkStates[mode].state = 'checking';
      updateWizardState_();
    }

    function setTargetSpkDuplicate_(mode, value) {
      const ui = TARGET_SPK_UI[mode];
      resetTargetSpkVisual_(mode);
      ui.field.classList.add('field-error');
      ui.statusIcon.classList.add('state-error');
      targetSpkStates[mode].duplicate = true;
      targetSpkStates[mode].state = 'duplicate';
      updateWizardState_();
    }

    function setTargetSpkAvailable_(mode) {
      const ui = TARGET_SPK_UI[mode];
      resetTargetSpkVisual_(mode);
      ui.field.classList.add('field-success');
      ui.statusIcon.classList.add('state-success');
      targetSpkStates[mode].duplicate = false;
      targetSpkStates[mode].state = 'available';
      updateWizardState_();
    }

    function handleRepeatSourceInput_() {
      spkSebelumnyaField.value = spkSebelumnyaField.value.toUpperCase();
      spkSebelumnyaField.classList.remove('wizard-invalid', 'field-error', 'field-success');
      recalculateRawMaterial_();
      clearTimeout(repeatLookupState.timer);

      const value = spkSebelumnyaField.value.trim();
      const seq = ++repeatLookupState.seq;

      if (repeatLookupState.loadedSpk && normalizeClientSpk_(value) !== repeatLookupState.loadedSpk) {
        clearRepeatLoadedFields_();
      }

      if (value === '') {
        setRepeatLookupIdle_();
        return;
      }

      setRepeatLookupChecking_();
      repeatLookupState.timer = setTimeout(() => {
        google.script.run
          .withSuccessHandler(res => {
            if (seq !== repeatLookupState.seq) return;

            if (res.status === 'success' && res.found) {
              applyRepeatData_(res.data);
              setRepeatLookupFound_(res.data);
            } else if (res.status === 'not_found' || (res.status === 'success' && !res.found)) {
              setRepeatLookupNotFound_(value, res.message || 'Nomor SPK tidak ditemukan di Database.');
            } else {
              setRepeatLookupError_(res.message || 'Data SPK gagal dimuat.');
            }
          })
          .withFailureHandler(err => {
            if (seq !== repeatLookupState.seq) return;
            setRepeatLookupError_(err.message || 'Data SPK gagal dimuat.');
          })
          .getSpkData(value);
      }, 450);
    }

    function resetRepeatLookupVisual_() {
      const icon = document.getElementById('repeatLookupStatusIcon');
      icon.classList.remove('state-checking', 'state-success', 'state-error');
      spkSebelumnyaField.classList.remove('field-error', 'field-success');
    }

    function setRepeatLookupIdle_() {
      resetRepeatLookupVisual_();
      repeatLookupState.state = 'idle';
      repeatLookupState.loadedSpk = '';
      updateWizardState_();
    }

    function setRepeatLookupChecking_() {
      resetRepeatLookupVisual_();
      document.getElementById('repeatLookupStatusIcon').classList.add('state-checking');
      repeatLookupState.state = 'checking';
      repeatLookupState.loadedSpk = '';
      updateWizardState_();
    }

    function setRepeatLookupFound_(data) {
      resetRepeatLookupVisual_();
      document.getElementById('repeatLookupStatusIcon').classList.add('state-success');
      spkSebelumnyaField.classList.add('field-success');

      repeatLookupState.state = 'found';
      repeatLookupState.loadedSpk = normalizeClientSpk_(data.spk);
      updateWizardState_();
    }

    function setRepeatLookupNotFound_(value, message) {
      resetRepeatLookupVisual_();
      document.getElementById('repeatLookupStatusIcon').classList.add('state-error');
      spkSebelumnyaField.classList.add('field-error');

      repeatLookupState.state = 'notfound';
      repeatLookupState.loadedSpk = '';
      updateWizardState_();
    }

    function setRepeatLookupError_(message) {
      resetRepeatLookupVisual_();
      document.getElementById('repeatLookupStatusIcon').classList.add('state-error');
      spkSebelumnyaField.classList.add('field-error');

      repeatLookupState.state = 'error';
      repeatLookupState.loadedSpk = '';
      updateWizardState_();
    }

    function applyRepeatData_(data) {
      const preservedRepeatSpk = TARGET_SPK_UI.repeat.field.value;
      clearAutomaticRouteSizeMarkers_();

      // Tanggal repeat order adalah tanggal transaksi baru, bukan tanggal SPK sumber.
      // Pertahankan tanggal yang sudah dipilih pengguna; jika kosong, gunakan hari ini.
      if (!document.getElementById('tanggal').value) setTanggalHariIni_();
      setFieldValue_('marketing', data.marketing);
      setFieldValue_('nomorPO', data.nomorPO);
      setFieldValue_('customer', data.customer);
      setFieldValue_('material', data.material);
      setFieldValue_('film', data.film);
      setFieldValue_('artikel', data.artikel);
      setFieldValue_('kodeItem', data.kodeItem);
      setFieldValue_('keteranganWarna', data.keteranganWarna);
      setFieldValue_('keteranganBahan', data.keteranganBahan);
      setFieldValue_('keteranganArtikel', data.keteranganArtikel);
      setFieldValue_('modelKantong', data.modelKantong);
      setFieldValue_('ukuranBlow', data.ukuranBlow);
      setFieldValue_('ukuranJadi', data.ukuranJadi);
      setFieldValue_('blowingThreat', data.blowingThreat || 'NON THREAT');
      setFieldValue_('blowingModeCetak', data.blowingModeCetak || 'NON PRINT');
      setFieldValue_('printingKodeSilinder', data.printingKodeSilinder);
      setFieldValue_('ukuranFolding', data.ukuranFolding);
      setFieldValue_('ukuranSlitting', data.ukuranSlitting);
      setFieldValue_('ukuranGusset', data.ukuranGusset);
      setFieldValue_('pcsKgMode', data.pcsKgMode);
      setFieldValue_('jenisPotongan', data.jenisPotongan);
      setFieldValue_('toleransiProduksi', data.toleransiProduksi);
      // Ukuran bahan ikut dibawa karena menggambarkan barangnya, bukan
      // keadaan sesaat seperti Stok atau WIP.
      setBahanUkuranManual_({
        lebar: data.bahanLebar,
        panjang: data.bahanPanjang,
        tebal: data.bahanTebal,
        density: data.bahanDensity
      });
      // Stok, OTS, dan WIP menggambarkan keadaan persediaan saat itu, jadi
      // tidak ikut dibawa ke SPK repeat yang baru.
      setFieldValue_('stok', '');
      setFieldValue_('ots', '');
      setFieldValue_('wip', '');
      setPoMasukValue_('');
      // Jadwal kirim milik SPK sumber tidak dibawa; tanggalnya selalu
      // ditentukan ulang untuk SPK repeat yang baru.
      setPengirimanRows_([]);
      setFieldValue_('jenisPacking', data.jenisPacking);
      setFieldValue_('packing', data.packing);
      setFieldValue_('finishing', data.finishing || '-');
      setFieldValue_('handlePm', data.handlePm || '-');
      setFieldValue_('jumlahOrder', data.jumlahOrder);
      setFieldValue_('uomOrder', data.uomOrder || 'PCS');
      setFieldValue_('meterRoll', data.meterRoll);
      // Keluar Bahan repeat order tetap dimulai kosong agar nilai SPK baru
      // ditentukan secara sadar oleh Admin atau dikelola Manager PPIC.
      setFieldValue_('keluarBahan', '');
      setFieldValue_('uomKB', '');
      setFieldValue_(
        'toleransi',
        String(data.toleransi || '').toUpperCase() === 'PASS'
          ? ''
          : data.toleransi
      );

      PROSES_LIST.forEach(item => {
        const checked = Boolean(data.proses && data.proses[item.key]);
        const input = document.getElementById('proses-' + item.key);
        if (input) input.checked = checked;
        if (item.noteLabel) {
          setFieldValue_(
            'ket-' + item.key,
            data.keteranganProses && data.keteranganProses[item.key]
          );
        }
      });
      ['bottomSeal', 'sideSeal', 'tshirt'].forEach(function(key) {
        setFieldValue_(
          'ket-' + key,
          data.keteranganProses && data.keteranganProses[key]
        );
      });

      // Cutting mengikuti ada tidaknya finishing atau Handle/Pon pada SPK sumber.
      const cuttingInput = document.getElementById('proses-cutting');
      if (cuttingInput) {
        cuttingInput.checked = Boolean(
          FINISHING_NOTE_KEY_MAP[String(data.finishing || '-').toUpperCase()] ||
          ['HANDLE', 'PON'].includes(String(data.handlePm || '-').toUpperCase())
        );
      }

      // Untuk Repeat Order, ukuran turunan hanya diterapkan pada proses
      // Folding, Slitting, atau Gusset yang benar-benar berjalan di SPK sumber.
      syncRepeatAutomaticRouteSizes_();

      // Target BS diisi lebih dulu karena jalur cadangan di bawah membangun
      // langkah dari nilai yang sedang ada di panel.
      BS_LIST.forEach(item => {
        const input = document.getElementById('bs-' + item.key);
        if (input) input.value = data.bsPercent && data.bsPercent[item.key] !== undefined ? data.bsPercent[item.key] : '';
      });

      activeRoutingKey = '';
      activeStepId = 0;
      restoreRoutingStepsFromData_(data);

      ROUTING_LIST.forEach(function(item) { syncRoutePanel_(item.key); });
      updateFinishingNoteVisibility_();
      updateTotalProses_();
      syncRoutingEmpty_();
      syncWarnaVisibility_();
      syncBsSheetVisibility_();
      syncBahanUkuranVisibility_();
      hitungTotalBs();

      bahanRows = [];
      (data.komposisi || []).slice(0, MAX_BAHAN).forEach(item => {
        bahanIdCounter += 1;
        bahanRows.push({
          id: bahanIdCounter,
          material: item.material || '',
          kg: item.kg === null || item.kg === undefined ? '' : item.kg,
          percent: item.percent === null || item.percent === undefined ? '' : item.percent
        });
      });
      while (bahanRows.length < 2) {
        bahanIdCounter += 1;
        bahanRows.push({ id: bahanIdCounter, material: '', kg: '', percent: '' });
      }
      renderBahanList();

      warnaRows = [];
      (data.warna || []).slice(0, MAX_WARNA).forEach(item => {
        if (
          String(item.nama || '').trim() === '' &&
          String(item.pemakaian === null || item.pemakaian === undefined ? '' : item.pemakaian).trim() === ''
        ) return;
        warnaIdCounter += 1;
        warnaRows.push({
          id: warnaIdCounter,
          nama: item.nama || '',
          pemakaian: item.pemakaian === null || item.pemakaian === undefined ? '' : item.pemakaian
        });
      });
      renderWarnaList();
      renderSavedRoutingList_();

      TARGET_SPK_UI.repeat.field.value = preservedRepeatSpk;
      if (preservedRepeatSpk.trim() === '') setTargetSpkIdle_('repeat');

      completedSteps.clear();
      updateWizardState_();
    }

    function clearRepeatLoadedFields_() {
      [
        'marketing', 'nomorPO', 'customer', 'material', 'film', 'artikel', 'kodeItem',
        'keteranganWarna', 'keteranganBahan', 'keteranganArtikel', 'modelKantong', 'ukuranBlow', 'ukuranJadi', 'jumlahOrder',
        'meterRoll', 'keluarBahan', 'toleransi', 'printingKodeSilinder',
        'ukuranFolding', 'ukuranSlitting', 'ukuranGusset', 'lebarGusset',
        'jenisPacking', 'packing', 'packingOuterBall', 'packingBallNilai', 'packingBallUom',
        'packingRollNilai', 'packingRollUom',
        'pcsKgMode', 'jenisPotongan', 'toleransiProduksi', 'stok', 'ots', 'wip'
      ].forEach(id => setFieldValue_(id, ''));
      setPoMasukValue_('');
      setPengirimanRows_([]);
      setBahanUkuranManual_({});
      updatePackingDetailVisibility_();
      clearAutomaticRouteSizeMarkers_();
      setTanggalHariIni_();
      setFieldValue_('finishing', '-');
      setFieldValue_('handlePm', '-');

    function normalizeKeteranganWarnaValue_(value) {

    function normalizeKeteranganBahanValue_(value) {
      const normalized = String(value === null || value === undefined ? '' : value)
        .trim()
        .toUpperCase()
        .replace(/\s+/g, ' ');
      if (normalized === 'BAHAN INTERNAL' || normalized === 'INTERNAL') return 'BAHAN INTERNAL';
      if (
        normalized === 'BAHAN DARI LUAR' ||
        normalized === 'BAHAN LUAR' ||
        normalized === 'DARI LUAR' ||
        normalized === 'LUAR' ||
        normalized === 'EKSTERNAL' ||
        normalized === 'EXTERNAL'
      ) return 'BAHAN DARI LUAR';
      return '';
    }

    function buildEtdIso_(year, month, day) {
      const safeYear = Number(year);
      const safeMonth = Number(month);
      const safeDay = Number(day);
      if (!Number.isInteger(safeYear) || !Number.isInteger(safeMonth) || !Number.isInteger(safeDay)) return '';
      if (safeYear < 2000 || safeYear > 2100 || safeMonth < 1 || safeMonth > 12 || safeDay < 1 || safeDay > 31) return '';

      const candidate = new Date(Date.UTC(safeYear, safeMonth - 1, safeDay));
      if (
        candidate.getUTCFullYear() !== safeYear ||
        candidate.getUTCMonth() !== safeMonth - 1 ||
        candidate.getUTCDate() !== safeDay
      ) return '';

      return [
        String(safeYear).padStart(4, '0'),
        String(safeMonth).padStart(2, '0'),
        String(safeDay).padStart(2, '0')
      ].join('-');
    }

    function parseEtdQuickValue_(value) {
      const raw = String(value === null || value === undefined ? '' : value).trim();
      if (!raw) return '';

      let match = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (match) return buildEtdIso_(match[1], match[2], match[3]);

      match = raw.match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2}|\d{4}))?$/);
      if (match) {
        let year = match[3] ? Number(match[3]) : new Date().getFullYear();
        if (year < 100) year += 2000;
        return buildEtdIso_(year, match[2], match[1]);
      }

      const monthPattern = ETD_MONTH_NAMES.join('|');
      match = raw.match(new RegExp('^(\\d{1,2})\\s+(' + monthPattern + ')\\s+(\\d{4})$', 'i'));
      if (match) {
        const monthIndex = ETD_MONTH_NAMES.findIndex(function(monthName) {
          return monthName.toLowerCase() === match[2].toLowerCase();
        });
        return buildEtdIso_(match[3], monthIndex + 1, match[1]);
      }

      return '';
    }

    function formatEtdLong_(isoValue) {
      const match = String(isoValue || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!match) return '';
      return String(Number(match[3])).padStart(2, '0') + ' ' + ETD_MONTH_NAMES[Number(match[2]) - 1] + ' ' + match[1];
    }

    function setQuickDateValue_(hiddenId, displayId, value) {
      const hidden = document.getElementById(hiddenId);

      const raw = String(value === null || value === undefined ? '' : value).trim();

      hidden.value = isoValue;
      display.value = isoValue ? formatEtdLong_(isoValue) : raw;
      display.classList.toggle('wizard-invalid', Boolean(raw && !isoValue));
    }

    // ETD kini tahap pertama pada Jadwal Kirim, bukan kolom tersendiri.

    function commitQuickDate_(hiddenId, displayId) {
      const hidden = document.getElementById(hiddenId);
      const display = document.getElementById(displayId);
      if (!hidden || !display) return false;

      const raw = display.value.trim();
      if (!raw) {

    function bindQuickDateInput_(hiddenId, displayId, commit, setTimer, clearTimer) {

        if (completeQuickDate) setTimer(window.setTimeout(commit, 550));

    // ==========================================
    // ALUR PRODUKSI
    // ==========================================
    function deriveAutomaticRouteSize_(ukuranJadiValue) {
      const raw = String(ukuranJadiValue === null || ukuranJadiValue === undefined ? '' : ukuranJadiValue)
        .trim()
        .replace(/\s+/g, ' ');
      if (!raw) return '';

      const dimensions = raw
        .split(/\s*[x\u00d7]\s*/i)
        .map(function(part) { return part.trim(); })
        .filter(Boolean);
      if (dimensions.length < 3) return '';

      const widthAndFold = dimensions[0].replace(/\s*\/\s*/g, '/');
      const thickness = dimensions[dimensions.length - 1];
      if (!/^\d+(?:[.,]\d+)?\/\d+(?:[.,]\d+)?$/.test(widthAndFold)) return '';
      if (!/^\d+(?:[.,]\d+)?(?:\s*(?:MM|MIC|MICRON|MIKRON))?$/i.test(thickness)) return '';

      return widthAndFold + ' X ' + thickness;
    }

    function clearAutomaticRouteSizeMarkers_() {
      Object.keys(AUTOMATIC_ROUTE_SIZE_FIELDS).forEach(function(key) {
        const field = document.getElementById(AUTOMATIC_ROUTE_SIZE_FIELDS[key]);
        if (field) delete field.dataset.automaticRouteSize;
      });
    }

    function setAutomaticRouteSizeForProcess_(key, options) {
      const fieldId = AUTOMATIC_ROUTE_SIZE_FIELDS[key];
      const field = fieldId ? document.getElementById(fieldId) : null;
      const ukuranJadi = document.getElementById('ukuranJadi');
      if (!field || !ukuranJadi) return false;

      const opts = options || {};
      const derived = deriveAutomaticRouteSize_(ukuranJadi.value);
      const currentValue = String(field.value || '').trim();
      const previousAutomatic = String(field.dataset.automaticRouteSize || '').trim();

      if (!derived) {
        if (previousAutomatic && currentValue === previousAutomatic) {
          field.value = '';
          delete field.dataset.automaticRouteSize;
          return true;
        }
        return false;
      }

      if (!opts.force && currentValue && currentValue !== previousAutomatic) return false;
      if (currentValue === derived && previousAutomatic === derived) return false;

      field.value = derived;
      field.dataset.automaticRouteSize = derived;
      return true;
    }

    // Ukuran turunan mengikuti Ukuran Jadi hanya pada langkah yang nilainya
    // memang masih hasil isian otomatis. Langkah yang ukurannya sudah diubah
    // operator ditandai auto = false dan tidak pernah ditimpa.
    function syncAutomaticRouteSizesFromMain_() {
      const ukuranJadi = document.getElementById('ukuranJadi');
      const derived = ukuranJadi ? (deriveAutomaticRouteSize_(ukuranJadi.value) || '') : '';

      if (activeRoutingKey && AUTOMATIC_ROUTE_SIZE_FIELDS[activeRoutingKey]) {
        setAutomaticRouteSizeForProcess_(activeRoutingKey);
      }

      routingSteps.forEach(function(step) {
        const sizeField = AUTOMATIC_ROUTE_SIZE_FIELDS[step.key];
        if (!sizeField || !step.auto) return;
        if (activeStepId === step.id) return; // panel terbuka sudah ditangani di atas
        step.values[sizeField] = derived;
      });

      renderSavedRoutingList_();
    }

    function syncRepeatAutomaticRouteSizes_() {
      const derived = deriveAutomaticRouteSize_(document.getElementById('ukuranJadi').value);
      if (!derived) return;

      Object.keys(AUTOMATIC_ROUTE_SIZE_FIELDS).forEach(function(key) {
        const processInput = document.getElementById('proses-' + key);
        const field = document.getElementById(AUTOMATIC_ROUTE_SIZE_FIELDS[key]);
        if (!field) return;

        if (processInput && processInput.checked) {
          setAutomaticRouteSizeForProcess_(key, { force: true });
          return;
        }

        // Data ukuran proses yang tidak berjalan tidak dibawa ke Repeat Order.
        field.value = '';
        delete field.dataset.automaticRouteSize;
      });
    }

    function bindAutomaticRouteSizeInputs_() {

          if (automaticValue && String(field.value || '').trim() !== automaticValue) {

    // Ukuran bahan boleh diketik sendiri. Nilai yang diketik disimpan di sini,
    // sedangkan kolom yang dibiarkan kosong tetap diisi hasil pembacaan Ukuran
    // Blowing, Ukuran Jadi, dan Jenis Bahan. Dengan begitu pengisian otomatis
    // tidak pernah menimpa angka yang sudah ditentukan operator.
    const BAHAN_UKURAN_FIELDS = {
      lebar: { id: 'bahanLebarDisplay', decimals: 2 },
      panjang: { id: 'bahanPanjangDisplay', decimals: 2 },
      tebal: { id: 'bahanTebalDisplay', decimals: 3 },
      density: { id: 'bahanDensityDisplay', decimals: 2 }
    };
    let bahanUkuranManual = { lebar: '', panjang: '', tebal: '', density: '' };

    // Kolom bertipe number hanya menerima titik sebagai pemisah desimal, jadi
    // pengisian otomatis tidak boleh memakai format ribuan Indonesia.
    function bahanUkuranAutoText_(value, decimals) {
      if (!(value > 0)) return '';
      return String(Number(Number(value).toFixed(decimals)));
    }

    function bahanUkuranAda_() {
      return Object.keys(bahanUkuranManual).some(function(key) {

    function resetBahanUkuranManual_() {

    // Mengisi kolom yang masih kosong dengan hasil pembacaan otomatis. Kolom
    // yang sudah diketik operator dibiarkan apa adanya.
    function syncBahanUkuranDisplays_() {
      const dimensions = parseCalculationDimensions_(
        getFieldValue_('ukuranBlow'),
        getFieldValue_('ukuranJadi')
      );
      const density = getCalculationDensity_(getFieldValue_('material'));
      const otomatis = {
        lebar: dimensions.lebar,
        panjang: dimensions.panjang,
        tebal: dimensions.tebal,
        density: density === null ? 0 : density
      };

      Object.keys(BAHAN_UKURAN_FIELDS).forEach(function(key) {
        const setelan = BAHAN_UKURAN_FIELDS[key];
        const field = document.getElementById(setelan.id);
        if (!field) return;
        if (String(bahanUkuranManual[key] || '').trim() !== '') return;
        field.value = bahanUkuranAutoText_(otomatis[key], setelan.decimals);
      });

      syncBahanUkuranResetButton_();
    }

    // Ukuran yang dipakai seluruh perhitungan: hasil pembacaan Ukuran Blowing
    // dan Ukuran Jadi, ditimpa angka manual pada kolom yang diisi.
    function getEffectiveDimensions_() {
      const dimensions = parseCalculationDimensions_(
        getFieldValue_('ukuranBlow'),
        getFieldValue_('ukuranJadi')
      );

      ['lebar', 'panjang', 'tebal'].forEach(function(key) {
        const manual = parseCalculationNumber_(bahanUkuranManual[key]);
        if (manual !== null && manual > 0) dimensions[key] = manual;
      });

      return dimensions;
    }

    function getEffectiveDensity_(material) {
      const manual = parseCalculationNumber_(bahanUkuranManual.density);
      if (manual !== null && manual > 0) return manual;
      return getCalculationDensity_(material);
    }

    function setBahanUkuranManual_(nilai) {

    // Blok ukuran bahan berpindah ke panel yang sedang dibuka, sepola dengan
