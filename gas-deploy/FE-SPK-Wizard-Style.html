  #spkInputRoot .routing-chip.checked .routing-chip-mark {

  /* ==========================================================

     nomor SPK mendapat panel khusus agar mudah dipindai dan diisi.
     ========================================================== */
  #spkInputRoot .spk-identity-bar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 12px 16px;
    margin-bottom: 12px;
    padding-bottom: 13px;
    border-bottom: 1px solid rgba(140,143,145,.34);
  }

  #spkInputRoot .identity-heading {
    display: flex;
    min-width: 0;
    align-items: center;
    gap: 10px;
  }

  #spkInputRoot .identity-heading .form-group-icon {
    width: 32px;
    height: 32px;
    flex: 0 0 32px;
    border-radius: 9px;
    color: #861818;
    background: linear-gradient(180deg, #fff, #e5e6e3);
    box-shadow: inset 0 1px 0 #fff, 0 2px 4px rgba(31,33,36,.12);

    width: 16px;

    text-shadow: 0 1px 0 #fff;
    white-space: nowrap;
  }

  #spkInputRoot .spk-identity-bar .order-type-segment {
    grid-column: 2;
    grid-row: 1;
    min-height: 38px;
    margin: 0;
    padding: 3px;
    border-radius: 10px;
    background: linear-gradient(180deg, #d9dad8, #c9cbc8);
    box-shadow: inset 0 2px 4px rgba(0,0,0,.15), 0 1px 0 #fff;

  #spkInputRoot .spk-identity-bar .order-type-option {
    min-width: 92px;
    min-height: 30px;

    gap: 7px;
    border-radius: 7px;

  #spkInputRoot .spk-identity-bar .order-type-option::before {
    content: '';

    height: 6px;
    flex: 0 0 6px;
    border-radius: 50%;

  #spkInputRoot .spk-identity-bar .order-type-option.active::before {
    background: #fff;

  /* Tanggal Kirim berpindah mengikuti mode order. New Order memakai dua
     kolom, sedangkan Repeat Order memakai tiga kolom sama rata. */
  #spkInputRoot .spk-inline-group {
    display: grid;
    grid-column: 1 / -1;
    grid-row: 2;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    min-width: 0;
    padding: 9px 10px 10px;
    border: 1px solid #bec1c2;
    border-radius: 11px;
    background:
      linear-gradient(145deg, rgba(255,255,255,.72), transparent 44%),

    box-shadow: inset 0 1px 0 #fff, 0 2px 5px rgba(31,33,36,.07);
  }

  #spkInputRoot #newOrderSpkSection {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  #spkInputRoot #repeatOrderSpkSection {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  #spkInputRoot .spk-inline {
    display: flex;
    flex: 1 1 0;
    flex-direction: column;
    min-width: 0;
  }

  #spkInputRoot .spk-inline .field-label {
    min-height: 17px;
    margin-bottom: 4px;
    color: #4f5256;
    font-size: .67rem;
    letter-spacing: .03em;

  #spkInputRoot .spk-inline .spk-wrapper {
    width: 100%;

  #spkInputRoot .spk-identity-bar .spk-wrapper .field-input {
    min-height: 39px;
    height: 39px;
    padding: 7px 42px 7px 11px;
    border-color: #aeb1b2;
    border-radius: 9px;
    background: #fff;
    box-shadow: inset 0 1px 2px rgba(31,33,36,.09), 0 1px 0 #fff;
    font-size: .78rem;

  #spkInputRoot .spk-identity-bar .spk-wrapper .field-input:focus {
    border-color: #8d1515;
    box-shadow: inset 0 1px 2px rgba(31,33,36,.07), 0 0 0 3px rgba(141,21,21,.11);

     saat tidak ada yang perlu ditampilkan. */
  #spkInputRoot .spk-note-strip {
    display: contents;
  }

  /* Status Repeat Order mengikuti dua kolom input SPK di atasnya: data SPK
     sumber di kiri dan validasi nomor SPK repeat baru di kanan. */
  #spkInputRoot #repeatOrderSpkNotes {
    display: grid;

  #spkInputRoot #repeatOrderSpkNotes > .spk-success-note {
    grid-column: 2;
  }

  #spkInputRoot #repeatOrderSpkNotes > .repeat-result-card:not(.show),
  #spkInputRoot #repeatOrderSpkNotes > .spk-warning-card:not(.show),
  #spkInputRoot #repeatOrderSpkNotes > .spk-success-note:not(.show) {

  }

  #spkInputRoot #repeatOrderSpkNotes > .repeat-result-card,
  #spkInputRoot #repeatOrderSpkNotes > .spk-warning-card,
  #spkInputRoot #repeatOrderSpkNotes > .spk-success-note {

  #spkInputRoot #repeatOrderSpkNotes .spk-warning-card > div {

  #spkInputRoot #repeatOrderSpkNotes .repeat-result-title,

    line-height: 1.15;

  #spkInputRoot #repeatOrderSpkNotes .repeat-result-desc,

  #spkInputRoot #repeatOrderSpkNotes .spk-warning-card {
    gap: 8px;
  }

  #spkInputRoot #repeatOrderSpkNotes .spk-success-note.show {

  #spkInputRoot #repeatOrderSpkNotes .spk-warning-card.show {

  #spkInputRoot .spk-note-strip .spk-warning-card.show,
  #spkInputRoot .spk-note-strip .spk-success-note.show,
  #spkInputRoot .spk-note-strip .repeat-result-card.show {
