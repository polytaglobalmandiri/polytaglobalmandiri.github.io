<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>POLYTA GLOBAL MANDIRI — Koneksi Terputus</title>
<!--
  Halaman ini sengaja berdiri sendiri: seluruh gaya ditulis di dalamnya
  dan lambangnya digambar sebagai SVG sebaris. Tidak ada satu pun
  permintaan ke luar, termasuk ke skeuo.css maupun status.css, karena
  halaman ini justru dipakai ketika berkas dari jaringan tidak dapat
  diambil. Rupanya dijaga sama dengan panel status pada aplikasi.
-->
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --canvas-a: #fafafb;
    --canvas-b: #d9d9df;
    --panel-a: #ffffff;
    --panel-b: #ececef;
    --panel-edge: #bfbfc8;
    --ink: #15151a;
    --ink-soft: #4c4c56;
    --ink-mute: #7c7c88;
    --accent: #c8102e;
    --accent-hi: #e63b52;
    --accent-lo: #8a0b1f;
    --shadow: 0 20px 44px rgba(12, 12, 18, .28), 0 2px 0 rgba(255, 255, 255, .7) inset;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --canvas-a: #1b1b1f;
      --canvas-b: #08080a;
      --panel-a: #26262b;
      --panel-b: #17171b;
      --panel-edge: #09090b;
      --ink: #f6f6f8;
      --ink-soft: #b6b6c0;
      --ink-mute: #85858f;
      --accent: #ff4757;
      --accent-hi: #ff8892;
      --accent-lo: #a3101f;
      --shadow: 0 22px 48px rgba(0, 0, 0, .62), 0 1px 0 rgba(255, 255, 255, .07) inset;
    }
  }

  html, body { height: 100%; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: clamp(16px, 4vw, 40px);
    padding-top: calc(env(safe-area-inset-top, 0px) + clamp(16px, 4vw, 40px));
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(16px, 4vw, 40px));
    color: var(--ink);
    background: radial-gradient(circle at 50% 0%, var(--canvas-a), var(--canvas-b));
    font-family: "Segoe UI", Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  .plate {
    position: relative;
    width: min(520px, 100%);
    margin: auto;
    padding: clamp(22px, 5vw, 36px) clamp(20px, 5vw, 38px) clamp(18px, 4vw, 28px);
    border: 1px solid var(--panel-edge);
    border-radius: 20px;
    background: linear-gradient(180deg, var(--panel-a), var(--panel-b));
    box-shadow: var(--shadow);
    text-align: center;
    overflow: hidden;
  }

  .plate::before {
    position: absolute;
    inset: 0;
    background: linear-gradient(122deg, rgba(255, 255, 255, .5) 0%, rgba(255, 255, 255, .05) 32%, transparent 55%);
    content: "";
    pointer-events: none;
  }

  @media (prefers-color-scheme: dark) {
    .plate::before { background: linear-gradient(122deg, rgba(255, 255, 255, .08) 0%, transparent 48%); }
  }

  .plate > * { position: relative; }

  .mark {
    display: grid;
    place-items: center;
    width: 62px;
    height: 62px;
    margin: 0 auto 15px;
    padding: 8px;
    border: 1px solid var(--panel-edge);
    border-radius: 16px;
    background: linear-gradient(145deg, #f8f8fa, #c8c8d1 55%, #9a9aa7);
    box-shadow: inset 0 1px 0 #fff, 0 3px 8px rgba(12, 12, 18, .22);
  }

  .mark svg { width: 100%; height: 100%; }

  .eyebrow {
    margin: 0 0 6px;
    color: var(--ink-mute);
    font-size: .62rem;
    font-weight: 700;
    letter-spacing: .18em;
    text-transform: uppercase;
  }

  h1 {
    margin: 0 0 10px;
    font-size: clamp(1.12rem, 1rem + 1vw, 1.42rem);
    font-weight: 800;
    letter-spacing: -.01em;
    line-height: 1.25;
  }

  p.message {
    margin: 0;
    color: var(--ink-soft);
    font-size: clamp(.82rem, .78rem + .2vw, .9rem);
    line-height: 1.65;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    padding: 7px 14px;
    border: 1px solid var(--panel-edge);
    border-radius: 999px;
    color: var(--ink-soft);
    font-size: .72rem;
    font-weight: 600;
  }

  .status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s ease-out infinite;
  }

  body[data-connection="online"] .status-dot {
    background: #2ca846;
    animation: none;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(200, 16, 46, .5); }
    70% { box-shadow: 0 0 0 7px rgba(200, 16, 46, 0); }
    100% { box-shadow: 0 0 0 0 rgba(200, 16, 46, 0); }
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 9px;
    margin-top: 20px;
  }

  .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 40px;
    padding: 10px 18px;
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    color: var(--ink);
    background: linear-gradient(180deg, var(--panel-a), var(--panel-b));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .8), 0 2px 4px rgba(12, 12, 18, .16);
    font: inherit;
    font-size: .76rem;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
  }

  .button:active { transform: translateY(1px); }

  .button:focus-visible {
    outline: 3px solid var(--accent-hi);
    outline-offset: 2px;
  }

  .button.is-primary {
    border-color: var(--accent-lo);
    color: #fff;
    background: linear-gradient(180deg, var(--accent-hi), var(--accent) 55%, var(--accent-lo));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 2px 5px rgba(140, 15, 28, .35);
  }

  .foot {
    margin: 18px 0 0;
    color: var(--ink-mute);
    font-size: .6rem;
    letter-spacing: .07em;
    line-height: 1.6;
  }

  .foot strong {
    color: var(--ink-soft);
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  @media (max-width: 380px) {
    .plate { padding-inline: 17px; }
    .actions { flex-direction: column; align-items: stretch; }
    .button { width: 100%; }
  }

  @media (max-height: 460px) and (orientation: landscape) {
    body { align-items: flex-start; }
    .mark { width: 46px; height: 46px; margin-bottom: 10px; }
    .foot { display: none; }
  }

  @media (pointer: coarse) {
    .button { min-height: 44px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .status-dot { animation: none; }
  }
</style>
</head>
<body data-connection="offline">
  <div class="plate" role="alert">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 120 120" focusable="false">
        <path d="M14 12h50v43h42v53h-8V63H64v45H14V55h42V20H14z" fill="#111216"/>
        <rect x="15" y="22" width="41" height="12" rx="6" fill="#4563b3"/>
        <rect x="22" y="63" width="34" height="37" fill="#ef2631"/>
        <rect x="84" y="64" width="11" height="44" rx="5.5" fill="#40b84e"/>
      </svg>
    </div>
    <p class="eyebrow">POLYTA GLOBAL MANDIRI</p>
    <h1>Koneksi terputus</h1>
    <p class="message">
      Perangkat ini sedang tidak tersambung ke jaringan, sehingga portal belum
      dapat dimuat. Periksa sambungan Internet atau Wi-Fi, lalu coba lagi.
    </p>

    <div class="status" id="statusPill">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="statusText">Menunggu jaringan kembali</span>
    </div>

    <div class="actions">
      <button type="button" class="button is-primary" id="retryButton">Coba lagi</button>
      <a class="button" href="/" target="_top">Kembali ke portal</a>
    </div>

    <p class="foot">Dikembangkan dan dikelola oleh: <strong>Team POLYTA GLOBAL MANDIRI</strong></p>
  </div>

<script>
  /* Halaman ini memantau jaringannya sendiri. Begitu sambungan pulih,
     penandanya berubah hijau supaya pengguna tahu tombolnya sudah ada
     gunanya ditekan, tanpa memuat ulang sendiri agar tidak mengejutkan. */
  (function watchConnection() {
    var body = document.body;
    var statusText = document.getElementById("statusText");
    var retry = document.getElementById("retryButton");

    function apply() {
      var online = navigator.onLine !== false;
      body.setAttribute("data-connection", online ? "online" : "offline");
      statusText.textContent = online
        ? "Jaringan tersambung kembali"
        : "Menunggu jaringan kembali";
    }

    retry.addEventListener("click", function () {
      // Riwayat dipakai lebih dulu supaya pengguna kembali ke halaman
      // yang sedang dibukanya, bukan selalu ke beranda.
      if (document.referrer) {
        window.location.replace(document.referrer);
        return;
      }
      window.location.replace("/");
    });

    window.addEventListener("online", apply);
    window.addEventListener("offline", apply);
    apply();
  })();
</script>
</body>
</html>
